거리에는 늦은 오후의 햇빛이 ==비스듬히== 내려앉았고, 지나가는 사람들의 그림자가 유리창 위로 길게 늘어졌다. 그는 그 그림자들을 하나씩 세다가, 문득 손끝으로 테이블 위에 놓인 낡은 편지를 만지작거렸다.

"버리면 편할 텐데."

"아직은, 아니야."

그가 짧게 대답했다. 창밖으로는 여전히 사람들이 오갔고, 카페 안의 낮은 음악 소리와 함께 시간은 ==아무 일도 없었다는 듯== 흘러갔다. 그녀는 더 묻지 않았다. 대신 그의 손 위에 자신의 손을 가만히 포갰다.

*그렇게 둘은 한참을 말없이 앉아 있었다.* 이윽고 해가 완전히 저물었을 때, 그는 마침내 ^작은 목소리로^ 입을 열었다.

"고마워, 기다려줘서."</textarea>
