*그렇게 둘은 한참을 말없이 앉아 있었다.* 이윽고 해가 완전히 저물었을 때, 그는 마침내 ^작은 목소리로^ 입을 열었다.

                  <div class="quote-preset-save-buttons">

                    <button
                      class="save-button quote-preset-new-button imory-button imory-button--primary imory-button--md"
                      id="quoteNewButton"
                      type="button"
                      title="목록에 새 프리셋으로 추가"
                    >
                      새로 만들기
                    </button>

                    <button
                      class="save-button quote-preset-save-button imory-button imory-button--primary imory-button--md"
                      id="quoteSaveButton"
                      type="button"
                      title="현재 선택된 프리셋에 덮어쓰기"
                      disabled
                    >
                      덮어쓰기
                    </button>

                  </div>


                </div>


                <p
                  class="save-message quote-preset-message"
                  id="quoteSaveMessage"
                ></p>


                <div class="quote-preset-list-wrap">

                  <div class="quote-setting-label">
                    저장된 프리셋

                  <div
                    class="quote-preset-list"
                    id="quotePresetList"
                  ></div>

                </div>


              </div>

          <!-- =================================================
               RIGHT : PREVIEW
          ================================================== -->

          <section class="quote-preview-panel">

            <div class="quote-preview-heading imory-section-header imory-section-header--plain">

              <span>
                PREVIEW
              </span>

              <small
                id="quotePreviewSize"
              >
                1080 × 1080
              </small>

            </div>


            <!--
              배율 조정은 핀치 확대/축소, 리셋은 더블탭으로만
              한다(admin-quote-preview-gesture.js) — 예전엔
              여기에 −/%/+/FIT 툴바가 stage 위에 겹쳐 떠 있었지만
              캔버스를 가리기만 해서 없앴다. wrap은 아래
              .quote-preview-help 위치 기준점으로만 쓰임.
            -->

            <div class="quote-preview-stage-wrap">

            <div
              class="quote-preview-stage"
              id="quotePreviewStage"
            >

              <!--
                ★ 페이지 한 장(제목/본문/출처)은 여기 static
                마크업이 아니라 글쓰기 화면과 **같은 코드**가
                만든다 — posts/preview/posts-page-layout.js의
                paginatePostPages()가 이 host 안에
                .post-editor-preview-page를 채운다
                (admin-quote-preview-update.js 참고).
                그래서 본문 폭·줄바꿈·문단 간격·출처 자리·
                페이지 나눔이 에디터 PREVIEW와 같은 계산을
                거친다.
              -->

              <div
                class="quote-preview-canvas post-editor-preview-pages"
                id="quotePreviewCanvas"
              ></div>

            </div>


            <p
              class="quote-preview-help"
              id="quotePreviewHelp"
            >
              두 손가락으로 확대·축소, 두 번 탭하면 전체 보기
            </p>

            </div>


            <!--
              샘플이 한 장을 넘치면 잘라내지 않고 다음 장으로
              넘긴다 — 만들어진 장을 실제로 넘겨볼 수 있게
              최소한의 이동만 둔다.
            -->

            <div
              class="quote-preview-pagination"
              id="quotePreviewPagination"
              hidden
            >

              <button
                type="button"
                class="quote-preview-page-button"
                id="quotePreviewPrev"
              >
                ‹
              </button>

              <span
                class="quote-preview-page-indicator"
                id="quotePreviewPageIndicator"
              >
                1 / 1
              </span>

              <button
                type="button"
                class="quote-preview-page-button"
                id="quotePreviewNext"
              >
                ›
              </button>

            </div>

          </section>


        </div>

      </section>
