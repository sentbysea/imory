  <!-- =========================================================
       ADMIN QUOTE PANEL LOADER

       admin.js가 최상위 스코프에서 곧바로
       document.getElementById("quotePanel")과
       document.getElementById("quoteBackButton") 등을 참조하고
       (quote/admin-quote-refs.js 이하 전부 동일 — quotePanel
       내부 요소들을 최상위에서 즉시 참조), admin-session.js도
       quoteBackButton에 최상위에서 바로 addEventListener를 건다.

       quotePanel 마크업을 admin-quote-panel.html로 분리해
       fetch로 비동기 주입하게 되면서, 이 스크립트들이 그 주입보다
       먼저 실행되면 quotePanel/quoteBackButton 등이 아직 DOM에
       없어 즉시 에러가 난다. 그래서 admin.js부터 site-footer.js
       까지 전부, 마크업 주입이 끝난 뒤 순서대로 동적 <script>
       태그로 로드한다(순서는 원래 정적 태그 순서와 동일하게 유지
       — posts.html 로더와 같은 방식, setTimeout 등 임의 지연 없음).
  ========================================================== -->

  <script>

    async function loadAdminQuoteModule() {

      const cacheBuster =
        Date.now();


      const quotePanelMount =
        document.getElementById(
          "quotePanelMount"
        );


      if (!quotePanelMount) {
        return;
      }


      try {

        /* ---------------------------------------------
           QUOTE PANEL HTML 불러오기
        ---------------------------------------------- */

        const response =
          await fetch(
            `./quote/admin-quote-panel.html?v=${cacheBuster}`
          );


        if (!response.ok) {

          throw new Error(
            `admin-quote-panel.html load failed: ${response.status}`
          );

        }


        const quotePanelHTML =
          await response.text();


        /* ---------------------------------------------
           QUOTE PANEL HTML 삽입
        ---------------------------------------------- */

        quotePanelMount.innerHTML =
          quotePanelHTML;


        /* ---------------------------------------------
           ADMIN JS 실행

           HTML이 전부 들어온 다음에만 실행한다.

           admin.js가 최상위에서 quotePanel을,
           admin-session.js가 최상위에서 quoteBackButton을
           바로 참조하므로 반드시 이 순서.
        ---------------------------------------------- */

        const adminDependencyScripts =
          [
            "./admin.js",
            "./admin-session.js",
            "./settings/admin-settings-load.js",
            "./settings/admin-my-banner.js",
            "./settings/admin-settings-save.js",

            /*
              옛 admin-quote.js(2900줄+)를 기능별로 쪼갠 파일들.
              admin-quote-refs.js가 DOM 참조/상태를 담고 있어서
              반드시 이 그룹의 맨 처음, admin-quote-preset-crud.js가
              실제 초기 실행부라 반드시 맨 마지막이어야 함.
            */

            "./quote/admin-quote-refs.js",
            "./quote/admin-quote-accordion.js",
            "./quote/admin-quote-ratio-parser.js",
            "./quote/admin-quote-preview-update.js",
            "./quote/admin-quote-live-inputs.js",
            "./quote/admin-quote-apply-preset.js",
            "./quote/admin-quote-preset-list.js",
            "./quote/admin-quote-preset-crud.js",

            /*
              restoreQuoteAccordionState()(preset-crud.js 맨 끝에서
              실행)가 localStorage에 저장된 개별 아코디언
              open/close 상태를 되돌리는데, 모바일 탭 필터가
              그보다 먼저 적용돼 있으면 그 상태에 덮어써질 수
              있어서 반드시 이 파일이 맨 마지막에 로드돼야 함.
            */

            "./quote/admin-quote-mobile-tabs.js",
            "./quote/admin-quote-preview-gesture.js",

            "../site-footer.js"
          ];


        for (
          const src of adminDependencyScripts
        ) {

          const dependencyScript =
            document.createElement(
              "script"
            );


          dependencyScript.src =
            `${src}?v=${cacheBuster}`;


          await new Promise(
            (resolve, reject) => {

              dependencyScript.onload =
                resolve;


              dependencyScript.onerror =
                reject;


              document.body.appendChild(
                dependencyScript
              );

            }
          );

        }


        /* ---------------------------------------------
           checkSession() 보정

           admin-session.js가 최상위에서
           window.addEventListener("load", checkSession)로
           checkSession을 건다. 원래는 admin-session.js가
           정적 <script> 태그라 페이지 파싱 중에 곧바로 로드돼서
           이 등록이 실제 "load" 이벤트보다 항상 먼저 끝났는데,
           이제 admin-session.js 자체가 quotePanel fetch 이후에
           동적으로 로드되면서, 그 사이 로딩 시간 때문에 이 등록이
           실제 "load" 이벤트보다 늦어질 수 있다 — "load"는 한
           번만 발생하는 이벤트라 이러면 리스너가 영영 안
           불려서 checkSession()이 실행되지 않고, 그 안에서
           호출되는 loadAdminSettings()(카테고리/BGM/소개글/
           MY BANNER 로딩)도 같이 실행되지 않는다.

           document.readyState는 "load" 이벤트가 발생하기
           직전에 "complete"로 바뀌므로, 이 시점에 이미
           "complete"라면 그 리스너가 놓친 것이므로 지금 한 번
           직접 호출해서 보정한다. 아직 "complete"가 아니라면
           (느린 스타일시트 등) 원래 리스너가 나중에 정상적으로
           불릴 것이므로 아무 것도 하지 않는다(중복 호출 방지).
        ---------------------------------------------- */

        if (
          document.readyState === "complete" &&
          typeof checkSession === "function"
        ) {

          checkSession();

        }


        console.log(
          "admin quote module loaded"
        );

      }


      catch (error) {

        console.error(
          "admin quote module load failed:",
          error
        );

      }

    }


    loadAdminQuoteModule();

  </script>
