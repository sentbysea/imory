<!-- =========================================================
     POSTS
========================================================== -->

<!-- =========================================================
     PUBLISHED SKIN 전환 대기 표시(posts-view-transition.js).
     CATEGORY/POST가 published Skin 경로를 탈 수 있는 대상일 때만,
     응답이 오래 걸릴 경우에 한해 잠깐 보인다 — 클릭 불가
     (pointer-events:none)라 중복 이동을 유발하지 않는다.

     ★ #postArea 바깥(#postsMount 직속)에 둔다. published Skin
     경로는 다음 화면이 완성될 때까지 이전 화면을 그대로 두고
     #postArea를 hidden으로 유지하는데(posts-view-list.js/
     posts-view-detail.js의 revealPostArea 지점), 이 표시가
     #postArea 안에 있으면 정작 기다리는 그 시간 동안 함께
     display:none이 되어 절대 보이지 않는다. position:fixed라
     어느 쪽에 있든 화면상 위치는 동일하다.
========================================================== -->

<div
  class="post-pending-indicator"
  id="postPendingIndicator"
  hidden
  aria-hidden="true"
></div>


<section
  class="post-area"
  id="postArea"
  hidden
>

  <div class="post-container" id="postContainer">


    <!-- =====================================================
         POST HEADER
    ====================================================== -->

    <header class="post-header">

      <button
        class="post-back-button"
        id="postBackButton"
        type="button"
        aria-label="뒤로 가기"
      >
        ←
      </button>


      <h1
        class="post-page-title"
        id="postPageTitle"
      ></h1>


      <button
        class="list-edit-toggle-button"
        id="bannerEditToggleButton"
        type="button"
        aria-label="배너 편집"
        hidden
      >
        edit
      </button>


      <button
        class="list-edit-toggle-button"
        id="postListEditToggleButton"
        type="button"
        aria-label="글 목록 편집"
        hidden
      >
        edit
      </button>


      <!--
        HIGHLIGHT-1: 글 읽기 화면의 도구 메뉴(⋮).

        예전에는 이 자리에 소유자 전용 edit 하나만 있었다. 지금은
        주인장과 방문자 모두에게 나오는 도구 메뉴이고, 예전 edit은
        그 메뉴 안의 "글 수정"으로 들어갔다(요구사항 3). 메뉴 내용은
        보는 사람이 주인장인지에 따라 다르다 —
        posts/view/posts-view-tools-menu.js.

        점 세 개는 **기본 외형일 뿐**이다. 스킨이 자기 자리에
        ?tools=1 링크를 그리면 플랫폼은 이 버튼을 접고 그 링크에
        같은 메뉴를 연결한다(중복 표시 없음, 요구사항 10).
      -->

      <button
        class="list-edit-toggle-button post-tools-button"
        id="postToolsButton"
        type="button"
        aria-label="글 도구"
        aria-haspopup="menu"
        aria-expanded="false"
        hidden
      >
        ⋮
      </button>


      <!--
        PHASE 1E 후속: 소유자가 자기 글을 POST 스킨으로 읽는 중에
        기존 관리 화면(legacy 상세 + edit/delete)을 명시적으로 열고
        닫는 진입점. 배너/글 목록의 edit 토글과 같은 자리, 같은
        모양이고, 스킨이 실제로 그 글을 그렸고 보는 사람이 이
        사이트의 소유자일 때만 나타난다.

        HIGHLIGHT-1 이후 글 상세에서는 더 이상 쓰이지 않는다(그
        동작은 도구 메뉴의 "글 수정"이다). 다른 화면에서 이 버튼을
        다시 쓸 수 있도록 요소와 핸들러는 그대로 둔다.
      -->

      <button
        class="list-edit-toggle-button"
        id="postManageToggleButton"
        type="button"
        aria-label="글 관리"
        aria-pressed="false"
        hidden
      >
        edit
      </button>


      <button
        class="post-add-button"
        id="postAddButton"
        type="button"
        aria-label="글 추가"
        hidden
      >
        ＋
      </button>

    </header>



    <!-- =====================================================
         글 카테고리 없음 안내 (WRITE)

         스킨의 WRITE를 눌렀는데 글 카테고리가 하나도 없어서
         작성 폼을 열 수 없을 때만 나타난다. 카테고리가 하나라도
         있으면 이 화면 없이 곧장 작성 폼이 열리고, 어느 카테고리에
         쓸지는 폼 안의 CATEGORY 드롭다운에서 고른다.
         posts/view/posts-view-compose.js 참고.
    ====================================================== -->

    <section
      class="post-compose-notice"
      id="postComposeNotice"
      hidden
    >

      <p
        class="post-compose-notice-hint"
        id="postComposeNoticeHint"
      ></p>

      <a
        class="post-compose-notice-admin"
        id="postComposeNoticeAdmin"
        href="/admin/"
      >
        설정에서 카테고리 만들기
      </a>

      <button
        class="post-compose-notice-close"
        id="postComposeNoticeClose"
        type="button"
      >
        cancel
      </button>

    </section>


    <!-- =====================================================
         CATEGORY POST LIST
    ====================================================== -->

    <div
      class="post-list"
      id="postList"
    ></div>


    <!-- =====================================================
         글 목록 편집 모드: 선택 삭제

         edit 모드에서만 보임(posts-view-list-select.js).
    ====================================================== -->

    <div
      class="post-list-select-bar"
      id="postListSelectBar"
      hidden
    >

      <span
        class="post-list-select-count"
        id="postListSelectCount"
      >
        0개 선택됨
      </span>

      <button
        class="post-list-select-delete"
        id="postListSelectDeleteButton"
        type="button"
        disabled
      >
        delete
      </button>

    </div>


    <!-- =====================================================
         BANNER 카테고리

         posts-view-banner.js 참고. 글 목록 대신 이게 보임.
    ====================================================== -->

    <div
      class="banner-grid"
      id="bannerGrid"
      hidden
    ></div>


    <form
      class="banner-editor"
      id="bannerEditor"
      hidden
    >

      <div class="banner-editor-heading">
        <span id="bannerEditorHeading">
          ADD BANNER
        </span>
      </div>

      <div class="banner-editor-field">
        <label for="bannerEditorName">
          NAME
        </label>
        <input
          id="bannerEditorName"
          type="text"
          autocomplete="off"
          placeholder="사이트/지인 이름"
        >
      </div>

      <div class="banner-editor-field">
        <label for="bannerEditorUrl">
          URL
        </label>
        <input
          id="bannerEditorUrl"
          type="url"
          autocomplete="off"
          placeholder="https://..."
        >
      </div>

      <!--
        배너 이미지는 URL을 직접 입력받지 않고 Storage에
        업로드함(친구가 이미지를 지우거나 옮기면 우리 목록도
        깨지는 문제 방지) — posts-view-banner-form.js 참고.
      -->

      <div class="banner-editor-field">

        <label for="bannerEditorFileInput">
          BANNER IMAGE
        </label>

        <div class="banner-editor-image-row">

          <img
            class="banner-editor-preview"
            id="bannerEditorPreview"
            alt=""
            hidden
          >

          <div
            class="banner-editor-preview-empty"
            id="bannerEditorPreviewEmpty"
          >
            이미지 없음
          </div>

          <label
            class="banner-editor-change-button"
            for="bannerEditorFileInput"
          >
            change
          </label>

          <input
            class="banner-editor-file-input"
            id="bannerEditorFileInput"
            type="file"
            accept="image/*"
            hidden
          >

        </div>

        <p
          class="banner-editor-upload-message"
          id="bannerEditorUploadMessage"
        ></p>

      </div>

      <div class="banner-editor-actions">

        <button
          type="button"
          class="banner-editor-delete"
          id="bannerEditorDelete"
          hidden
        >
          delete
        </button>

        <button
          type="button"
          class="banner-editor-cancel"
          id="bannerEditorCancel"
        >
          cancel
        </button>

        <button
          type="submit"
          class="banner-editor-save"
          id="bannerEditorSave"
        >
          save
        </button>

      </div>

      <div
        class="banner-editor-message"
        id="bannerEditorMessage"
      ></div>

    </form>



    <!-- =====================================================
         POST DETAIL
    ====================================================== -->

    <article
      class="post-detail"
      id="postDetail"
      hidden
    >

      <div class="post-detail-heading">

        <h1
          class="post-detail-title"
          id="postDetailTitle"
        ></h1>


        <!--
          HIGHLIGHT-1: 제목 옆에 있던 -/+ 글자 크기 버튼은 도구
          메뉴(⋮) 안으로 들어갔다 — 같은 조절을 두 군데에 두지
          않는다. 계산과 저장(localStorage)은 그대로
          posts/posts-reader-scale.js가 한다.
        -->


        <div
          class="post-detail-actions"
          id="postDetailActions"
          hidden
        >

          <!--
            HIGHLIGHT-1: edit은 도구 메뉴(⋮)의 "글 수정"이다.
            delete는 여기 그대로 둔다 — 메뉴에 넣기로 한 항목이
            아니고, 수정 폼 안의 delete와 함께 기존 경로를 유지한다.
          -->


          <button
            class="post-action-button post-delete-button"
            id="postDeleteButton"
            type="button"
          >
            delete
          </button>

        </div>

      </div>


      <div
        class="post-detail-date"
        id="postDetailDate"
      ></div>


      <!--
        HTML 모드 글은 폭이 고정된 마크업(카톡 대화창 재현 등)일
        때가 많아서, 화면보다 넓으면 postDetailContent 전체를
        축소(scale)해서 화면 안에 들어오게 한다(posts-view.js의
        fitHtmlPostContentToViewport). wrap은 그 축소된 실제
        높이만큼만 자리를 차지하게 하는 용도.
      -->

      <div
        class="post-detail-content-wrap"
        id="postDetailContentWrap"
      >

        <div
          class="post-detail-content"
          id="postDetailContent"
        ></div>

      </div>


      <!-- ===================================================
           SECRET GATE

           비밀글을 주인이 아닌 사람이 열었을 때, 본문
           대신 이게 보임. 비밀번호는 get_secret_post_content
           RPC로 DB에서만 대조된다(posts-view.js).
      ==================================================== -->

      <form
        class="post-secret-gate"
        id="postSecretGate"
        hidden
      >

        <div class="post-secret-gate-icon">
          🔒
        </div>

        <div class="post-secret-gate-label">
          비밀글입니다
        </div>

        <input
          class="post-secret-gate-input"
          id="postSecretGateInput"
          type="password"
          inputmode="text"
          autocomplete="off"
          placeholder="비밀번호"
        >

        <button
          class="post-secret-gate-button"
          id="postSecretGateSubmit"
          type="submit"
        >
          확인
        </button>

        <div
          class="post-secret-gate-message"
          id="postSecretGateMessage"
        ></div>

      </form>



      <!-- ===================================================
           RELATED POSTS
      ==================================================== -->

      <section
        class="post-related"
        id="postRelated"
      >

        <div
          class="post-related-title"
          id="postRelatedTitle"
        ></div>


        <div
          class="post-related-list"
          id="postRelatedList"
        ></div>

      </section>

    </article>


    <!-- ===================================================
         POST SKIN CONTAINER (PHASE 1C-F)

         published Skin이 이 POST를 지원할 때만 채워진다
         (skin/skin-post.js). Skin outer chrome(article 전체)을
         이 컨테이너가 통째로 소유하고, 그 안의
         [data-imory-region="post-body"]에 기존 Quote
         Preset/raw HTML/secret gate 렌더러가 그대로 mount된다
         (posts/view/posts-view-detail.js). 지원하지 않으면
         항상 hidden으로 남고 위 #postDetail이 쓰인다.
    ==================================================== -->

    <div
      class="post-skin-container"
      id="postSkinContainer"
      hidden
    ></div>


    <!-- =====================================================
         POST EDITOR
    ====================================================== -->

    <section
      class="post-editor"
      id="postEditor"
      hidden
    >


      <!-- ===================================================
           CATEGORY
      ==================================================== -->

      <div class="post-editor-field">

        <label
          for="postEditorCategory"
        >
          CATEGORY
        </label>


        <select
          id="postEditorCategory"
          class="post-editor-input"
        ></select>

      </div>



      <!-- ===================================================
           FOLDER

           카테고리 안의 폴더(FOLDER-1, 최대 3단계)를 글쓰기/수정
           폼에서 바로 고른다. 예전에는 새 글이 항상 카테고리 root에
           생기고 폴더 배치는 ?manage=1 관리 트리에서 끌어다 놓아야만
           가능했다.

           목록은 위 CATEGORY에서 고른 카테고리의 폴더만 보여주고,
           카테고리를 바꾸면 다시 채운다(loadPostEditorFolders,
           posts/editor/format/posts-editor-folder.js). 폴더가 하나도
           없는 카테고리에서는 이 칸 자체가 숨는다 — 고를 것이 없는
           빈 드롭다운을 남기지 않는다.

           저장은 posts 테이블에 folder_id를 직접 쓰지 않는다(그
           컬럼에는 INSERT/UPDATE GRANT가 없다) — move_tree_node()
           RPC로만 옮긴다(posts/editor/posts-save.js).
      ==================================================== -->

      <div
        class="post-editor-field"
        id="postEditorFolderField"
        hidden
      >

        <label
          for="postEditorFolder"
        >
          FOLDER
        </label>


        <select
          id="postEditorFolder"
          class="post-editor-input"
        ></select>

      </div>



      <!-- ===================================================
           TITLE
      ==================================================== -->

      <div class="post-editor-field">

        <label
          for="postEditorTitle"
        >
          TITLE
        </label>


        <input
          id="postEditorTitle"
          class="post-editor-input"
          type="text"
          autocomplete="off"
        >

      </div>



      <!-- ===================================================
           대표 이미지 = 본문 사진

           예전에는 여기에 COVER 업로드 칸과 갤러리 전용 사진
           목록이 따로 있었다. 지금은 post/gallery 모두 아래
           CONTENT의 공통 본문 편집 영역에서 사진을 넣고, 그 중
           하나를 '대표'로 고른다(지정하지 않으면 첫 번째 사진).

           기준 문서: IMORY_POST_BODY_IMAGE_DESIGN.md
           코드: posts/editor/posts-body-images.js

           예전에 올려 둔 COVER 데이터는 지우지 않는다 — 본문에
           사진이 없는 글의 썸네일로 계속 쓰인다.
      ==================================================== -->




      <!-- ===================================================
           OOC + HTML MODE

           OOC: 독자에게는 보이지 않는 메모/설정 노트.
           본문과 완전히 분리된 별도 필드(ooc_content)로
           저장되어서, 뷰어 쪽에서 아예 안 가져오면
           절대 노출되지 않는다.

           HTML: 누르면 아래 CONTENT의 리치텍스트 에디터가
           통째로 사라지고 raw HTML textarea만 나온다.
      ==================================================== -->

      <div class="post-editor-field post-editor-ooc-field">

        <div class="post-editor-ooc-html-row">

          <button
            type="button"
            class="post-editor-ooc-toggle"
            id="postEditorOOCToggle"
            aria-expanded="false"
            aria-controls="postEditorOOC"
          >
            OOC
          </button>


          <button
            type="button"
            class="post-editor-content-mode-toggle"
            id="postEditorHtmlModeToggle"
            aria-pressed="false"
            title="HTML로 직접 작성 (뷰어에서 그대로 출력됨)"
          >
            HTML
          </button>


          <button
            type="button"
            class="post-editor-content-mode-toggle post-editor-visibility-toggle"
            id="postEditorSecretToggle"
            aria-pressed="false"
            aria-controls="postEditorSecretPassword"
            title="비밀글: 목록엔 제목만 보이고, 비밀번호를 맞혀야 본문이 열립니다"
          >
            🔒 비밀글
          </button>


          <button
            type="button"
            class="post-editor-content-mode-toggle post-editor-visibility-toggle"
            id="postEditorPrivateToggle"
            aria-pressed="false"
            title="비공개: 목록에도 보이지 않고, 나만 볼 수 있습니다"
          >
            🙈 비공개
          </button>

        </div>


        <textarea
          id="postEditorOOC"
          class="post-editor-input post-editor-ooc-textarea"
          placeholder="독자에게는 보이지 않는 메모입니다."
          hidden
        ></textarea>


        <input
          id="postEditorSecretPassword"
          class="post-editor-input post-editor-secret-password-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          placeholder="비밀글 비밀번호 (비워두면 기존 비밀번호 유지)"
          hidden
        >

      </div>



      <!-- ===================================================
           CONTENT
      ==================================================== -->

      <div class="post-editor-field">


        <!-- CONTENT -->

        <div class="post-editor-content-heading">

          <div class="post-editor-content-label">
            CONTENT
          </div>

        </div>



        <!-- =================================================
             HTML MODE

             켜면 리치텍스트 에디터 대신 이 textarea에
             HTML을 직접 작성. 저장 시 그대로(sanitize 없이)
             content에 들어가고, 뷰어에서도 그대로 출력된다.
             이 모드에서는 발췌 프리뷰/export가 의미 없으므로
             (posts.js에서) 그 버튼들도 함께 숨긴다.
        ================================================== -->

        <textarea
          id="postEditorHtmlContent"
          class="post-editor-input post-editor-html-textarea"
          placeholder="여기에 HTML을 직접 작성하세요."
          spellcheck="false"
          hidden
        ></textarea>



        <!-- =================================================
             RICHTEXT MODE (기존 툴바 + 리치텍스트 에디터)
        ================================================== -->

        <div id="postEditorRichtextMode">


        <!-- =================================================
             TOOLBAR

             ★ 정확히 세 줄이다 (요구사항 4)

               1행  Page break · H · P · L · Clear   … Undo · Redo
               2행  Format · B · I · U · S · Photo · Preset
               3행  Insert · Copy box · Memo · Divider

             예전에는 버튼 묶음 여덟 개가 한 덩어리로 wrap돼서,
             화면 폭에 따라 줄이 제멋대로 갈렸다(모바일에서 특히).
             이제 각 행이 자기 <div>를 갖고, 그 안에서만 정렬한다.

             ★ Undo/Redo가 1행 오른쪽으로 올라왔다

             예전에는 이 둘만 쓰는 3행이 따로 있었다. 삽입(3행)이
             생기면서 줄이 넷이 되는 대신, 1행에 남는 오른쪽 공간
             으로 옮겼다 — 1행의 왼쪽 묶음과 밀어내기용 빈
             칸(.post-editor-tool-spacer)이 그 자리를 만든다.

             ★ 세 행의 왼쪽 시작점을 맞춘다

             1행은 버튼(page break), 2·3행은 라벨(FORMAT/INSERT)로
             시작한다. 버튼은 padding-left 6px를 갖고 라벨은 갖지
             않아서 두 행의 글자가 6px 어긋나 보였다 — 행의 첫
             요소가 라벨일 때 같은 padding을 주어 맞춘다
             (posts/posts-editor.css의 .post-editor-tool-line >
             .post-editor-tool-label:first-child).

             ★ 라벨은 한 글자로 줄였다.

               HIGHLIGHT   -> H
               POINT COLOR -> P
               RULE / line -> L

             줄인 라벨의 뜻은 aria-label과 title로 준다 — 화면
             낭독기와 툴팁에는 원래 이름이 그대로 나온다.
             색 견본과 컬러피커는 그대로다.
        ================================================== -->

        <div
          class="post-editor-toolbar"
          id="postEditorToolbar"
        >


          <!-- ===============================================
               1행 — 페이지 나누기 · 색 세 가지 · 서식 지우기
          ================================================ -->

          <div class="post-editor-tool-line">


            <button
              class="post-editor-tool-button page-break"
              id="postEditorPageBreak"
              type="button"
              title="현재 위치에서 다음 페이지로 넘기기"
            >
              page break
            </button>


            <!--
              H = HIGHLIGHT. 초기 색은 QUOTE PRESET의 하이라이트
              색(getPresetHighlightColor)을 따르고, 누르면 우리가
              직접 그리는 컬러피커 팝오버가 열린다
              (posts/editor/posts-color-picker.js).
            -->

            <div class="post-editor-tool-group">

              <span
                class="post-editor-tool-label"
                aria-hidden="true"
              >
                H
              </span>


              <button
                class="post-highlight-custom-control"
                id="postEditorCustomControl"
                type="button"
                title="Highlight — 형광펜 색"
                aria-label="형광펜 색상 선택"
              >

                <span
                  class="post-highlight-swatch"
                  id="postEditorCustomSwatch"
                ></span>

              </button>

            </div>


            <!-- P = POINT COLOR. 같은 컬러피커가 열린다. -->

            <div class="post-editor-tool-group">

              <span
                class="post-editor-tool-label"
                aria-hidden="true"
              >
                P
              </span>


              <button
                class="post-highlight-custom-control"
                id="postEditorCustomPointControl"
                type="button"
                title="Point color — 글자 강조색"
                aria-label="글자 강조색 선택"
              >

                <span
                  class="post-highlight-swatch"
                  id="postEditorCustomPointSwatch"
                ></span>

              </button>

            </div>


            <!--
              L = 강조선(문단 왼쪽 세로선). 예전에는 "RULE"
              라벨 + "line" 버튼 + 색 견본 셋이었는데, 라벨과
              버튼이 같은 말을 두 번 하고 있었다. L 하나가
              적용·해제 토글이고, 옆의 견본이 색이다.
            -->

            <div class="post-editor-tool-group">

              <button
                class="post-editor-tool-button rule"
                id="postEditorRuleToggle"
                type="button"
                aria-pressed="false"
                title="Line — 이 문단에 강조선 넣기/빼기"
                aria-label="문단 강조선 넣기 또는 빼기"
              >
                L
              </button>


              <button
                class="post-highlight-custom-control"
                id="postEditorRuleControl"
                type="button"
                title="Line color — 강조선 색"
                aria-label="문단 강조선 색상 선택"
              >

                <span
                  class="post-highlight-swatch"
                  id="postEditorRuleSwatch"
                ></span>

              </button>

            </div>


            <!--
              선택한 곳의 글자 서식과 **문단 강조선**을 함께
              지운다(요구사항 3 — clearEditorStyle).
            -->

            <button
              class="post-editor-tool-button clear"
              id="postEditorClearStyle"
              type="button"
              title="선택한 곳의 서식과 강조선 지우기"
            >
              clear
            </button>


            <!--
              남는 공간을 전부 먹어서 undo/redo를 오른쪽 끝으로
              민다. 행이 좁아 가로 스크롤이 생기면 0으로 줄어들어
              버튼들이 잘리지 않는다(flex-shrink 기본값).
            -->

            <span class="post-editor-tool-spacer"></span>


            <div class="post-editor-tool-group">

              <button
                class="post-editor-tool-button undo"
                id="postEditorUndoButton"
                type="button"
                title="되돌리기 (Ctrl/Cmd+Z)"
              >
                undo
              </button>


              <!--
                되돌린 것을 다시 실행. 컬러피커 확정 한 번이 undo
                한 칸이므로 redo도 한 칸으로 되돌아온다.
              -->

              <button
                class="post-editor-tool-button redo"
                id="postEditorRedoButton"
                type="button"
                title="다시 실행 (Ctrl/Cmd+Shift+Z)"
              >
                redo
              </button>

            </div>


          </div>



          <!-- ===============================================
               2행 — 글자 서식 · 사진 · 프리셋
          ================================================ -->

          <div class="post-editor-tool-line">


            <span class="post-editor-tool-label">
              FORMAT
            </span>


            <div class="post-editor-tool-group">

              <button
                class="post-editor-tool-button"
                id="postEditorBoldToggle"
                type="button"
                title="굵게"
                aria-label="굵게"
              >
                <b>B</b>
              </button>


              <button
                class="post-editor-tool-button"
                id="postEditorItalicToggle"
                type="button"
                title="기울임"
                aria-label="기울임"
              >
                <i>I</i>
              </button>


              <button
                class="post-editor-tool-button"
                id="postEditorUnderlineToggle"
                type="button"
                title="밑줄"
                aria-label="밑줄"
              >
                <u>U</u>
              </button>


              <!--
                취소선. B/I/U와 같은 구조다
                (toggleEditorInlineTag — posts/editor/format/posts-editor.js).
                저장되는 태그는 <s>이고, 사니타이저가 s/strike/del을
                모두 s로 받아들인다(posts/posts-sanitize.js).
              -->

              <button
                class="post-editor-tool-button"
                id="postEditorStrikeToggle"
                type="button"
                title="취소선"
                aria-label="취소선"
              >
                <s>S</s>
              </button>

            </div>


            <!--
              PHOTO — 버튼 자체가 사진 삽입이다 (요구사항 5).

              예전에는 "PHOTO" 라벨 옆에 "사진" 버튼이 따로 있어서
              같은 말이 두 번 나왔다. 라벨을 없애고 버튼 하나로
              합쳤다.

              여러 장을 고를 수 있고, 고른 순서대로 **지금 커서
              자리**에 들어간다. 고른 파일은 저장을 눌러야 올라간다
              (posts/editor/posts-body-images.js).

              파일 입력은 화면에서 감춘다 — 버튼이 caret을 먼저
              붙잡은 뒤 대신 눌러준다. 모바일에서 파일 선택창이
              편집 영역의 선택을 가져가도 삽입 자리가 유지되는
              이유다.
            -->

            <button
              class="post-editor-tool-button photo"
              id="postEditorImageButton"
              type="button"
              title="현재 커서 위치에 사진 넣기"
              aria-label="사진 넣기"
            >
              photo
            </button>


            <input
              id="postEditorImageFiles"
              class="post-editor-image-file-input"
              type="file"
              multiple
              accept="image/png,image/jpeg,image/webp,image/gif"
              hidden
            >


            <!--
              PRESET — 저장해둔 QUOTE 프리셋을 골라서
              프리뷰/export 서식을 바꿔 낌(본문 내용은 그대로).
            -->

            <select
              class="post-editor-preset-select"
              id="postEditorPresetSelect"
              aria-label="발췌 프리셋"
            ></select>


          </div>



          <!-- ===============================================
               3행 — 블록 삽입 (요구사항 5·6·7)

               지금 커서 자리에 "덩어리"를 하나 넣는다. 글자
               서식(2행)과 달리 선택한 글자를 고치는 것이 아니라
               새 블록을 끼워 넣는 동작이라 줄을 따로 둔다.

                 copy box  부제목 + 내용, 내용만 복사되는 상자
                 memo      제목 + 내용, 메모지 모양
                 divider   구분선 다섯 가지

               삽입·수정·삭제는 전부 본문 DOM 안에서 일어나고,
               저장되는 HTML은 사니타이저의 화이트리스트를 통과한
               것뿐이다(posts/posts-sanitize.js).
          ================================================ -->

          <div class="post-editor-tool-line">


            <span class="post-editor-tool-label">
              INSERT
            </span>


            <button
              class="post-editor-tool-button"
              id="postEditorInsertCopyBox"
              type="button"
              title="현재 커서 위치에 복사 상자 넣기"
              aria-label="복사 상자 넣기"
            >
              copy box
            </button>


            <button
              class="post-editor-tool-button"
              id="postEditorInsertMemo"
              type="button"
              title="현재 커서 위치에 메모 넣기"
              aria-label="메모 넣기"
            >
              memo
            </button>


            <!--
              ★ 종류를 고르면 그 자리에 바로 넣는다.

              드롭다운의 값은 "지금 무엇이 골라져 있는가"가 아니라
              "무엇을 넣을 것인가"다 — 넣고 나면 안내 문구(첫
              option)로 되돌린다. 그래야 같은 종류를 연달아 두 번
              넣을 수 있다(change가 다시 뜬다).

              미리보기는 option 글자 안의 선 문자로 준다 —
              <select>의 목록은 OS가 그리는 창이라 CSS가 닿지
              않아서, 실제로 어떤 선인지 보여줄 방법이 글자뿐이다.
            -->

            <select
              class="post-editor-preset-select"
              id="postEditorInsertDivider"
              aria-label="구분선 넣기"
            >

              <option value="">
                divider
              </option>

              <option value="solid">
                ───  실선
              </option>

              <option value="dotted">
                ┈┈┈  점선
              </option>

              <option value="dashed">
                ╌╌╌  파선
              </option>

              <option value="double">
                ═══  이중선
              </option>

              <option value="dots">
                ⋯  가운데 점 세 개
              </option>

            </select>


          </div>

        </div>



        <!-- =================================================
             RICH TEXT EDITOR
        ================================================== -->

        <div
          id="postEditorContent"
          class="post-editor-richtext"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          aria-label="본문 입력"
          spellcheck="false"
          data-placeholder="본문을 입력하세요."
        ></div>


        <!-- =================================================
             본문 사진의 '대표' 선택 컨트롤

             본문 사진을 누르면 그 사진 오른쪽 위에 나타난다.

             ★ contenteditable **밖의** 요소다
             위치만 사진에 맞추고(positionPostBodyImageControl),
             본문 HTML 안으로는 절대 들어가지 않는다. 그래서
             공개 본문·저장되는 HTML·발췌 결과에 편집 컨트롤이
             새어나갈 자리가 구조적으로 없다(요구사항 2절).

             "어느 사진이 대표인가"도 본문 HTML이 아니라
             post_gallery_images.is_primary 행이 갖는다.
        ================================================== -->

        <div
          class="post-editor-image-control"
          id="postEditorImageControl"
          hidden
        >

          <button
            class="post-editor-image-primary-toggle"
            id="postEditorImagePrimaryToggle"
            type="button"
            aria-pressed="false"
            title="이 사진을 글의 대표 사진으로"
          >
            대표
          </button>

        </div>



        <!-- =================================================
             MOBILE: 텍스트 선택 시 근처에 뜨는
             하이라이트 메뉴 (긴 상단 툴바를 안 봐도 되게)
        ================================================== -->

        <div
          class="post-editor-floating-menu"
          id="postEditorFloatingMenu"
          hidden
        >

          <button
            class="post-highlight-custom-control"
            id="postEditorFloatingCustomControl"
            type="button"
            title="highlight color"
            aria-label="하이라이트 색상 선택"
          >

            <span
              class="post-highlight-swatch"
              id="postEditorFloatingCustomSwatch"
            ></span>

          </button>


          <button
            class="post-highlight-custom-control"
            id="postEditorFloatingCustomPointControl"
            type="button"
            title="point color"
            aria-label="포인트 컬러 선택"
          >

            <span
              class="post-highlight-swatch"
              id="postEditorFloatingCustomPointSwatch"
            ></span>

          </button>


          <button
            class="post-highlight-custom-control"
            id="postEditorFloatingRuleControl"
            type="button"
            title="rule color"
            aria-label="강조선 색상 선택"
          >

            <span
              class="post-highlight-swatch"
              id="postEditorFloatingRuleSwatch"
            ></span>

          </button>

        </div>

        </div>
        <!-- /#postEditorRichtextMode -->

      </div>



      <!-- ===================================================
           PREVIEW 여닫기

           데스크톱·모바일이 **같은 버튼 하나**로 펼치고 접는다.
           부유(sticky·알약·그림자)가 아니라 에디터 바로 아래
           일반 문서 흐름에 놓인 고스트 버튼이고, 선·색은 아래
           .post-editor-actions의 버튼과 같은 것을 쓴다.

           라벨(미리보기 ▾ / 미리보기 접기 ▴)과 aria-expanded는
           syncEditorPreviewToggleButton()이 **실제 상태**에서
           한 자리에서 정한다
           (posts/preview/posts-preview-mobile.js).
           aria-controls는 실제로 펼쳐지는 섹션을 가리킨다.
      ==================================================== -->

      <button
        class="post-editor-preview-toggle"
        id="postEditorPreviewToggle"
        type="button"
        aria-expanded="false"
        aria-controls="postEditorPreviewSection"
      >

        <span id="postEditorPreviewToggleLabel">
          발췌
        </span>

        <span
          class="post-editor-preview-toggle-icon"
          id="postEditorPreviewToggleIcon"
        >
          ▾
        </span>

      </button>



      <!-- ===================================================
           PREVIEW
      ==================================================== -->

      <section
        class="post-editor-preview-section"
        id="postEditorPreviewSection"
        aria-hidden="true"
      >


        <!-- =================================================
             PREVIEW SHEET
        ================================================== -->

        <div
          class="post-editor-preview-sheet"
          id="postEditorPreviewSheet"
        >


          <!-- ===================================================
               PREVIEW CONTROLS

               ★ 패널 안에 제목(중복 "PREVIEW" 문구)과 닫기 ×를
               두지 않는다. 접는 길은 패널 바로 위의 고스트 버튼
               하나뿐이고, 없어진 헤더의 높이·여백도 함께 뺐다.

               align → body → title → source → margin/gap 순서.
          ==================================================== -->

          <div class="post-editor-preview-visibility-controls">

            <!-- =================================================
                 align → body → title → source → margin/gap 순서
                 (모바일에서 title/source 버튼을 각각 body preset/
                 title 오른쪽으로 옮겨서 한 줄에 몰아둔 배치 —
                 원래는 title이 맨 앞이었는데, align/body 드롭다운
                 뒤로 옮기고 source도 title 바로 오른쪽(=이 줄
                 맨 끝)으로 옮겼다).
            ================================================== -->

            <div class="post-editor-preview-row">

              <!-- =============================================
                   VERTICAL ALIGN (세션 한정 — "preset"이면
                   QUOTE 프리셋 값을 그대로 따름. 이 글에서만
                   잠깐 위/가운데/아래로 바꿔보고 싶을 때 사용)

                   비율이 auto일 때만 숨는다 — auto는 페이지
                   높이가 곧 콘텐츠 높이라 밀어낼 공간이 없다.
                   uniform은 짧은 장에 남는 공간이 생기므로
                   여기서 고른 정렬이 실제로 그려진다
                   (posts/preview/posts-preview-css-vars.js).
              ============================================== -->

              <div
                class="post-editor-preview-subrow"
                id="postEditorPreviewAlignRow"
              >

                <span class="post-editor-preview-subrow-label">
                  align
                </span>


                <select
                  class="post-editor-preview-select"
                  id="postEditorPreviewAlignSelect"
                >

                  <option value="">
                    preset
                  </option>

                  <option value="top">
                    top
                  </option>

                  <option value="center">
                    center
                  </option>

                  <option value="bottom">
                    bottom
                  </option>

                </select>

              </div>



              <!-- =============================================
                   BODY ALIGN (세션 한정 — "preset"이면 QUOTE
                   프리셋 값을 그대로 따름)
              ============================================== -->

              <div class="post-editor-preview-subrow">

                <span class="post-editor-preview-subrow-label">
                  body
                </span>


                <select
                  class="post-editor-preview-select"
                  id="postEditorPreviewBodyAlignSelect"
                >

                  <option value="">
                    preset
                  </option>

                  <option value="left">
                    left
                  </option>

                  <option value="center">
                    center
                  </option>

                  <option value="right">
                    right
                  </option>

                  <option value="justify">
                    justify
                  </option>

                </select>

              </div>


              <button
                class="post-editor-preview-visibility-toggle"
                id="postEditorPreviewTitleToggle"
                type="button"
                aria-pressed="true"
              >
                title
              </button>


              <button
                class="post-editor-preview-visibility-toggle"
                id="postEditorPreviewSourceToggle"
                type="button"
                aria-pressed="true"
              >
                source
              </button>


              <!-- =============================================
                   SOURCE RULE (출처 강조선 — 세션 한정)

                   ★ 켜고 끄는 것만 여기서 다룬다 (요구사항 7).

                   색과 굵기·거리는 Quote Preset의 SOURCE
                   섹션에서만 정하고 이 발췌는 그 값을 그대로
                   따른다 — 예전에는 여기 색 견본이 하나 더
                   있어서, 같은 색을 두 자리에서 고칠 수 있었다.

                   ★ 본문 툴바의 H/P/L 색 견본과는 다른 컨트롤
                   이다. 그쪽은 그대로 남는다.
              ============================================== -->

              <button
                class="post-editor-preview-visibility-toggle"
                id="postEditorPreviewSourceRuleToggle"
                type="button"
                aria-pressed="false"
              >
                rule
              </button>


              <!-- =============================================
                   SOURCE BOTTOM MARGIN (세션 한정 — ratio가
                   AUTO가 아닐 때만 표시. source는 캔버스 맨
                   아래에 고정되므로, 그 위치에서 위로 얼마나
                   띄울지 조절)
              ============================================== -->

              <div
                class="post-editor-preview-subrow"
                id="postEditorPreviewSourceBottomOffsetRow"
              >

                <span class="post-editor-preview-subrow-label">
                  margin
                </span>


                <input
                  class="post-editor-preview-ratio-custom-input"
                  id="postEditorPreviewSourceBottomOffset"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  max="500"
                  aria-label="출처 하단 여백"
                >

              </div>


              <!-- =============================================
                   SOURCE GAP (세션 한정 — ratio가 AUTO일 때만
                   표시. AUTO는 source가 캔버스 맨 아래 고정이
                   아니라 본문 바로 아래로 흘러가므로, 대신
                   title/body 묶음과의 간격을 조절)
              ============================================== -->

              <div
                class="post-editor-preview-subrow"
                id="postEditorPreviewSourceSpacingRow"
                hidden
              >

                <span class="post-editor-preview-subrow-label">
                  gap
                </span>


                <input
                  class="post-editor-preview-ratio-custom-input"
                  id="postEditorPreviewSourceSpacing"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  max="300"
                  aria-label="출처 간격"
                >

              </div>

            </div>


            <!-- ===============================================
                 출력 조건 — uniform / auto / custom + 출력 너비

                 세 옵션은 항상 보인다(예전의 "ratio" 펼치기
                 버튼은 없앴다). 값의 초기값은 이 글의 QUOTE
                 프리셋에 저장된 canvas 값이고, 여기서 고른 값이
                 그보다 우선한다
                 (posts/preview/posts-preview-settings.js).

                   uniform  auto와 똑같이 나눈 뒤 모든 페이지를
                            가장 높은 페이지의 높이로 통일
                   auto     페이지마다 자기 높이 (수동 PAGE
                            break로만 나뉨)
                   custom   사용자 지정 비율의 고정 크기 캔버스
                            — 옛 프리셋의 4:5·9:16 같은 고정
                            비율이 이 값으로 그대로 온다
            ================================================ -->

            <div class="post-editor-preview-row">

              <span class="post-editor-preview-subrow-label">
                size
              </span>


              <div
                class="post-editor-preview-ratio-controls"
                id="postEditorPreviewRatioControls"
              >

                <button
                  class="post-editor-preview-ratio-button"
                  type="button"
                  data-ratio="uniform"
                  aria-pressed="false"
                >
                  uniform
                </button>


                <button
                  class="post-editor-preview-ratio-button"
                  type="button"
                  data-ratio="auto"
                  aria-pressed="false"
                >
                  auto
                </button>


                <button
                  class="post-editor-preview-ratio-button"
                  type="button"
                  data-ratio="custom"
                  aria-pressed="false"
                >
                  custom
                </button>


                <div
                  class="post-editor-preview-ratio-custom-inputs"
                  id="postEditorPreviewRatioCustomInputs"
                  hidden
                >

                  <input
                    class="post-editor-preview-ratio-custom-input"
                    id="postEditorPreviewRatioCustomWidth"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    value="4"
                    aria-label="가로 비율"
                  >

                  <span class="post-editor-preview-ratio-custom-sep">
                    :
                  </span>

                  <input
                    class="post-editor-preview-ratio-custom-input"
                    id="postEditorPreviewRatioCustomHeight"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    value="5"
                    aria-label="세로 비율"
                  >

                </div>

              </div>


            </div>


            <!-- =============================================
                 BACKGROUND (배경 사진) — 버튼 셋을 바로 둔다

                 ★ 여닫는 단계를 없앴다 (요구사항 8)

                   예전에는 "background" 버튼을 눌러야 아래
                   패널이 열리고 그제서야 image/move/reset이
                   나왔다. 세 버튼뿐인데 한 겹을 더 거칠 이유가
                   없어서 설정의 마지막 줄에 바로 놓는다.

                 ★ 프리뷰 위에 버튼을 겹쳐 띄우지 않는다. 배경을
                   끄는 것은 move를 켰을 때뿐이고, 평소에는
                   기존 스크롤·핀치 제스처를 전혀 건드리지 않는다.

                 ★ 에디터가 다룰 수 있는 것은 이 셋뿐이다.
                   확대/흐림/덮개/크기 정책은 Quote Preset에만
                   있고, 사진을 바꿔도 그 값들은 그대로 남는다.
            ============================================== -->

            <div class="post-editor-preview-row">

              <!--
                ★ 행의 설명 라벨이다 — 누를 수 있는 버튼이 아니다.

                align / margin / size와 같은 자리·같은 폭에 둬서
                네 줄의 컨트롤이 같은 x에서 시작하게 한다
                (.post-editor-preview-subrow-label의 min-width).
              -->

              <span class="post-editor-preview-subrow-label">
                image
              </span>


              <button
                class="post-editor-preview-visibility-toggle"
                id="postEditorPreviewBackgroundPick"
                type="button"
                title="이번 발췌의 배경 사진 바꾸기"
              >
                change image
              </button>


              <input
                id="postEditorPreviewBackgroundFile"
                class="post-editor-image-file-input"
                type="file"
                accept="image/png,image/jpeg,image/webp"
                hidden
              >


              <button
                class="post-editor-preview-visibility-toggle"
                id="postEditorPreviewBackgroundMove"
                type="button"
                aria-pressed="false"
                title="켜는 동안에만 프리뷰를 끌어 배경 위치를 맞춘다"
              >
                move
              </button>


              <button
                class="post-editor-preview-visibility-toggle"
                id="postEditorPreviewBackgroundReset"
                type="button"
                title="이번 발췌의 사진·위치 변경을 취소하고 프리셋 기본값으로"
              >
                reset
              </button>


              <span
                class="post-editor-preview-background-message"
                id="postEditorPreviewBackgroundMessage"
              ></span>

            </div>

          </div>



          <!-- =================================================
               저장되는 PNG의 픽셀 크기 — **읽기 전용**이다.

               ★ 설정 항목이 아니라 대지 바깥의 표시다 (요구사항 7)

                 예전에는 설정 줄 안에 "size 1200 × 912"가 끼어
                 있어서, 고칠 수 있는 값처럼 보였다. 가로 픽셀을
                 고치는 자리는 Quote Preset의 CANVAS 하나뿐이다.
                 여기서는 지금 조건으로 저장하면 몇 픽셀이
                 나오는지만 대지 우측 위에 조용히 보여준다.

                 페이지를 넘기면 그 페이지의 크기로 갱신된다
                 (syncPreviewExportSizeLabel — 페이지마다 높이가
                 다른 auto에서도 맞는 값이 나온다).

                 이 표시는 대지 **바깥**이므로 저장되는 이미지에
                 들어가지 않는다 — 캡처 대상은 페이지 요소
                 (.post-editor-preview-page)뿐이다.

               ★ 레이아웃 너비(520px)와는 다른 축이라, 이 숫자가
                 달라져도 줄바꿈과 페이지 수는 바뀌지 않는다.
          ================================================== -->

          <!-- =================================================
               HTML 모드 — 디자인 미리보기 (요구사항 10)

               ★ 일반 발췌와 **다른 상자**다.

               HTML 모드에서는 위의 발췌 설정(align/body/size/
               image)도, 아래의 4:5 페이지 대지도 쓰지 않는다.
               붙여 넣은 디자인을 그대로 한 장으로 그려서 보여
               주고, export가 바로 그 상자를 PNG로 찍는다.

               ★ 여기에는 디자인 말고 아무것도 없다.

               상단 OOC · 글 제목/날짜 · 사이트 스킨 · 툴바가
               캡처에 들어갈 자리가 구조적으로 없다 — 찍는 대상이
               이 상자 하나뿐이기 때문이다. 디자인 안에 사용자가
               직접 써넣은 제목·날짜는 디자인의 일부라 남는다.

               ★ Quote Preset은 여기에 관여하지 않는다.

               프리셋 CSS 변수를 쓰는 것은 아래 페이지 대지
               (.post-editor-preview-page)뿐이고, 이 상자는 그
               바깥이라 글자색·배경·문단 간격이 디자인을 덮어쓰지
               않는다.

               동작: posts/export/posts-html-image.js
          ================================================== -->

          <div
            class="post-editor-html-preview"
            id="postEditorHtmlPreview"
            hidden
          >

            <p
              class="post-editor-html-preview-empty"
              id="postEditorHtmlPreviewEmpty"
            >
              HTML을 입력하면 여기에 디자인이 보입니다.
            </p>

          </div>


          <div class="post-editor-preview-stage-meta">

            <span
              class="post-editor-preview-export-size"
              id="postEditorPreviewExportSize"
            ></span>

          </div>


          <!-- =================================================
               CANVAS VIEWPORT

               앞으로 이 안에
               4:5 페이지가 한 장씩 표시됨.
          ================================================== -->

          <div
            class="post-editor-preview-stage"
            id="postEditorPreviewStage"
          >


            <!-- ===============================================
                 DESKTOP ZOOM CONTROL

                 모바일은 핀치 줌으로 배율을 바꾸지만
                 데스크톱은 그 제스처가 없으므로, 캔버스
                 우측 상단에 소형 +/- 버튼을 대신 둔다.
                 (posts-toolbar-toggles.js에서 동작 연결)
            ================================================ -->

            <div
              class="post-editor-preview-zoom"
              id="postEditorPreviewZoom"
            >


              <button
                class="post-editor-preview-zoom-button"
                id="postEditorPreviewZoomOut"
                type="button"
                aria-label="축소"
              >
                −
              </button>


              <span
                class="post-editor-preview-zoom-level"
                id="postEditorPreviewZoomLevel"
              >
                100%
              </span>


              <button
                class="post-editor-preview-zoom-button"
                id="postEditorPreviewZoomIn"
                type="button"
                aria-label="확대"
              >
                +
              </button>


            </div>


            <div
              class="post-editor-preview-pages"
              id="postEditorPreviewPages"
            >


              <!-- =============================================
                   PAGE 1

                   JS에서 내용이 넘치면
                   같은 구조의 PAGE 2, 3... 자동 생성 예정.
              ============================================== -->

              <article
                class="post-editor-preview post-editor-preview-page"
                id="postEditorPreview"
                data-page-index="0"
              >


                <div
                  class="post-editor-preview-title"
                  id="postEditorPreviewTitle"
                ></div>


                <div
                  class="post-editor-preview-content"
                  id="postEditorPreviewContent"
                ></div>


              </article>


            </div>


            <!-- ===============================================
                 PAGE NAVIGATION

                 캔버스(stage) 안쪽에 떠 있는 오버레이.
                 stage는 핀치 줌/이동 뷰포트라
                 실제 캔버스 위치는 변할 수 있으므로,
                 캔버스 모서리가 아니라 stage 하단 중앙에
                 고정해 항상 같은 자리에 보이게 함.
            ================================================ -->

            <div
              class="post-editor-preview-pagination"
              id="postEditorPreviewPagination"
              hidden
            >


              <button
                class="post-editor-preview-page-button"
                id="postEditorPreviewPrev"
                type="button"
                aria-label="이전 페이지"
              >
                ‹
              </button>


              <span
                class="post-editor-preview-page-indicator"
                id="postEditorPreviewPageIndicator"
              >
                1 / 1
              </span>


              <button
                class="post-editor-preview-page-button"
                id="postEditorPreviewNext"
                type="button"
                aria-label="다음 페이지"
              >
                ›
              </button>


            </div>

          </div>


          <!--
            DRAG HANDLE (resize) — 예전엔 시트 맨 위에 있었는데,
            아래로 옮겨서 캔버스 바로 아래(시트 맨 끝)에 둔다.
            드래그 델타 계산(handlePreviewDragPointerMove,
            posts-preview-mobile.js)은 손잡이의 화면 위치가
            아니라 pointerdown 이후의 y 이동량만 보므로, 위치를
            옮겨도 동작은 그대로다.
          -->

          <div
            class="post-editor-preview-drag-handle"
            id="postEditorPreviewDragHandle"
            aria-hidden="true"
          ></div>


        </div>

      </section>



      <!-- ===================================================
           EDITOR BUTTONS
      ==================================================== -->

<div class="post-editor-actions">

  <button
    id="postEditorCancelButton"
    class="post-editor-button"
    type="button"
  >
    cancel
  </button>

  <!--
    수정 폼에서만 보인다(새 글에는 지울 대상이 없다).

  -->

  <button
    id="postEditorDeleteButton"
    class="post-editor-button delete"
    type="button"
    hidden
  >
    delete
  </button>

  <button
    id="postEditorCopyButton"
    class="post-editor-button copy"
    type="button"
  >
    copy
  </button>

  <button
    id="postEditorExportButton"
    class="post-editor-button export"
    type="button"
  >
    export
  </button>

  <button
    id="postEditorSaveButton"
    class="post-editor-button save"
    type="button"
  >
    save
  </button>

</div>


<!--
  cancel/export/save 버튼 바로 아래.
  버튼 위(CONTENT 옆)에 있으면 스크롤해서 안 보이는 경우가
  많아서, 방금 누른 버튼과 같은 화면에 항상 보이는 여기로 옮김.
-->

<div
  class="post-editor-message"
  id="postEditorMessage"
></div>


    </section>


  </div>

  <div
