<!-- =========================================================
     POSTS
========================================================== -->

<!-- =========================================================
     PUBLISHED SKIN 전환 대기 표시(posts-view-transition.js).
     CATEGORY/POST가 published Skin 경로를 탈 수 있는 대상일 때만,
     응답이 오래 걸릴 경우에 한해 잠깐 보인다 — 클릭 불가
     (pointer-events:none)라 중복 이동을 유발하지 않는다.

     ★ #postArea 바깥(#postsMount 직속)에 둔다. published Skin
     경로는 다음 화면이 완성될 때까지 이전 화면을 그대로 두고
     #postArea를 hidden으로 유지하는데(posts-view-list.js/
     posts-view-detail.js의 revealPostArea 지점), 이 표시가
     #postArea 안에 있으면 정작 기다리는 그 시간 동안 함께
     display:none이 되어 절대 보이지 않는다. position:fixed라
     어느 쪽에 있든 화면상 위치는 동일하다.
========================================================== -->

<div
  class="post-pending-indicator"
  id="postPendingIndicator"
  hidden
  aria-hidden="true"
></div>


<section
  class="post-area"
  id="postArea"
  hidden
>

  <div class="post-container" id="postContainer">


    <!-- =====================================================
         POST HEADER
    ====================================================== -->

    <header class="post-header">

      <button
        class="post-back-button"
        id="postBackButton"
        type="button"
        aria-label="뒤로 가기"
      >
        ←
      </button>


      <h1
        class="post-page-title"
        id="postPageTitle"
      ></h1>


      <button
        class="list-edit-toggle-button"
        id="bannerEditToggleButton"
        type="button"
        aria-label="배너 편집"
        hidden
      >
        edit
      </button>


      <button
        class="list-edit-toggle-button"
        id="postListEditToggleButton"
        type="button"
        aria-label="글 목록 편집"
        hidden
      >
        edit
      </button>


      <!--
        PHASE 1E 후속: 소유자가 자기 글을 POST 스킨으로 읽는 중에
        기존 관리 화면(legacy 상세 + edit/delete)을 명시적으로 열고
        닫는 진입점. 배너/글 목록의 edit 토글과 같은 자리, 같은
        모양이고, 스킨이 실제로 그 글을 그렸고 보는 사람이 이
        사이트의 소유자일 때만 나타난다.
      -->

      <button
        class="list-edit-toggle-button"
        id="postManageToggleButton"
        type="button"
        aria-label="글 관리"
        aria-pressed="false"
        hidden
      >
        edit
      </button>


      <button
        class="post-add-button"
        id="postAddButton"
        type="button"
        aria-label="글 추가"
        hidden
      >
        ＋
      </button>

    </header>



    <!-- =====================================================
         글 카테고리 없음 안내 (WRITE)

         스킨의 WRITE를 눌렀는데 글 카테고리가 하나도 없어서
         작성 폼을 열 수 없을 때만 나타난다. 카테고리가 하나라도
         있으면 이 화면 없이 곧장 작성 폼이 열리고, 어느 카테고리에
         쓸지는 폼 안의 CATEGORY 드롭다운에서 고른다.
         posts/view/posts-view-compose.js 참고.
    ====================================================== -->

    <section
      class="post-compose-notice"
      id="postComposeNotice"
      hidden
    >

      <p
        class="post-compose-notice-hint"
        id="postComposeNoticeHint"
      ></p>

      <a
        class="post-compose-notice-admin"
        id="postComposeNoticeAdmin"
        href="/admin/"
      >
        설정에서 카테고리 만들기
      </a>

      <button
        class="post-compose-notice-close"
        id="postComposeNoticeClose"
        type="button"
      >
        cancel
      </button>

    </section>


    <!-- =====================================================
         CATEGORY POST LIST
    ====================================================== -->

    <div
      class="post-list"
      id="postList"
    ></div>


    <!-- =====================================================
         글 목록 편집 모드: 선택 삭제

         edit 모드에서만 보임(posts-view-list-select.js).
    ====================================================== -->

    <div
      class="post-list-select-bar"
      id="postListSelectBar"
      hidden
    >

      <span
        class="post-list-select-count"
        id="postListSelectCount"
      >
        0개 선택됨
      </span>

      <button
        class="post-list-select-delete"
        id="postListSelectDeleteButton"
        type="button"
        disabled
      >
        delete
      </button>

    </div>


    <!-- =====================================================
         BANNER 카테고리

         posts-view-banner.js 참고. 글 목록 대신 이게 보임.
    ====================================================== -->

    <div
      class="banner-grid"
      id="bannerGrid"
      hidden
    ></div>


    <form
      class="banner-editor"
      id="bannerEditor"
      hidden
    >

      <div class="banner-editor-heading">
        <span id="bannerEditorHeading">
          ADD BANNER
        </span>
      </div>

      <div class="banner-editor-field">
        <label for="bannerEditorName">
          NAME
        </label>
        <input
          id="bannerEditorName"
          type="text"
          autocomplete="off"
          placeholder="사이트/지인 이름"
        >
      </div>

      <div class="banner-editor-field">
        <label for="bannerEditorUrl">
          URL
        </label>
        <input
          id="bannerEditorUrl"
          type="url"
          autocomplete="off"
          placeholder="https://..."
        >
      </div>

      <!--
        배너 이미지는 URL을 직접 입력받지 않고 Storage에
        업로드함(친구가 이미지를 지우거나 옮기면 우리 목록도
        깨지는 문제 방지) — posts-view-banner-form.js 참고.
      -->

      <div class="banner-editor-field">

        <label for="bannerEditorFileInput">
          BANNER IMAGE
        </label>

        <div class="banner-editor-image-row">

          <img
            class="banner-editor-preview"
            id="bannerEditorPreview"
            alt=""
            hidden
          >

          <div
            class="banner-editor-preview-empty"
            id="bannerEditorPreviewEmpty"
          >
            이미지 없음
          </div>

          <label
            class="banner-editor-change-button"
            for="bannerEditorFileInput"
          >
            change
          </label>

          <input
            class="banner-editor-file-input"
            id="bannerEditorFileInput"
            type="file"
            accept="image/*"
            hidden
          >

        </div>

        <p
          class="banner-editor-upload-message"
          id="bannerEditorUploadMessage"
        ></p>

      </div>

      <div class="banner-editor-actions">

        <button
          type="button"
          class="banner-editor-delete"
          id="bannerEditorDelete"
          hidden
        >
          delete
        </button>

        <button
          type="button"
          class="banner-editor-cancel"
          id="bannerEditorCancel"
        >
          cancel
        </button>

        <button
          type="submit"
          class="banner-editor-save"
          id="bannerEditorSave"
        >
          save
        </button>

      </div>

      <div
        class="banner-editor-message"
        id="bannerEditorMessage"
      ></div>

    </form>



    <!-- =====================================================
         POST DETAIL
    ====================================================== -->

    <article
      class="post-detail"
      id="postDetail"
      hidden
    >

      <div class="post-detail-heading">

        <h1
          class="post-detail-title"
          id="postDetailTitle"
        ></h1>


        <div
          class="post-detail-font-scale"
          id="postDetailFontScale"
          hidden
        >

          <button
            class="post-detail-font-scale-button"
            id="postDetailFontScaleDown"
            type="button"
            aria-label="글자 크기 작게"
          >
            -
          </button>

          <button
            class="post-detail-font-scale-button"
            id="postDetailFontScaleUp"
            type="button"
            aria-label="글자 크기 크게"
          >
            +
          </button>

        </div>


        <div
          class="post-detail-actions"
          id="postDetailActions"
          hidden
        >

          <button
            class="post-action-button"
            id="postEditButton"
            type="button"
          >
            edit
          </button>


          <button
            class="post-action-button post-delete-button"
            id="postDeleteButton"
            type="button"
          >
            delete
          </button>

        </div>

      </div>


      <div
        class="post-detail-date"
        id="postDetailDate"
      ></div>


      <!--
        HTML 모드 글은 폭이 고정된 마크업(카톡 대화창 재현 등)일
        때가 많아서, 화면보다 넓으면 postDetailContent 전체를
        축소(scale)해서 화면 안에 들어오게 한다(posts-view.js의
        fitHtmlPostContentToViewport). wrap은 그 축소된 실제
        높이만큼만 자리를 차지하게 하는 용도.
      -->

      <div
        class="post-detail-content-wrap"
        id="postDetailContentWrap"
      >

        <div
          class="post-detail-content"
          id="postDetailContent"
        ></div>

      </div>


      <!-- ===================================================
           SECRET GATE

           비밀글을 주인이 아닌 사람이 열었을 때, 본문
           대신 이게 보임. 비밀번호는 get_secret_post_content
           RPC로 DB에서만 대조된다(posts-view.js).
      ==================================================== -->

      <form
        class="post-secret-gate"
        id="postSecretGate"
        hidden
      >

        <div class="post-secret-gate-icon">
          🔒
        </div>

        <div class="post-secret-gate-label">
          비밀글입니다
        </div>

        <input
          class="post-secret-gate-input"
          id="postSecretGateInput"
          type="password"
          inputmode="text"
          autocomplete="off"
          placeholder="비밀번호"
        >

        <button
          class="post-secret-gate-button"
          id="postSecretGateSubmit"
          type="submit"
        >
          확인
        </button>

        <div
          class="post-secret-gate-message"
          id="postSecretGateMessage"
        ></div>

      </form>



      <!-- ===================================================
           RELATED POSTS
      ==================================================== -->

      <section
        class="post-related"
        id="postRelated"
      >

        <div
          class="post-related-title"
          id="postRelatedTitle"
        ></div>


        <div
          class="post-related-list"
          id="postRelatedList"
        ></div>

      </section>

    </article>


    <!-- ===================================================
         POST SKIN CONTAINER (PHASE 1C-F)

         published Skin이 이 POST를 지원할 때만 채워진다
         (skin/skin-post.js). Skin outer chrome(article 전체)을
         이 컨테이너가 통째로 소유하고, 그 안의
         [data-imory-region="post-body"]에 기존 Quote
         Preset/raw HTML/secret gate 렌더러가 그대로 mount된다
         (posts/view/posts-view-detail.js). 지원하지 않으면
         항상 hidden으로 남고 위 #postDetail이 쓰인다.
    ==================================================== -->

    <div
      class="post-skin-container"
      id="postSkinContainer"
      hidden
    ></div>


    <!-- =====================================================
         POST EDITOR
    ====================================================== -->

    <section
      class="post-editor"
      id="postEditor"
      hidden
    >


      <!-- ===================================================
           CATEGORY
      ==================================================== -->

      <div class="post-editor-field">

        <label
          for="postEditorCategory"
        >
          CATEGORY
        </label>


        <select
          id="postEditorCategory"
          class="post-editor-input"
        ></select>

      </div>



      <!-- ===================================================
           FOLDER

           카테고리 안의 폴더(FOLDER-1, 최대 3단계)를 글쓰기/수정
           폼에서 바로 고른다. 예전에는 새 글이 항상 카테고리 root에
           생기고 폴더 배치는 ?manage=1 관리 트리에서 끌어다 놓아야만
           가능했다.

           목록은 위 CATEGORY에서 고른 카테고리의 폴더만 보여주고,
           카테고리를 바꾸면 다시 채운다(loadPostEditorFolders,
           posts/editor/format/posts-editor-folder.js). 폴더가 하나도
           없는 카테고리에서는 이 칸 자체가 숨는다 — 고를 것이 없는
           빈 드롭다운을 남기지 않는다.

           저장은 posts 테이블에 folder_id를 직접 쓰지 않는다(그
           컬럼에는 INSERT/UPDATE GRANT가 없다) — move_tree_node()
           RPC로만 옮긴다(posts/editor/posts-save.js).
      ==================================================== -->

      <div
        class="post-editor-field"
        id="postEditorFolderField"
        hidden
      >

        <label
          for="postEditorFolder"
        >
          FOLDER
        </label>


        <select
          id="postEditorFolder"
          class="post-editor-input"
        ></select>

      </div>



      <!-- ===================================================
           TITLE
      ==================================================== -->

      <div class="post-editor-field">

        <label
          for="postEditorTitle"
        >
          TITLE
        </label>


        <input
          id="postEditorTitle"
          class="post-editor-input"
          type="text"
          autocomplete="off"
        >

      </div>



      <!-- ===================================================
           대표 이미지 = 본문 사진

           예전에는 여기에 COVER 업로드 칸과 갤러리 전용 사진
           목록이 따로 있었다. 지금은 post/gallery 모두 아래
           CONTENT의 공통 본문 편집 영역에서 사진을 넣고, 그 중
           하나를 '대표'로 고른다(지정하지 않으면 첫 번째 사진).

           기준 문서: IMORY_POST_BODY_IMAGE_DESIGN.md
           코드: posts/editor/posts-body-images.js

           예전에 올려 둔 COVER 데이터는 지우지 않는다 — 본문에
           사진이 없는 글의 썸네일로 계속 쓰인다.
      ==================================================== -->




      <!-- ===================================================
           OOC + HTML MODE

           OOC: 독자에게는 보이지 않는 메모/설정 노트.
           본문과 완전히 분리된 별도 필드(ooc_content)로
           저장되어서, 뷰어 쪽에서 아예 안 가져오면
           절대 노출되지 않는다.

           HTML: 누르면 아래 CONTENT의 리치텍스트 에디터가
           통째로 사라지고 raw HTML textarea만 나온다.
      ==================================================== -->

      <div class="post-editor-field post-editor-ooc-field">

        <div class="post-editor-ooc-html-row">

          <button
            type="button"
            class="post-editor-ooc-toggle"
            id="postEditorOOCToggle"
            aria-expanded="false"
            aria-controls="postEditorOOC"
          >
            OOC
          </button>


          <button
            type="button"
            class="post-editor-content-mode-toggle"
            id="postEditorHtmlModeToggle"
            aria-pressed="false"
            title="HTML로 직접 작성 (뷰어에서 그대로 출력됨)"
          >
            HTML
          </button>


          <button
            type="button"
            class="post-editor-content-mode-toggle post-editor-visibility-toggle"
            id="postEditorSecretToggle"
            aria-pressed="false"
            aria-controls="postEditorSecretPassword"
            title="비밀글: 목록엔 제목만 보이고, 비밀번호를 맞혀야 본문이 열립니다"
          >
            🔒 비밀글
          </button>


          <button
            type="button"
            class="post-editor-content-mode-toggle post-editor-visibility-toggle"
            id="postEditorPrivateToggle"
            aria-pressed="false"
            title="비공개: 목록에도 보이지 않고, 나만 볼 수 있습니다"
          >
            🙈 비공개
          </button>

        </div>


        <textarea
          id="postEditorOOC"
          class="post-editor-input post-editor-ooc-textarea"
          placeholder="독자에게는 보이지 않는 메모입니다."
          hidden
        ></textarea>


        <input
          id="postEditorSecretPassword"
          class="post-editor-input post-editor-secret-password-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          placeholder="비밀글 비밀번호 (비워두면 기존 비밀번호 유지)"
          hidden
        >

      </div>



      <!-- ===================================================
           CONTENT
      ==================================================== -->

      <div class="post-editor-field">


        <!-- CONTENT -->

        <div class="post-editor-content-heading">

          <div class="post-editor-content-label">
            CONTENT
          </div>

        </div>



        <!-- =================================================
             HTML MODE

             켜면 리치텍스트 에디터 대신 이 textarea에
             HTML을 직접 작성. 저장 시 그대로(sanitize 없이)
             content에 들어가고, 뷰어에서도 그대로 출력된다.
             이 모드에서는 발췌 프리뷰/export가 의미 없으므로
             (posts.js에서) 그 버튼들도 함께 숨긴다.
        ================================================== -->

        <textarea
          id="postEditorHtmlContent"
          class="post-editor-input post-editor-html-textarea"
          placeholder="여기에 HTML을 직접 작성하세요."
          spellcheck="false"
          hidden
        ></textarea>



        <!-- =================================================
             RICHTEXT MODE (기존 툴바 + 리치텍스트 에디터)
        ================================================== -->

        <div id="postEditorRichtextMode">


        <!-- =================================================
             TOOLBAR
        ================================================== -->

        <div
          class="post-editor-toolbar"
          id="postEditorToolbar"
        >


          <!-- =================================================
               PAGE BREAK
          ================================================== -->

          <div class="post-editor-tool-group">

            <span class="post-editor-tool-label">
              PAGE
            </span>


            <button
              class="post-editor-tool-button page-break"
              id="postEditorPageBreak"
              type="button"
              title="현재 위치에서 다음 페이지로 넘기기"
            >
              break
            </button>

          </div>



          <!-- =================================================
               HIGHLIGHT
          ================================================== -->

          <div class="post-editor-tool-group">

            <span class="post-editor-tool-label">
              HIGHLIGHT
            </span>


            <!--
              단일 컨트롤. 초기 색은 QUOTE PRESET의 하이라이트
              색(getPresetHighlightColor)을 따르고, 누르면 우리가
              직접 그리는 컬러피커 팝오버가 열린다
              (posts/editor/posts-color-picker.js).

              ★ <input type="color">를 쓰지 않는 이유
              OS 컬러피커는 스펙트럼에서 한 번 누르면 그대로 닫혀
              이어서 조정할 수 없고, 열리는 동안 본문 선택과 포커스를
              가져간다(요구사항 1).
            -->

            <button
              class="post-highlight-custom-control"
              id="postEditorCustomControl"
              type="button"
              title="highlight color"
              aria-label="하이라이트 색상 선택"
            >

              <span
                class="post-highlight-swatch"
                id="postEditorCustomSwatch"
              ></span>

            </button>

          </div>



          <!-- =================================================
               POINT COLOR
          ================================================== -->

          <div class="post-editor-tool-group">

            <span class="post-editor-tool-label">
              POINT COLOR
            </span>


            <!--
              단일 컨트롤. 초기 색은 QUOTE PRESET의 포인트 컬러
              (getPresetPointColor)를 따르고, 누르면 HIGHLIGHT와
              **같은 컬러피커**가 열린다.
            -->

            <button
              class="post-highlight-custom-control"
              id="postEditorCustomPointControl"
              type="button"
              title="point color"
              aria-label="포인트 컬러 선택"
            >

              <span
                class="post-highlight-swatch"
                id="postEditorCustomPointSwatch"
              ></span>

            </button>

          </div>




          <!-- =================================================
               PHOTO (본문 사진)

               POINT COLOR 바로 옆. 여러 장을 고를 수 있고,
               고른 순서대로 **지금 커서 자리**에 들어간다.
               고른 파일은 저장을 눌러야 올라간다
               (posts/editor/posts-body-images.js).

               파일 입력은 화면에서 감춘다 — 버튼이 caret을
               먼저 붙잡은 뒤 대신 눌러준다. 모바일에서 파일
               선택창이 편집 영역의 선택을 가져가도 삽입 자리가
               유지되는 이유다.
          ================================================== -->

          <div class="post-editor-tool-group">

            <span class="post-editor-tool-label">
              PHOTO

            ================================================ -->

            <div
              class="post-editor-preview-pagination"
              id="postEditorPreviewPagination"
              hidden
            >


              <button
                class="post-editor-preview-page-button"
                id="postEditorPreviewPrev"
                type="button"
                aria-label="이전 페이지"
              >
                ‹
              </button>


              <span
                class="post-editor-preview-page-indicator"
                id="postEditorPreviewPageIndicator"
              >
                1 / 1
              </span>


              <button
                class="post-editor-preview-page-button"
                id="postEditorPreviewNext"
                type="button"
                aria-label="다음 페이지"
              >
                ›
              </button>


            </div>

          </div>


          <!--
            DRAG HANDLE (resize) — 예전엔 시트 맨 위에 있었는데,
            아래로 옮겨서 캔버스 바로 아래(시트 맨 끝)에 둔다.
            드래그 델타 계산(handlePreviewDragPointerMove,
            posts-preview-mobile.js)은 손잡이의 화면 위치가
            아니라 pointerdown 이후의 y 이동량만 보므로, 위치를
            옮겨도 동작은 그대로다.
          -->

          <div
            class="post-editor-preview-drag-handle"
            id="postEditorPreviewDragHandle"
            aria-hidden="true"
          ></div>


        </div>

      </section>



      <!-- ===================================================
           EDITOR BUTTONS
      ==================================================== -->

<div class="post-editor-actions">

  <button
    id="postEditorCancelButton"

  >

    type="button"
    hidden

    delete
  </button>

  <button

    class="post-editor-button copy"
    type="button"
  >
    copy
  </button>

  <button
    id="postEditorExportButton"
    class="post-editor-button export"
    type="button"
  >
    export
  </button>

  <button
    id="postEditorSaveButton"
    class="post-editor-button save"
    type="button"
  >
    save
  </button>

</div>


<!--
  cancel/export/save 버튼 바로 아래.

  많아서, 방금 누른 버튼과 같은 화면에 항상 보이는 여기로 옮김.
-->

<div
  class="post-editor-message"

></div>
