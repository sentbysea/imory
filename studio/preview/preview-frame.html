<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Skin Preview</title>

  <!--
    AI_SKIN_PHASE1B_DESIGN.md Slice 3, 11-4/11-5절. 이 문서는
    studio/index.html의 #studioPreviewFrame iframe 하나에만 로드되는
    단일 Preview 문서다 — Desktop/Mobile 전환은 studio/index.html이
    이 iframe의 CSS width만 바꾸는 방식으로 이뤄지므로(문서
    재로드 없음), 이 문서 자체는 뷰포트 폭에 대해 아무 것도 몰라도
    된다. 실제 Skin의 @media 쿼리는 이 문서의 레이아웃 뷰포트
    (iframe 자신의 폭)를 기준으로 브라우저가 자연스럽게 재평가한다.

    admin/studio 공통 UI 크롬(Pretendard/design-tokens.css)은 의도적으로
    로드하지 않는다 — 이 문서가 보여주는 것은 Imory 관리 UI가 아니라
    "사용자의 공개 HOME이 지금 어떻게 보이는가"이므로, 공개 HOME과
    동일하게 아무 전제 스타일 없이 Skin CSS만으로 렌더되어야 한다.
  -->

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: #ffffff;
    }

    /*
      PHASE AI-6A — Inspector가 켜져 있는 동안에만 붙는 클래스
      (studio/preview/preview-bridge.js setInspectorEnabled). 커서
      말고는 아무 것도 바꾸지 않는다 — 테두리 표시는 Studio가
      Preview 위에 얹는 overlay가 담당하므로 스킨 DOM/CSS는 그대로다.
    */
    body.imory-inspector-on,
    body.imory-inspector-on * {
      cursor: crosshair !important;
    }

    /*
      Select mode 직접 편집 라운드 — 모서리 핸들로 이미지 크기를
      바꾸는 동안 브라우저 기본 이미지 드래그가 끼어들면 포인터
      이동이 그쪽으로 넘어가 버린다(preview-bridge.js가 dragstart도
      막지만, 아예 시작 자체를 못 하게 하는 쪽이 확실하다).
    */
    body.imory-inspector-on img {
      -webkit-user-drag: none;
      user-select: none;
    }

  </style>

  <!--
    Studio Banner Category Preview(PHASE — Banner Category Preview)
    전용. banner category(category.type === "banner")는 Skin
    template 시스템 밖에서 이 문서가 직접 그리는 read-only adapter로
    렌더된다(공개 Skin CATEGORY 렌더러가 banner 타입을 아예 타지
    않는 것과 같은 경계, skin/skin-category.js 참고) — 그래서
    renderSkin()이 쓰는 Skin CSS가 아니라 공개 legacy Banner
    렌더러(posts/view/posts-view-banner.js)와 같은 시각 표현을 써야
    한다. posts-list-detail.css 전체(post-list/detail 등 무관한
    규칙 포함)를 중복 로드하지 않도록, banner-card/grid 규칙만 뽑아
    둔 posts/view/posts-view-banner.css 하나만 공유해서 로드한다
    (index.html의 공개 라우트와 동일한 소스, 디자인 변경 없음).
  -->

  <!-- =========================================================
       배포 버전 원천 — 이 파일만 ?t= 로 받는다

       Preview는 Studio 안에서 iframe으로 계속 재사용되는 문서라
       CSS/JS가 오래 캐시되면 부모(Studio)와 버전이 어긋난다.
       배경: core/lib/build-version.js 상단 주석.
  ========================================================== -->

  <script>

    document.write(
      '<script src="../../core/lib/build-version.js?t=' +
      Date.now() +
      '"><' + '/script>'
    );

  </script>


  <script>

    loadVersionedStyles(
      [
        "../../posts/view/posts-view-banner.css",

        /*
          복사 상자 · 메모 · 구분선 — POST region이 그리는 본문에
          들어갈 수 있으므로 Preview도 같은 CSS를 읽어야
          공개 화면과 같은 모양이 나온다.
        */
        "../../posts/posts-body-blocks.css",

        /* 공개 화면과 같은 폭 계약을 Preview에도 건다. iframe은
           독립된 browsing context라 부모 문서의 <link>를 물려받지
           않는다(아래 import map과 같은 이유). */
        "../../core/content-width.css",

        /*
          HIGHLIGHT-1 후속 — 메모 카드의 ⋮ · 메뉴 · 메모 팝업 ·
          토스트, 그리고 플랫폼 기본 메모 진입점 칩. Preview에서
          그것들이 공개 화면과 **같은 모양**으로 보여야 하므로
          같은 스타일시트를 읽는다.
        */
        "../../posts/posts-highlight.css",

        /* Preview에만 있는 chrome(주인장/방문자 칩) */
        "./preview-memo-tools.css"
      ]
    );


    /*
      preview-bridge.js(모듈)가 정적 import로 끌어오는
      skin-render.js와, 그 안이 다시 import하는 skin-css-validate.js는
      import 지정자가 문자열 리터럴이라 ?v=가 붙지 않는다.
      부모 Studio 문서와 같은 표를 여기서도 쓴다 — iframe은 독립된
      browsing context라 부모의 import map을 물려받지 않는다.
    */

    writeVersionedImportMap(
      [
        "/skin/skin-render.js",
        "/skin/skin-css-validate.js",
        "/core/content-width.js"
      ]
    );

  </script>

</head>


<body>

  <div id="previewRoot"></div>


  <!-- =========================================================
       renderSkin() 신뢰 경계(Slice 3.5)를 그대로 유지한다 —
       preview-bridge.js는 sanitize/validate를 직접 하지 않고
       renderSkin() 호출 하나에 전부 맡긴다(그 함수가 매 호출마다
       항상 재검증하므로, 부모가 postMessage로 보낸 draft가 아직
       저장되지 않았거나 malformed여도 안전하다).

       skin-sanitize.js는 classic script로 먼저 로드해 전역
       sanitizeSkinHTML()/isSafeSkinUrl()을 제공해야 한다
       (skin-render.js가 이 전역에 의존 — skin/skin-render.js 파일
       상단 주석과 동일한 순서 제약).
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "../../skin/skin-sanitize.js",

        /*
          PHASE AI-6A — Inspector가 "이 요소를 고를 수 있는가"를
          판정하는 규칙(isInspectableElement)은 Studio와 이 문서가
          **같은 것**을 써야 한다. 두 문서는 서로 다른 browsing
          context라 전역을 공유하지 않으므로, 의존이 전혀 없는 이
          순수 함수 파일만 양쪽에 각각 로드한다(로직을 복붙하지
          않기 위해서다).
        */
        "../../studio/inspector/studio-inspector-model.js",

        /*
          이미지 자르기 라운드 — 자르기 값(비율/확대/구도)을 CSS
          선언으로 바꾸는 계산도 Studio와 이 문서가 **같은 것**을
          써야 한다. 확정 결과(저장되는 CSS 규칙)와 임시 미리보기
          (이 문서의 inline style)가 한 픽셀이라도 다르면 "적용을
          눌렀더니 구도가 달라졌다"가 된다. 위와 같은 이유로 의존
          없는 순수 함수 파일만 따로 로드한다.
        */
        "../../studio/inspector/studio-inspector-crop-model.js",

        /*
          HIGHLIGHT-1 후속 — 메모 화면 재료.

          셋 다 의존이 얕아서 그대로 실을 수 있다:
            posts-view-popover.js         순수 DOM(의존 없음)
            posts-view-memo-card-tools.js popover 하나만 본다
            skin-memo-entry.js            앞부분(칩 만들기)은 의존 없음.
                                          뒷부분(공개 화면 컨트롤러)은
                                          supabaseClient/getSiteOwner가
                                          없으면 실행되지 않는다.

          공개 화면과 **같은 파일**을 읽는 것이 핵심이다 — Preview용
          복제본을 만들면 두 화면이 서서히 달라진다.
        */
        "../../posts/view/posts-view-popover.js",
        "../../posts/view/posts-view-memo-card-tools.js",
        "../../skin/skin-memo-entry.js",
        "./preview-memo-tools.js"
      ]
    );


    loadVersionedModules(
      [
        "./preview-bridge.js"
      ]
    );

  </script>

</body>

</html>
