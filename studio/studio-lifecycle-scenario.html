    studio/studio-lifecycle-test.html 전용 시나리오 문서 —

  <script>
    window.skinInitializerReady = new Promise(function (resolve) {

  <!--
    skin-generator.js를 mock 정의(아래)보다 먼저 로드한다(그 대신
    아래 production 스크립트 목록에서는 제거했다 — classic script를
    같은 문서에 두 번 로드하면 top-level const 재선언 SyntaxError가
    난다) — Scenario R(PHASE 1C-H)의 fixture는 손으로 쓴 마커
    마크업 대신 실제 window.generateInitialSkin()을 호출해 만들므로,
    FIXTURES 객체 리터럴이 평가되는 시점에 이 전역이 이미 있어야
    한다. 의존 없는 순수 함수 파일이라(파일 상단 주석 참고) 로드
    시점을 앞당겨도 다른 프로덕션 스크립트 동작에는 영향이 없다.
  -->
  <script src="../skin/skin-generator.js"></script>

  <!-- =========================================================
       MOCK SUPABASE CLIENT (test only) — 실제 supabase-js/
       supabase-client.js 대신, ?scenario= 값에 따라 in-memory
       fixture를 돌려주는 최소 mock. 이 파일 이후에 로드되는
       production 코드(skin-context.js/studio-preview.js/
       studio-state.js/skin-initializer.js)는 전부 실제 파일이며
       이 mock을 구분하지 못한다(동일한 supabaseClient 계약만
       구현).
  ========================================================== -->

  <script>
    (function () {

      /*
        약간의 인위적 지연 — 없으면 mock Promise가 전부 같은
        microtask tick에 풀려서, loading overlay가 실제로 화면에
        떠 있는 구간을 통합 테스트가 관찰할 기회조차 없이 렌더가
        끝나 버린다(overlay가 "떠 있다가 사라지는지"를 검증하려면
        떠 있는 구간이 실제로 존재해야 한다).
      */
      const MOCK_LATENCY_MS = 150;

      function delayed(result) {
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(result); }, MOCK_LATENCY_MS);
        });
      }

      function makeQuery(rows) {

        /*
          GALLERY-1로 세 가지가 늘었다(전부 additive — 기존 scenario는
          호출하지 않으므로 동작이 달라지지 않는다):
            .is(col, null) / .not(col, "is", null)  — folder_id 분기
            .range(from, to) + select(cols,{count}) — 페이지 조회
          count는 range로 자르기 **전**의 행 수다(PostgREST와 같다).
        */

        let wantsCount = false;
        let outOfRange = false;
        let total = null;
        const orderKeys = [];

        const query = {
          select: function (cols, opts) {
            if (opts && opts.count) { wantsCount = true; }
            return query;
          },
          eq: function (col, val) { rows = rows.filter(function (r) { return r[col] === val; }); return query; },
          in: function (col, vals) { rows = rows.filter(function (r) { return vals.indexOf(r[col]) !== -1; }); return query; },
          is: function (col, val) {
            rows = rows.filter(function (r) {
              return val === null
                ? (r[col] === null || r[col] === undefined)
                : r[col] === val;
            });
            return query;
          },
          not: function (col, op, val) {
            rows = rows.filter(function (r) {
              if (op === "is" && val === null) {
                return !(r[col] === null || r[col] === undefined);
              }
              return r[col] !== val;
            });
            return query;
          },
          /*
            GALLERY-1: order()를 여러 번 부르면 PostgREST는 **복합
            정렬 키**로 다룬다(order=created_at.desc,id.desc). 예전에는
            매번 전체를 다시 정렬해서 마지막 키 하나만 남았고, 그래서
            같은 데이터인데 Preview와 공개 화면의 순서가 달라졌다.
            누적한 키를 순서대로 비교한다.
          */
          order: function (col, opts) {
            orderKeys.push({
              col: col,
              asc: !opts || opts.ascending !== false
            });
            rows = rows.slice().sort(function (a, b) {
              for (let i = 0; i < orderKeys.length; i += 1) {
                const key = orderKeys[i];
                if (a[key.col] === b[key.col]) continue;
                return (a[key.col] > b[key.col] ? 1 : -1) * (key.asc ? 1 : -1);
              }
              return 0;
            });
            return query;
          },
          limit: function (n) { rows = rows.slice(0, n); return query; },
          range: function (from, to) {
            total = rows.length;
            if (from > 0 && from >= total) { outOfRange = true; }
            rows = rows.slice(from, to + 1);
            return query;
          },
          maybeSingle: function () { return delayed({ data: rows[0] || null, error: null }); },
          single: function () {
            return delayed(
              rows[0]
                ? { data: rows[0], error: null }
                : { data: null, error: new Error("not found") }
            );
          },
          then: function (resolve, reject) {
            if (outOfRange) {
              return delayed({
                data: null,
                count: total,
                error: {
                  code: "PGRST103",
                  message: "Requested range not satisfiable"
                }
              }).then(resolve, reject);
            }
            return delayed({
              data: rows,
              error: null,
              count: wantsCount ? (total === null ? rows.length : total) : null
            }).then(resolve, reject);
          }
        };
        return query;
      }

      const scenario = new URLSearchParams(window.location.search).get("scenario");

      const FIXTURES = {

        a: {
          userId: "user-a",
          tables: {
            skins: [
              { id: "skin-a1", user_id: "user-a", is_active: true, current_draft_version_id: "draft-a1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-a1",
                content: {
                  schemaVersion: 1,
                  html: '<div class="scenario-a-marker"><h1 data-imory-bind="site.title"></h1><p data-imory-bind="profile.nickname"></p></div>',
                  css: ".scenario-a-marker { color: red; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }
            ],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-a", nickname: "Scenario A", bio: "hello", slug: "scenario-a" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            /*
              Slice 4 — save_skin_draft_version() mock. 새 skin_versions
              row를 fixture의 in-memory 테이블에 실제로 추가하고
              skins.current_draft_version_id도 옮겨서, 테스트가
              "버전 수 +1 / draft pointer 이동"을 실제 데이터로 확인할
              수 있게 한다. window.top.__savedDraftCalls로 호출 횟수/
              payload를 기록해 중복 호출 방지 테스트에도 쓴다.
            */
            save_skin_draft_version: function (params) {

              window.top.__savedDraftCalls =
                window.top.__savedDraftCalls || [];

              window.top.__savedDraftCalls.push(params);

              const newVersionId =
                "draft-a" + (state.tables.skin_versions.length + 1);

              state.tables.skin_versions.push({
                id: newVersionId,
                content: params.p_content
              });

              const skinRow =
                state.tables.skins.find(function (row) {
                  return row.id === params.p_skin_id;
                });

              if (skinRow) {
                skinRow.current_draft_version_id = newVersionId;
              }

              return { data: newVersionId, error: null };

            }
          }
        },

        /*
          Scenario P — Scenario A와 동일한 초기 draft를 갖지만
          save_skin_draft_version()이 항상 실패한다(Save 실패 경로
          전용, 13절 "실패 시 working state를 버리거나 DB draft를
          다시 불러와 덮어쓰지 않는다"를 검증하기 위함).
        */
        p: {
          userId: "user-p",
          tables: {
            skins: [
              { id: "skin-p1", user_id: "user-p", is_active: true, current_draft_version_id: "draft-p1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-p1",
                content: {
                  schemaVersion: 1,
                  html: '<div class="scenario-p-marker"><h1 data-imory-bind="site.title"></h1></div>',
                  css: ".scenario-p-marker { color: blue; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }
            ],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-p", nickname: "Scenario P", bio: null, slug: "scenario-p" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            save_skin_draft_version: function () {
              return { data: null, error: new Error("mock save failure") };
            }
          }
        },

        b: {
          userId: "user-b",
          tables: {
            skins: [],
            skin_versions: [],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-b", nickname: "Scenario B", bio: null, slug: "scenario-b" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            create_skin_with_initial_version: function (params) {
              const versionId = "draft-b1";
              const skinId = "skin-b1";
              state.tables.skin_versions.push({ id: versionId, content: params.p_content });
              state.tables.skins.push({
                id: skinId,
                user_id: "user-b",
                is_active: true,
                current_draft_version_id: versionId,
                current_published_version_id: null
              });
              window.top.__capturedMetadataB = params.p_content.metadata;
              return { data: skinId, error: null };
            }
          }
        },

        /*
          Scenario M — PHASE 1C-B multi-page SkinPackage(templates.home/
          category/post, legacy top-level html 없음). category/post
          template에는 저장 시점에 제거되어야 할 위험 마크업
          (script/onclick/onerror)이 일부러 섞여 있다 — Studio가
          이 템플릿들을 Code Editor로 전혀 건드리지 않아도
          save_skin_draft_version() 호출 직전에 normalizeSkinPackageForDraft()
          (skin/skin-package-normalize.js)가 항상 다시 sanitize하는지
          확인하는 용도. save_skin_draft_version mock은 scenario a와
          동일한 패턴(버전 push + draft pointer 이동 + __savedDraftCalls
          기록)을 쓴다.
        */
        m: {
          userId: "user-m",
          tables: {
            skins: [
              { id: "skin-m1", user_id: "user-m", is_active: true, current_draft_version_id: "draft-m1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-m1",
                content: {
                  schemaVersion: 1,
                  templates: {
                    home: {
                      html: '<div class="scenario-m-home"><h1 data-imory-bind="site.title"></h1></div>'
                    },
                    category: {
                      html: '<div class="scenario-m-category"><script>window.__scenarioMXss=true;<\/script><p onclick="alert(1)" data-imory-bind="category.name"></p></div>'
                    },
                    post: {
                      html: '<div class="scenario-m-post"><img src="x" onerror="window.__scenarioMXss=true"><p data-imory-bind="post.title"></p></div>'
                    }
                  },
                  css: ".scenario-m-home { color: red; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }
            ],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-m", nickname: "Scenario M", bio: null, slug: "scenario-m" }],
            site_settings: [],
            categories: [
              { id: "cat-m-log", user_id: "user-m", name: "LOG", type: "post", sort_order: 1 },
              { id: "cat-m-pic", user_id: "user-m", name: "PIC", type: "post", sort_order: 2 },
              { id: "cat-m-memo", user_id: "user-m", name: "MEMO", type: "post", sort_order: 3 }
            ],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            save_skin_draft_version: function (params) {

              window.top.__savedDraftCalls =
                window.top.__savedDraftCalls || [];

              window.top.__savedDraftCalls.push(params);

              const newVersionId =
                "draft-m" + (state.tables.skin_versions.length + 1);

              state.tables.skin_versions.push({
                id: newVersionId,
                content: params.p_content
              });

              const skinRow =
                state.tables.skins.find(function (row) {
                  return row.id === params.p_skin_id;
                });

              if (skinRow) {
                skinRow.current_draft_version_id = newVersionId;
              }

              return { data: newVersionId, error: null };

            }
          }
        },

        /*
          Scenario C — 실사용자 재현: HOME-only(top-level html) draft
          Skin + 실제 post형 category(LOG/PIC/MEMO, type "post")는
          있지만 templates.category는 없음. CATEGORY 버튼의
          enabled/disabled는 오직 post형 category 존재 여부로만
          결정되어야 한다(templates.category 유무와 무관, Studio
          chrome 재정리 2라운드 회귀 검증용) — 이 fixture에서
          CATEGORY는 enabled여야 하고, 클릭하면 "아직 CATEGORY
          템플릿이 없습니다" unsupported overlay가 떠야 한다.
        */
        c: {
          userId: "user-c",
          tables: {
            skins: [
              { id: "skin-c1", user_id: "user-c", is_active: true, current_draft_version_id: "draft-c1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-c1",
                content: {
                  schemaVersion: 1,
                  html: '<div class="scenario-c-marker"><h1 data-imory-bind="site.title"></h1></div>',
                  css: ".scenario-c-marker { color: green; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }

            이 항상 reject되게 만든다. fetchSkinBanners()
            (skin/skin-context.js)가 이 값을 await하므로, 이 파일
            안에서는 try/catch로 감싸지 않은 실제 promise rejection이
            preview-navigation.js의 renderBannerCategoryPreviewFor()
            까지 그대로 전파된다(mock에만 있는 분기 — 다른 시나리오는
            state.bannerQueryShouldFail이 없어 기존 동작 그대로).
          */
          if (table === "banners" && state.bannerQueryShouldFail) {

            state.__bannerQueryCallCount = (state.__bannerQueryCallCount || 0) + 1;

            const allowedSuccessCalls =
              state.bannerQuerySucceedCalls || 0;

            if (state.__bannerQueryCallCount > allowedSuccessCalls) {
              return {
                select: function () { return this; },
                eq: function () { return this; },
                in: function () { return this; },
                order: function () {
                  return Promise.reject(new Error("mock banners query failure"));
                }
              };
            }

          }

          return makeQuery((state.tables[table] || []).slice());
        },
        rpc: function (name, params) {
          const handler = state.rpcHandlers[name];
          if (!handler) {
            return Promise.resolve({ data: null, error: new Error("unmocked rpc: " + name) });
          }
          return Promise.resolve(handler(params));
        }
      };

    })();
  </script>
