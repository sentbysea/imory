<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIN STUDIO (lifecycle test scenario)</title>
<link rel="stylesheet" href="../core/design-tokens.css">
<link rel="stylesheet" href="../skin-questionnaire/questionnaire.css">
<link rel="stylesheet" href="./studio.css">
<link rel="stylesheet" href="./editor/code-editor.css">
</head>
<body>

  <!--
    studio/studio-lifecycle-test.html 전용 시나리오 문서 —
    studio/index.html과 동일한 body/script 로드 순서를 그대로
    쓰되, supabase-js/supabase-client.js만 in-memory mock으로
    바꾼다. ?scenario=a|b 쿼리로 어떤 fixture를 쓸지 결정한다.
    iframe.srcdoc이 아니라 실제 URL로 로드해야 window.location.origin이
    studio-preview.js/preview-bridge.js의 postMessage(targetOrigin)와
    동일하게 정상 동작한다(about:srcdoc은 origin이 "null" 문자열이라
    postMessage가 던진다).
  -->

  <main class="studio-shell" id="studioShell">
    <div class="studio-status" id="studioStatus">
      <p class="studio-status-text" id="studioStatusText">불러오는 중...</p>
      <dl class="studio-status-detail" id="studioStatusDetail" hidden></dl>
      <div id="studioQuestionnaireMount" hidden></div>
    </div>
  </main>

  <div class="studio-preview-shell" id="studioPreviewShell" hidden>

    <div class="studio-preview-stage" id="studioPreviewStage">
      <div class="studio-preview-frame-wrap" id="studioPreviewFrameWrap">
        <iframe id="studioPreviewFrame" src="./preview/preview-frame.html" title="Skin Preview"></iframe>
      </div>
    </div>

    <script>
      window.__previewFrameLoadCount = 0;
      document.getElementById("studioPreviewFrame").addEventListener("load", function () {
        window.__previewFrameLoadCount++;
      });
    </script>

    <div class="studio-top-dock-zone" id="studioTopDockZone">
      <div class="studio-top-dock" id="studioTopDock">
        <button type="button" class="studio-top-dock-back" id="studioBackButton">← back</button>
        <div class="studio-top-dock-groups">
          <div class="studio-page-toggle" id="studioPageToggle" role="group" aria-label="Preview 페이지">
            <button type="button" class="studio-page-toggle-option studio-page-toggle-option--active" data-page-type="home">Home</button>
            <span class="studio-page-toggle-divider" aria-hidden="true"></span>
            <button type="button" class="studio-page-toggle-option" id="studioPageToggleCategory" data-page-type="category" disabled>Category</button>
          </div>
          <span class="studio-top-dock-divider" aria-hidden="true"></span>
          <div class="studio-viewport-toggle" id="studioViewportToggle" role="group" aria-label="Preview 화면 크기">
            <button type="button" class="studio-viewport-toggle-option studio-viewport-toggle-option--active" data-viewport-mode="desktop">Desktop</button>
            <span class="studio-viewport-toggle-divider" aria-hidden="true"></span>
            <button type="button" class="studio-viewport-toggle-option" data-viewport-mode="mobile">Mobile</button>
          </div>
        </div>
        <div class="studio-top-dock-actions">
          <button type="button" class="studio-corner-button" id="studioSaveButton" disabled>Save</button>
          <button type="button" class="studio-corner-button" id="studioCodeButton" disabled>Code</button>
          <button type="button" class="studio-corner-button" id="studioSettingsButton" disabled>Settings</button>
        </div>
      </div>
      <button type="button" class="studio-top-dock-handle" id="studioTopDockHandle" aria-expanded="false" aria-controls="studioTopDock" aria-label="Studio 상단 컨트롤 펼치기"><span id="studioTopDockHandleIcon" aria-hidden="true">▾</span></button>
    </div>

    <div class="studio-ai-dock" id="studioAiDock">
      <div class="studio-ai-drawer" id="studioAiDrawer">
        <label class="studio-ai-drawer-label" for="studioAiDrawerInput">어떻게 바꾸고 싶나요?</label>
        <div class="studio-ai-drawer-row">
          <textarea id="studioAiDrawerInput" class="studio-ai-drawer-input" rows="1" placeholder="어떻게 바꾸고 싶나요?" tabindex="-1"></textarea>
          <button type="button" class="studio-ai-drawer-send" id="studioAiDrawerSend" disabled aria-label="전송">↑</button>
        </div>
      </div>
      <button type="button" class="studio-ai-handle" id="studioAiHandle" aria-expanded="false" aria-controls="studioAiDrawer">
        <span id="studioAiHandleIcon" aria-hidden="true">△</span>
      </button>
    </div>

    <div class="studio-preview-overlay" id="studioPreviewOverlay" hidden>
      <p class="studio-preview-overlay-text" id="studioPreviewOverlayText"></p>
    </div>

    <div class="studio-toast" id="studioToast" role="status" aria-live="polite" hidden></div>

  </div>

  <script>
    window.skinInitializerReady = new Promise(function (resolve) {
      window.__resolveSkinInitializerReady = resolve;
    });
  </script>

  <!-- =========================================================
       MOCK SUPABASE CLIENT (test only) — 실제 supabase-js/
       supabase-client.js 대신, ?scenario= 값에 따라 in-memory
       fixture를 돌려주는 최소 mock. 이 파일 이후에 로드되는
       production 코드(skin-context.js/studio-preview.js/
       studio-state.js/skin-initializer.js)는 전부 실제 파일이며
       이 mock을 구분하지 못한다(동일한 supabaseClient 계약만
       구현).
  ========================================================== -->

  <script>
    (function () {

      /*
        약간의 인위적 지연 — 없으면 mock Promise가 전부 같은
        microtask tick에 풀려서, loading overlay가 실제로 화면에
        떠 있는 구간을 통합 테스트가 관찰할 기회조차 없이 렌더가
        끝나 버린다(overlay가 "떠 있다가 사라지는지"를 검증하려면
        떠 있는 구간이 실제로 존재해야 한다).
      */
      const MOCK_LATENCY_MS = 150;

      function delayed(result) {
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(result); }, MOCK_LATENCY_MS);
        });
      }

      function makeQuery(rows) {
        const query = {
          select: function () { return query; },
          eq: function (col, val) { rows = rows.filter(function (r) { return r[col] === val; }); return query; },
          in: function (col, vals) { rows = rows.filter(function (r) { return vals.indexOf(r[col]) !== -1; }); return query; },
          order: function (col, opts) {
            const asc = !opts || opts.ascending !== false;
            rows = rows.slice().sort(function (a, b) {
              if (a[col] === b[col]) return 0;
              return (a[col] > b[col] ? 1 : -1) * (asc ? 1 : -1);
            });
            return query;
          },
          limit: function (n) { rows = rows.slice(0, n); return query; },
          maybeSingle: function () { return delayed({ data: rows[0] || null, error: null }); },
          single: function () {
            return delayed(
              rows[0]
                ? { data: rows[0], error: null }
                : { data: null, error: new Error("not found") }
            );
          },
          then: function (resolve, reject) {
            return delayed({ data: rows, error: null }).then(resolve, reject);
          }
        };
        return query;
      }

      const scenario = new URLSearchParams(window.location.search).get("scenario");

      const FIXTURES = {

        a: {
          userId: "user-a",
          tables: {
            skins: [
              { id: "skin-a1", user_id: "user-a", is_active: true, current_draft_version_id: "draft-a1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-a1",
                content: {
                  schemaVersion: 1,
                  html: '<div class="scenario-a-marker"><h1 data-imory-bind="site.title"></h1><p data-imory-bind="profile.nickname"></p></div>',
                  css: ".scenario-a-marker { color: red; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }
            ],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-a", nickname: "Scenario A", bio: "hello", slug: "scenario-a" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            /*
              Slice 4 — save_skin_draft_version() mock. 새 skin_versions
              row를 fixture의 in-memory 테이블에 실제로 추가하고
              skins.current_draft_version_id도 옮겨서, 테스트가
              "버전 수 +1 / draft pointer 이동"을 실제 데이터로 확인할
              수 있게 한다. window.top.__savedDraftCalls로 호출 횟수/
              payload를 기록해 중복 호출 방지 테스트에도 쓴다.
            */
            save_skin_draft_version: function (params) {

              window.top.__savedDraftCalls =
                window.top.__savedDraftCalls || [];

              window.top.__savedDraftCalls.push(params);

              const newVersionId =
                "draft-a" + (state.tables.skin_versions.length + 1);

              state.tables.skin_versions.push({
                id: newVersionId,
                content: params.p_content
              });

              const skinRow =
                state.tables.skins.find(function (row) {
                  return row.id === params.p_skin_id;
                });

              if (skinRow) {
                skinRow.current_draft_version_id = newVersionId;
              }

              return { data: newVersionId, error: null };

            }
          }
        },

        /*
          Scenario P — Scenario A와 동일한 초기 draft를 갖지만
          save_skin_draft_version()이 항상 실패한다(Save 실패 경로
          전용, 13절 "실패 시 working state를 버리거나 DB draft를
          다시 불러와 덮어쓰지 않는다"를 검증하기 위함).
        */
        p: {
          userId: "user-p",
          tables: {
            skins: [
              { id: "skin-p1", user_id: "user-p", is_active: true, current_draft_version_id: "draft-p1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-p1",
                content: {
                  schemaVersion: 1,
                  html: '<div class="scenario-p-marker"><h1 data-imory-bind="site.title"></h1></div>',
                  css: ".scenario-p-marker { color: blue; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }
            ],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-p", nickname: "Scenario P", bio: null, slug: "scenario-p" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            save_skin_draft_version: function () {
              return { data: null, error: new Error("mock save failure") };
            }
          }
        },

        b: {
          userId: "user-b",
          tables: {
            skins: [],
            skin_versions: [],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-b", nickname: "Scenario B", bio: null, slug: "scenario-b" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            create_skin_with_initial_version: function (params) {
              const versionId = "draft-b1";
              const skinId = "skin-b1";
              state.tables.skin_versions.push({ id: versionId, content: params.p_content });
              state.tables.skins.push({
                id: skinId,
                user_id: "user-b",
                is_active: true,
                current_draft_version_id: versionId,
                current_published_version_id: null
              });
              window.top.__capturedMetadataB = params.p_content.metadata;
              return { data: skinId, error: null };
            }
          }
        },

        /*
          Scenario M — PHASE 1C-B multi-page SkinPackage(templates.home/
          category/post, legacy top-level html 없음). category/post
          template에는 저장 시점에 제거되어야 할 위험 마크업
          (script/onclick/onerror)이 일부러 섞여 있다 — Studio가
          이 템플릿들을 Code Editor로 전혀 건드리지 않아도
          save_skin_draft_version() 호출 직전에 normalizeSkinPackageForDraft()
          (skin/skin-package-normalize.js)가 항상 다시 sanitize하는지
          확인하는 용도. save_skin_draft_version mock은 scenario a와
          동일한 패턴(버전 push + draft pointer 이동 + __savedDraftCalls
          기록)을 쓴다.
        */
        m: {
          userId: "user-m",
          tables: {
            skins: [
              { id: "skin-m1", user_id: "user-m", is_active: true, current_draft_version_id: "draft-m1", current_published_version_id: null }
            ],
            skin_versions: [
              {
                id: "draft-m1",
                content: {
                  schemaVersion: 1,
                  templates: {
                    home: {
                      html: '<div class="scenario-m-home"><h1 data-imory-bind="site.title"></h1></div>'
                    },
                    category: {
                      html: '<div class="scenario-m-category"><script>window.__scenarioMXss=true;<\/script><p onclick="alert(1)" data-imory-bind="category.name"></p></div>'
                    },
                    post: {
                      html: '<div class="scenario-m-post"><img src="x" onerror="window.__scenarioMXss=true"><p data-imory-bind="post.title"></p></div>'
                    }
                  },
                  css: ".scenario-m-home { color: red; }",
                  imageSlots: [],
                  regions: [],
                  metadata: { generatedBy: "deterministic-v1" }
                }
              }
            ],
            skin_image_slot_values: [],
            profiles: [{ user_id: "user-m", nickname: "Scenario M", bio: null, slug: "scenario-m" }],
            site_settings: [],
            categories: [],
            posts: [],
            banners: []
          },
          rpcHandlers: {
            save_skin_draft_version: function (params) {

              window.top.__savedDraftCalls =
                window.top.__savedDraftCalls || [];

              window.top.__savedDraftCalls.push(params);

              const newVersionId =
                "draft-m" + (state.tables.skin_versions.length + 1);

              state.tables.skin_versions.push({
                id: newVersionId,
                content: params.p_content
              });

              const skinRow =
                state.tables.skins.find(function (row) {
                  return row.id === params.p_skin_id;
                });

              if (skinRow) {
                skinRow.current_draft_version_id = newVersionId;
              }

              return { data: newVersionId, error: null };

            }
          }
        }

      };

      const state = FIXTURES[scenario] || FIXTURES.a;

      window.supabaseClient = {
        auth: {
          getUser: function () {
            return Promise.resolve({ data: { user: { id: state.userId } }, error: null });
          }
        },
        from: function (table) {
          return makeQuery((state.tables[table] || []).slice());
        },
        rpc: function (name, params) {
          const handler = state.rpcHandlers[name];
          if (!handler) {
            return Promise.resolve({ data: null, error: new Error("unmocked rpc: " + name) });
          }
          return Promise.resolve(handler(params));
        }
      };

    })();
  </script>

  <script src="../skin/skin-sanitize.js"></script>
  <script src="../skin/skin-package-normalize.js"></script>
  <script src="../skin/skin-generator.js"></script>
  <script type="module" src="../skin/skin-initializer.js"></script>
  <script src="../skin-questionnaire/questionnaire.js"></script>
  <script src="../core/lib/site-path.js"></script>
  <script src="../skin/skin-image-slots.js"></script>
  <script src="../skin/skin-context.js"></script>
  <script src="../skin/skin-template.js"></script>
  <script src="./studio-write.js"></script>
  <script src="./editor/code-editor.js"></script>
  <script src="./studio-preview.js"></script>
  <script src="./studio-state.js"></script>

  <script>
    window.__testHooks = {
      sendFromRealParent: function (payload) {
        document.getElementById("studioPreviewFrame").contentWindow.postMessage(payload, window.location.origin);
      }
    };
  </script>

</body>
</html>
