<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SKIN STUDIO</title>

  <!--
    PRETENDARD — admin/CUSTOMIZE와 동일한 공통 UI 폰트. 이 문서는
    admin iframe 안에서 독립된 browsing context로 로드되므로 admin의
    <link>를 상속받지 않는다 — 따로 불러와야 함(customize/editor/
    index.html과 동일 패턴).
  -->

  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <!-- =========================================================
       배포 버전 원천 — 이 파일만 ?t= 로 받는다

       Studio는 admin이 iframe으로 계속 재사용하는 문서라 탭을
       새로고침하지 않는 한 브라우저가 CSS/JS를 오래 들고 있을 수
       있다. _headers에 no-cache를 지정해 뒀지만 CDN이 CSS/JS
       응답에서는 그 값을 max-age=14400으로 덮어쓴다(실측) —
       실제로 캐시를 무효화하는 것은 아래 ?v= 뿐이다.
       배경: core/lib/build-version.js 상단 주석.
  ========================================================== -->

  <script>

    document.write(
      '<script src="../core/lib/build-version.js?t=' +
      Date.now() +
      '"><' + '/script>'
    );

  </script>


  <!-- =========================================================
       Studio가 쓰는 CSS — 전부 ?v=APP_BUILD_VERSION

       순서는 예전 <link> 순서와 정확히 동일하다(design-tokens 먼저,
       images-panel 마지막). Pretendard(CDN)는 URL 자체가 버전이라
       그대로 둔다.
  ========================================================== -->

  <script>

    loadVersionedStyles(
      [
        "../core/design-tokens.css",
        "../skin-questionnaire/questionnaire.css",
        "./studio.css",
        "./editor/code-editor.css",
        "./editor/import-editor.css",
        "./editor/confirm-dialog.css",
        "./images/images-panel.css",

        /* BOTTOM-DOCK-1 — dock 설정 패널(Studio 자신의 UI) */
        "./dock/dock-panel.css",

        /* HOME 단 구성 패널(IMORY_SIDES_DESIGN.md §6) */
        "./sides/sides-panel.css",

        /* Dock 패널의 아이콘 고르기 — 공개 화면이 그리는 것과 같은 그림 */
        "../skin/skin-dock-icons.css",
        "./inspector/studio-inspector.css",

        /* STUDIO-SHELL-1 — 상단 세 그룹 · 왼쪽 패널. Images/Dock/
           Inspector 의 내용을 패널 안에 앉히는 규칙이 있어서 그
           셋보다 뒤다(IMORY_STUDIO_SHELL_DESIGN.md). */
        "./studio-shell.css"
      ]
    );

  </script>

</head>


<body>

  <!-- =========================================================
       SKIN STUDIO SHELL — "skin 없음" / 에러 상태 (PHASE 1B Slice 1/2)

       studio-state.js가 판별한 진입 상태 중 "first-time"(Questionnaire)
       과 "error"만 이 중앙 정렬 박스를 쓴다(AI_SKIN_PHASE1B_DESIGN.md
       5절). "existing"(active skin 있음)은 이 블록을 hidden 처리하고
       아래 SKIN STUDIO PREVIEW SHELL(Slice 3)을 대신 띄운다 — Save/
       Publish/Code Editor 실제 기능은 아직 없다(15절, Slice 4 몫).
  ========================================================== -->

  <main
    class="studio-shell"
    id="studioShell"
  >

    <div
      class="studio-status"
      id="studioStatus"
    >

      <p
        class="studio-status-text"
        id="studioStatusText"
      >
        불러오는 중...
      </p>

      <dl
        class="studio-status-detail"
        id="studioStatusDetail"
        hidden
      ></dl>

      <div
        id="studioQuestionnaireMount"
        hidden
      ></div>

    </div>

  </main>


  <!-- =========================================================
       SKIN STUDIO PREVIEW SHELL (Slice 3, chrome refined in the
       "Studio UI 정리" round)

       "skin 있음" 사용자 전용 — 화면 전체가 Preview인 제작 UI
       (AI_SKIN_PHASE1B_DESIGN.md 11절). studio-state.js가 "existing"
       분기에서 studio-preview.js의 mountStudioPreview()를 호출할
       때만 보인다. iframe은 아래 #studioPreviewFrame 단 하나뿐 —
       Desktop/Mobile 전환은 이 iframe을 재생성/재로드하지 않고
       #studioPreviewStage의 CSS 클래스만 바꿔 폭을 조절한다(11-5절
       "iframe 1개 + 폭 전환만으로 @media가 정확히 동작하는 이유").

       Chrome 정리 라운드에서 모든 컨트롤(top dock/viewport
       toggle/AI drawer)은 Preview 레이아웃 공간을 전혀 차지하지
       않는 절대배치 overlay로만 존재한다 — #studioPreviewStage와
       그 안의 iframe은 이 shell 전체를 그대로 차지하고, 위 컨트롤은
       전부 그 위에 겹쳐 그려진다(studio.css 참고).
  ========================================================== -->

  <div
    class="studio-preview-shell"
    id="studioPreviewShell"
    hidden
  >

    <div
      class="studio-preview-stage"
      id="studioPreviewStage"
    >

      <!--
        wrap을 따로 두는 이유: Mobile 모드에서 iframe 자체의 CSS
        크기(레이아웃 뷰포트)는 항상 390x844로 유지하되, Studio
        화면이 좁을 땐 이 wrap에만 CSS transform: scale()을 걸어
        시각적으로만 축소한다(4절) — iframe 크기를 직접 줄이면
        내부 Skin CSS의 @media 기준(390px)이 실제와 달라진다.
      -->

      <div
        class="studio-preview-frame-wrap"
        id="studioPreviewFrameWrap"
      >

        <iframe
          id="studioPreviewFrame"
          src="./preview/preview-frame.html"
          title="Skin Preview"
        ></iframe>

      </div>

    </div>


    <!-- =====================================================
         PREVIEW BACK — floating control directly on the Preview
         surface (PHASE 1C-H). 더 이상 Top Dock 안에 있지 않다 —
         previewHistory가 HOME 하나뿐일 때는 숨고(hidden), CATEGORY/
         POST로 이동하면 나타난다(studio/preview/preview-navigation.js
         의 updatePreviewBackButtonVisibility()). Undo/browser-back/
         Admin Back(#studioBackButton, Top Dock 안)과 전혀 다른
         컨트롤이다 — 오직 Preview 내부 탐색 기록(previewHistory)을
         한 단계 pop한다. #studioPreviewStage/iframe의 형제로 두어
         Mobile 모드의 --studio-mobile-scale transform(#studioPreview
         FrameWrap에만 걸림) 영향을 받지 않는다 — hit-area가 Desktop/
         Mobile 어느 쪽에서도 항상 동일한 실제 픽셀 크기를 유지한다.
    ====================================================== -->

    <button
      type="button"
      class="studio-preview-back-floating"
      id="studioPreviewBackButton"
      hidden
      aria-label="이전 화면"
      title="이전 화면"
    >←</button>


    <!-- =====================================================
         LEFT PANEL — Select · Images · Dock 이 함께 쓰는 자리
         (STUDIO-SHELL-1, IMORY_STUDIO_SHELL_DESIGN.md)

         예전에는 셋이 서로 다른 모양이었다 — Select 는 Preview 위에
         떠서 요소를 가리는 팝오버, Images 와 Dock 은 화면 전체를
         덮는 modal. 이제 셋 다 이 패널 하나의 **내용**이다. 패널이
         열려 있는 동안 #studioPreviewStage 의 left 가 패널 폭만큼
         밀리므로 Preview 는 가려지지 않고 폭이 다시 계산된다
         (오른쪽 AI 패널과 같은 방식, studio-shell.css).

         여닫기와 어느 내용을 보여 줄지는 studio/studio-shell.js 가
         정한다. 각 section 안의 실제 DOM 은 그 기능의 파일이 처음
         열 때 만들어 넣는다(Inspector 팝오버 · images-panel.js ·
         dock-panel.js) — 이 문서와 studio-lifecycle-scenario.html
         두 곳에 같은 마크업을 두지 않기 위해서다.

         좁은 화면(720px 이하)에서는 화면 아래에서 올라오는 시트가
         된다 — 위쪽 Preview 는 그대로 보여서 Select 로 요소를 계속
         고를 수 있다. 시트는 세 단계다(MOBILE-SHEET-1 · 접힘 ·
         내용 보기 · 전체 화면, studio/studio-sheet.js). 손잡이 ·
         요소 이름 · 단계 버튼 · Quick Bar 자리는 그 폭에서만 보인다.
    ====================================================== -->

    <aside
      class="studio-left-panel"
      id="studioLeftPanel"
      data-mode="select"
      aria-labelledby="studioLeftPanelTitle"
    >

      <div
        class="studio-left-panel-header"
        id="studioLeftPanelHeader"
      >

        <div
          class="studio-left-panel-handle"
          id="studioLeftPanelHandle"
          aria-hidden="true"
        ><span class="studio-left-panel-handle-bar"></span></div>

        <div class="studio-left-panel-heading">

          <h2
            class="studio-left-panel-title"
            id="studioLeftPanelTitle"
          >
            SELECT
          </h2>

          <p
            class="studio-left-panel-name"
            id="studioLeftPanelName"
          ></p>

        </div>

        <div
          class="studio-inspector-quickbar-slot studio-left-panel-quick"
          id="studioInspectorQuickBarSlot"
        ></div>

        <button
          type="button"
          class="studio-left-panel-step"
          id="studioLeftPanelSheetDown"
          aria-controls="studioLeftPanelBody"
          aria-expanded="true"
          hidden
        >▾</button>

        <button
          type="button"
          class="studio-left-panel-step"
          id="studioLeftPanelSheetUp"
          aria-controls="studioLeftPanelBody"
          aria-expanded="false"
          hidden
        >▴</button>

        <button
          type="button"
          class="studio-left-panel-collapse"
          id="studioLeftPanelCollapse"
          aria-expanded="false"
          aria-controls="studioLeftPanel"
          aria-label="편집 패널 접기"
        >‹</button>

        <p
          class="studio-left-panel-status"
          id="studioLeftPanelStatus"
          aria-live="polite"
        ></p>

      </div>

      <div
        class="studio-left-panel-body"
        id="studioLeftPanelBody"
      >

        <section
          class="studio-left-panel-section"
          id="studioLeftPanelSelect"
          data-left-panel-mode="select"
        >

          <p
            class="studio-left-panel-empty"
            id="studioLeftPanelSelectEmpty"
          >
            Preview에서 고칠 요소를 누르세요.
          </p>

        </section>

        <section
          class="studio-left-panel-section"
          id="studioLeftPanelImages"
          data-left-panel-mode="images"
          hidden
        ></section>

        <section
          class="studio-left-panel-section"
          id="studioLeftPanelDock"
          data-left-panel-mode="dock"
          hidden
        ></section>

        <!-- HOME 단 구성(1단 · 2단 · 3단) — IMORY_SIDES_DESIGN.md §6 -->
        <section
          class="studio-left-panel-section"
          id="studioLeftPanelLayout"
          data-left-panel-mode="layout"
          hidden
        ></section>

      </div>

    </aside>


    <!-- =====================================================
         TOP DOCK — 세 그룹 (STUDIO-SHELL-1)

           왼쪽   ← back · Select · Images · Dock   (왼쪽 패널을 여는 셋)
           가운데 현재 페이지 · Desktop|Mobile · Undo/Redo
           오른쪽 Code · Import|Export · Save · Publish · AI Assistant

         Publish 만 primary 다. Import 와 Export 는 한 덩어리로 붙인다.
         좁은 화면에서는 Code · Import · Export 가 ··· 메뉴로 들어간다
         — 메뉴는 **같은 버튼**을 드롭다운으로 보여 줄 뿐이라 id 와
         클릭 핸들러가 두 벌이 되지 않는다(studio-shell.css ·
         studio/studio-shell.js).

         hover/focus로는 절대 열리거나 닫히지 않는다 —
         #studioTopDockHandle을 클릭할 때만 studio-preview.js가
         #studioTopDockZone에 is-open 클래스를 토글한다(닫힘 ↔
         펼침). 기본 상태는 펼침이고, 어디에도 저장하지 않는다
         (PHASE AI-5A.1). AI 패널의 열림 상태와는 무관하다.
    ====================================================== -->

    <div
      class="studio-top-dock-zone is-open"
      id="studioTopDockZone"
    >

      <div
        class="studio-top-dock"
        id="studioTopDock"
      >

        <!-- =================================================
             LEAD — 나가기 + 왼쪽 패널을 여는 넷(Select · Images · Dock · Layout)

             Select 의 aria-pressed 는 "Inspector 모드가 켜져 있는가"
             다(studio/inspector/studio-inspector.js). 세 버튼의
             aria-expanded 는 "왼쪽 패널이 지금 그 내용을 보여 주는가"
             다(studio/studio-shell.js). Images/Dock 으로 옮겨 가도
             Select 모드는 꺼지지 않는다 — 그래야 돌아왔을 때 고른
             요소가 그대로 남는다.
        ================================================== -->

        <div class="studio-top-dock-lead">

          <button
            type="button"
            class="studio-top-dock-back"
            id="studioBackButton"
            aria-label="Studio 나가기"
          >←<span class="studio-label-wide"> back</span></button>

          <div
            class="studio-top-dock-modes"
            role="group"
            aria-label="편집 패널"
          >

            <button
              type="button"
              class="studio-corner-button studio-mode-button"
              id="studioInspectorButton"
              aria-pressed="false"
              aria-expanded="false"
              aria-controls="studioLeftPanel"
              title="Preview에서 요소를 직접 고릅니다"
              disabled
            >
              Select
            </button>

            <!--
                 Skin Image Library — 지금 Skin이 선언한 imageSlots에
                 내 이미지를 연결/교체/비운다. working draft가 있을 때만
                 활성화된다(studio-preview.js updateStudioImagesButtonState).
            -->
            <button
              type="button"
              class="studio-corner-button studio-mode-button"
              id="studioImagesButton"
              aria-expanded="false"
              aria-controls="studioLeftPanel"
              disabled
            >
              Images
            </button>

            <!--
                 BOTTOM-DOCK-1 — 화면 아래 dock의 설정(IMORY_BOTTOM_DOCK_DESIGN.md
                 §9). 생김새는 templates.dock과 스킨 CSS의 몫이다.
            -->
            <button
              type="button"
              class="studio-corner-button studio-mode-button"
              id="studioDockButton"
              aria-expanded="false"
              aria-controls="studioLeftPanel"
              title="화면 아래 dock의 항목과 동작을 고칩니다"
              disabled
            >
              Dock
            </button>

            <!--
                 HOME 단 구성(IMORY_SIDES_DESIGN.md §6) — 왼쪽 패널에
                 1단 · 2단 · 3단을 연다. 좁은 화면에서는 첫 줄에 자리가
                 없어 둘째 줄(↶ ↷ 다음)로 간다(studio-shell.css).
            -->
            <button
              type="button"
              class="studio-corner-button studio-mode-button"
              id="studioLayoutButton"
              aria-expanded="false"
              aria-controls="studioLeftPanel"
              title="HOME 을 1단 · 2단 · 3단 중 무엇으로 보여 줄지 고릅니다"
              disabled
            >
              Layout
            </button>

          </div>

        </div>


        <!-- =================================================
             GROUPS — 지금 보고 있는 것 + 되돌리기

             현재 페이지는 **표시**다. 페이지는 Preview 안의 링크를
             눌러 옮긴다(preview-bridge.js) — 여기서 고르지 않는다.
             값은 preview-navigation.js 가 currentPreviewPageType 을
             바꿀 때마다 studio-shell.js 가 다시 적는다.
        ================================================== -->

        <div class="studio-top-dock-groups">

          <span
            class="studio-page-indicator"
            id="studioPageIndicator"
            title="지금 Preview가 보여 주는 페이지"
          >HOME</span>

          <div
            class="studio-viewport-toggle"
            id="studioViewportToggle"
            role="group"
            aria-label="Preview 화면 크기"
          >

            <button
              type="button"
              class="studio-viewport-toggle-option studio-viewport-toggle-option--active"
              data-viewport-mode="desktop"
            >
              Desktop
            </button>

            <span
              class="studio-viewport-toggle-divider"
              aria-hidden="true"
            ></span>

            <button
              type="button"
              class="studio-viewport-toggle-option"
              data-viewport-mode="mobile"
            >
              Mobile
            </button>

          </div>

          <!--
               working draft 변경 기록(studio/studio-history.js).
               Direct Edit · Code · Import · AI · Images · Dock 이 바꾼
               것을 한 칸씩 되돌리고 다시 적용한다.
          -->
          <div
            class="studio-history-buttons"
            role="group"
            aria-label="변경 기록"
          >

            <button
              type="button"
              class="studio-icon-button"
              id="studioUndoButton"
              aria-label="실행 취소"
              aria-keyshortcuts="Control+Z Meta+Z"
              title="실행 취소 · Ctrl/⌘+Z"
              disabled
            >↶</button>

            <button
              type="button"
              class="studio-icon-button"
              id="studioRedoButton"
              aria-label="다시 실행"
              aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"
              title="다시 실행 · Ctrl/⌘+Shift+Z"
              disabled
            >↷</button>

          </div>

        </div>


        <!-- =================================================
             ACTIONS — 파일 · 저장 · 발행 · AI

             #studioTopDockFiles 는 데스크톱에서는 줄 안의 버튼
             묶음이고, 좁은 화면에서는 ··· 버튼이 여는 드롭다운이다.
        ================================================== -->

        <div class="studio-top-dock-actions">

          <div
            class="studio-top-dock-files"
            id="studioTopDockFiles"
          >

            <button
              type="button"
              class="studio-corner-button"
              id="studioCodeButton"
              disabled
            >
              Code
            </button>

            <!--
                 Import 와 Export 는 한 쌍이다 — 같은 SkinPackage .json
                 파일을 들이고 내보낸다(Skin Studio 파일 UX). 둘 다
                 working draft 유무로 활성화된다
                 (studio-preview.js updateStudioImportButtonState).
            -->
            <div
              class="studio-button-pair"
              role="group"
              aria-label="SkinPackage 파일"
            >

              <button
                type="button"
                class="studio-corner-button"
                id="studioImportButton"
                disabled
              >
                Import
              </button>

              <button
                type="button"
                class="studio-corner-button"
                id="studioExportButton"
                title="현재 SkinPackage를 .json 파일로 내려받습니다"
                disabled
              >
                Export
              </button>

            </div>

          </div>

          <button
            type="button"
            class="studio-corner-button studio-top-dock-more"
            id="studioMoreButton"
            aria-expanded="false"
            aria-controls="studioTopDockFiles"
            aria-haspopup="true"
            aria-label="더 보기 (Code · Import · Export)"
          >···</button>

          <button
            type="button"
            class="studio-corner-button"
            id="studioSaveButton"
            disabled
          >
            Save
          </button>

          <button
            type="button"
            class="studio-corner-button studio-corner-button--primary"
            id="studioPublishButton"
            disabled
          >
            Publish
          </button>

          <!--
               PHASE AI-5A.1 — AI 패널의 여는 곳. aria-expanded는
               studio/ai/studio-ai-panel-layout.js가 패널 헤더의 접기
               버튼과 같은 state 하나로 동기화한다.
          -->
          <span
            class="studio-top-dock-divider"
            aria-hidden="true"
          ></span>

          <button
            type="button"
            class="studio-corner-button studio-ai-toggle-button"
            id="studioAiToggleButton"
            aria-expanded="false"
            aria-controls="studioAiDrawer"
            aria-label="AI Assistant"
          >AI<span class="studio-label-wide"> Assistant</span></button>

       showStudioToast/getStudioAiWorkingState/applyAiSkinPackage와
       skin-package-import.js의 validateSkinPackageImport, 그리고
       supabaseClient(access token 조회)를 쓴다 — 넷 다 위에서 이미
       로드됐다. studio-state.js(실제 mount 시작)보다는 먼저 둔다:
       패널이 평가 시점에 Send 버튼 상태를 한 번 계산하므로, 그때
       DOM과 bridge가 모두 준비돼 있는 편이 단순하다.

       PHASE AI-5A — ai/studio-ai-panel-layout.js(우측 사이드바
       여닫기 / 폭 조절 / Preview 클릭 시 접기)를 그 앞에 둔다.
       studio-ai-panel.js가 평가 시점에 textarea 높이를 한 번
       계산하는데, 그전에 패널의 열림 상태(#studioPreviewShell의
       .has-ai-panel)가 정해져 있는 편이 단순하기 때문이다. 두
       파일은 window 이벤트("studio-ai-panel-toggle") 하나로만
       연결된다 — 서로의 내부 변수를 읽지 않는다.

       PHASE AI-6B — ai/studio-ai-selection.js(선택 요소 chip /
       selectionContext / 요청용 SkinPackage)를 그 사이에 둔다.
       이 파일이 실제로 쓰는 것(Inspector의 selection 조회,
       stampInspectorEditIds)은 전부 **아래에서** 로드되는
       inspector/* 이지만, 호출은 전부 사용자가 무언가를 누른
       뒤에만 일어나므로 평가 순서에 걸리지 않는다. 반대로
       studio-ai-panel.js는 전송 시점에 이 파일의 함수를 부르므로
       읽는 순서를 그쪽 앞으로 맞춰 둔다.
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "./ai/studio-ai-panel-layout.js",
        "./ai/studio-ai-selection.js",

        /* DIRECT-UX-1 — 고른 요소에 맞는 AI 빠른 제안(입력칸에 넣기만) */
        "./ai/studio-ai-suggestions.js",
        "./ai/studio-ai-panel.js"
      ]
    );

  </script>
  <!-- =========================================================
       ELEMENT INSPECTOR + DIRECT EDIT (PHASE AI-6A)

       inspector/studio-inspector-model.js는 의존이 전혀 없는 순수
       함수 모음이고(Preview iframe도 같은 파일을 따로 로드한다 —
       studio/preview/preview-frame.html 참고), 나머지 inspector/*
       는 studio-preview.js(applyStudioDirectEdit/
       postInspectorModeToFrame/showStudioToast/resolveCodeEditorSource)
       와 preview-navigation.js(renderCurrentPreviewEntry), 그리고
       skin-sanitize.js(sanitizeSkinHTML/isSafeSkinUrl)에 의존한다 —
       셋 다 위에서 이미 로드됐다. AI 패널보다 뒤에 두는 이유는
       "AI 수정" 버튼이 window.setStudioAiPanelOpen을 쓰기
       때문이다(실제 호출은 클릭 시점이라 순서가 필수는 아니지만,
       읽는 순서와 의존 방향을 맞춰 둔다).

       Inspector 파일 분리 라운드 — 한 파일이던 studio-inspector.js를
       책임별로 여섯 + 하나로 나눴다. **아래 순서를 지켜야 한다**:

         state    공유 상태(const/let). 뒤 파일들이 로드 시점에 읽으므로
                  반드시 맨 앞이다(const/let은 TDZ가 있다).
         overlay  overlay DOM·좌표·테두리/핸들/팝오버 위치.
                  로드 시점에 studioInspectorStage(state)를 읽어
                  ResizeObserver를 단다.
         edit     확정 경로(patch/스타일/링크/Undo)
         text     텍스트 임시 편집·적용·취소
         image-size 이미지 너비 컨트롤·모서리 드래그.
                  로드 시점에 document pointer 리스너를 단다.
         crop     이미지 자르기(프레임 래퍼·비율·확대·구도 드래그).
                  로드 시점에 document pointer 리스너를 단다.
                  순수 계산은 crop-model이 갖고, 그 파일은 Preview
                  iframe도 따로 로드한다(preview-frame.html).
         controls 직접 수정 폼 UI·팝오버 그리기
         (main)   진입·lifecycle·선택 상태 전이·전역 창구.
                  로드 시점에 토글 버튼/keydown 리스너를 단다.

       edit/text/image-size/controls 사이의 상대 순서는 로드 시점에
       서로를 읽지 않아 강제되지 않지만(함수 선언은 전역 객체
       속성이라 호출 시점에만 있으면 된다), 읽는 순서를 의존 방향과
       맞추기 위해 이대로 둔다. studio/studio-lifecycle-scenario.html
       도 같은 순서다.
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        /* SANDBOX-6A — hit-test 규칙은 세 realm 이 같은 파일을
           읽는다(Studio · native Preview · sandbox 프레임).
           model 보다 **먼저**여야 한다: model 의 kind 판정이 이
           파일의 INSPECTOR_TEXTUAL_TAGS 를 읽고, const 는 TDZ 가
           있다. skin/skin-inspect-target.js 머리말 참고. */
        "../skin/skin-inspect-target.js",
        "./inspector/studio-inspector-model.js",
        /* COMMON-SELECT-BOX-1 — 크기 · 자리 · 여백 · 정렬 · 테두리의
           값 규칙. model.js 가 모르는 컨트롤 이름을 이 파일로 넘긴다. */
        "./inspector/studio-inspector-box-model.js",
        "./inspector/studio-inspector-crop-model.js",
        "./inspector/studio-inspector-state.js",
        "./inspector/studio-inspector-overlay.js",
        "./inspector/studio-inspector-edit.js",
        "./inspector/studio-inspector-text.js",
        "./inspector/studio-inspector-image-size.js",
        "./inspector/studio-inspector-crop.js",

        /* 배치 primitive 직접 편집(LAYOUT-1). edit.js 의
           applyStudioInspectorPatch 와 overlay 의 좌표 변환을
           호출 시점에 쓰므로 그 뒤이고, controls.js 가 이 파일의
           renderStudioInspectorLayoutBlock 을 부르므로 그 앞이다. */
        "./inspector/studio-inspector-layout.js",

        /* 전환 primitive 직접 편집(TRANSITION-1). 배치와 같은 자리,
           같은 이유다 — controls.js 가 이 파일의
           renderStudioInspectorTransitionBlock 을 부른다. */
        "./inspector/studio-inspector-transition.js",

        /* DIRECT-UX-1 — 사람이 읽는 요소 이름(names)과 Quick Bar ·
           겹친 요소 메뉴 · 숨기기 · 앞으로/뒤로(quickbar), 일반 UI 의
           항목 목록과 새 행들(fields). controls.js
           와 overlay 가 **호출 시점에** 두 파일의 함수를 쓴다.
           quickbar 는 로드 시점에 state 의 studioInspectorShell 과
           matchMedia 를 읽으므로 state 뒤다. */
        "./inspector/studio-inspector-names.js",
        "./inspector/studio-inspector-quickbar.js",
        "./inspector/studio-inspector-fields.js",
        /* COMMON-SELECT-BOX-1 — 크기 · 상자 위치 · 내용 정렬 · 여백 ·
           테두리 폼과 그 손잡이 드래그. controls.js 가 호출 시점에
           이 파일의 render… 함수를 쓴다. */
        "./inspector/studio-inspector-box.js",
        "./inspector/studio-inspector-controls.js",
        "./inspector/studio-inspector.js",

        /* STUDIO-SHELL-1 — Undo/Redo 기록과 셸(왼쪽 패널 · ··· 메뉴 ·
           현재 페이지 표시). 둘 다 studio-preview.js 의 상태와
           Inspector/Images/Dock 의 창구를 **호출 시점에** 쓰므로 그
           뒤이고, mount 를 시작하는 studio-state.js 보다는 앞이다 —
           첫 화면이 그려질 때 이미 버튼이 연결돼 있어야 한다. */
        "./studio-history.js",
        "./studio-shell.js",

        /* MOBILE-SHEET-1 — 좁은 화면의 세 단계 시트(접힘 · 내용 ·

           손잡이 · Preview 가림 방지 · 키보드를 맡는다. 셸의
           studioShellIsNarrow 를 로드 시점에 쓰므로 그 뒤다. */
        "./studio-sheet.js",
        "./studio-sheet-drag.js",

        /* DIRECT-UX-1 — Save 옆 상태 한 줄 · 처음 쓰는 사람 안내.
           둘 다 studio-preview.js 의 상태와 Top Dock 버튼을 읽으므로
           그 뒤, mount(studio-state.js) 앞이다. */
        "./studio-save-status.js",
        "./studio-coach.js",

        /* =====================================================
           HOME-CANVAS-VENDOR-1 — Moveable · Selecto 지연 로더.

           ★ 이 줄은 **로더 한 파일**(3KB)을 읽을 뿐이고, UMD 두
             개(약 300KB)는 받지 않는다. 그 둘은
             ensureHomeCanvasEditorVendors() 를 **부른 뒤에야** 온다.
             지금은 아무도 부르지 않는다 — 실제 호출은
             HOME-CANVAS-SELECT-1 이 캔버스 편집 모드를 켤 때다.

           의존이 없다(호출 시점에 APP_BUILD_VERSION 만 읽는다).
           mount 를 시작하는 studio-state.js 보다는 앞에 둔다 —
           편집 모드를 켜는 쪽이 생겼을 때 전역이 이미 있어야 한다.
        ====================================================== */
        "./studio-home-canvas-vendor.js",

        "./studio-state.js"
      ]
    );

  </script>
