<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SKIN STUDIO</title>

  <!--
    PRETENDARD — admin/CUSTOMIZE와 동일한 공통 UI 폰트. 이 문서는
    admin iframe 안에서 독립된 browsing context로 로드되므로 admin의
    <link>를 상속받지 않는다 — 따로 불러와야 함(customize/editor/
    index.html과 동일 패턴).
  -->

  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <!-- =========================================================
       배포 버전 원천 — 이 파일만 ?t= 로 받는다

       Studio는 admin이 iframe으로 계속 재사용하는 문서라 탭을
       새로고침하지 않는 한 브라우저가 CSS/JS를 오래 들고 있을 수
       있다. _headers에 no-cache를 지정해 뒀지만 CDN이 CSS/JS
       응답에서는 그 값을 max-age=14400으로 덮어쓴다(실측) —
       실제로 캐시를 무효화하는 것은 아래 ?v= 뿐이다.
       배경: core/lib/build-version.js 상단 주석.
  ========================================================== -->

  <script>

    document.write(
      '<script src="../core/lib/build-version.js?t=' +
      Date.now() +
      '"><' + '/script>'
    );

  </script>


  <!-- =========================================================
       Studio가 쓰는 CSS — 전부 ?v=APP_BUILD_VERSION

       순서는 예전 <link> 순서와 정확히 동일하다(design-tokens 먼저,
       images-panel 마지막). Pretendard(CDN)는 URL 자체가 버전이라
       그대로 둔다.
  ========================================================== -->

  <script>

    loadVersionedStyles(
      [
        "../core/design-tokens.css",
        "../skin-questionnaire/questionnaire.css",
        "./studio.css",
        "./editor/code-editor.css",
        "./editor/import-editor.css",
        "./editor/confirm-dialog.css",
        "./images/images-panel.css",
        "./inspector/studio-inspector.css"
      ]
    );

  </script>

</head>


<body>

  <!-- =========================================================
       SKIN STUDIO SHELL — "skin 없음" / 에러 상태 (PHASE 1B Slice 1/2)

       studio-state.js가 판별한 진입 상태 중 "first-time"(Questionnaire)
       과 "error"만 이 중앙 정렬 박스를 쓴다(AI_SKIN_PHASE1B_DESIGN.md
       5절). "existing"(active skin 있음)은 이 블록을 hidden 처리하고
       아래 SKIN STUDIO PREVIEW SHELL(Slice 3)을 대신 띄운다 — Save/
       Publish/Code Editor 실제 기능은 아직 없다(15절, Slice 4 몫).
  ========================================================== -->

  <main
    class="studio-shell"
    id="studioShell"
  >

    <div
      class="studio-status"
      id="studioStatus"
    >

      <p
        class="studio-status-text"
        id="studioStatusText"
      >
        불러오는 중...
      </p>

      <dl
        class="studio-status-detail"
        id="studioStatusDetail"
        hidden
      ></dl>

      <div
        id="studioQuestionnaireMount"
        hidden
      ></div>

    </div>

  </main>


  <!-- =========================================================
       SKIN STUDIO PREVIEW SHELL (Slice 3, chrome refined in the
       "Studio UI 정리" round)

       "skin 있음" 사용자 전용 — 화면 전체가 Preview인 제작 UI
       (AI_SKIN_PHASE1B_DESIGN.md 11절). studio-state.js가 "existing"
       분기에서 studio-preview.js의 mountStudioPreview()를 호출할
       때만 보인다. iframe은 아래 #studioPreviewFrame 단 하나뿐 —
       Desktop/Mobile 전환은 이 iframe을 재생성/재로드하지 않고
       #studioPreviewStage의 CSS 클래스만 바꿔 폭을 조절한다(11-5절
       "iframe 1개 + 폭 전환만으로 @media가 정확히 동작하는 이유").

       Chrome 정리 라운드에서 모든 컨트롤(top dock/viewport
       toggle/AI drawer)은 Preview 레이아웃 공간을 전혀 차지하지
       않는 절대배치 overlay로만 존재한다 — #studioPreviewStage와
       그 안의 iframe은 이 shell 전체를 그대로 차지하고, 위 컨트롤은
       전부 그 위에 겹쳐 그려진다(studio.css 참고).
  ========================================================== -->

  <div
    class="studio-preview-shell"
    id="studioPreviewShell"
    hidden
  >

    <div
      class="studio-preview-stage"
      id="studioPreviewStage"
    >

      <!--
        wrap을 따로 두는 이유: Mobile 모드에서 iframe 자체의 CSS
        크기(레이아웃 뷰포트)는 항상 390x844로 유지하되, Studio
        화면이 좁을 땐 이 wrap에만 CSS transform: scale()을 걸어
        시각적으로만 축소한다(4절) — iframe 크기를 직접 줄이면
        내부 Skin CSS의 @media 기준(390px)이 실제와 달라진다.
      -->

      <div
        class="studio-preview-frame-wrap"
        id="studioPreviewFrameWrap"
      >

        <iframe
          id="studioPreviewFrame"
          src="./preview/preview-frame.html"
          title="Skin Preview"
        ></iframe>

      </div>

    </div>


    <!-- =====================================================
         PREVIEW BACK — floating control directly on the Preview
         surface (PHASE 1C-H). 더 이상 Top Dock 안에 있지 않다 —
         previewHistory가 HOME 하나뿐일 때는 숨고(hidden), CATEGORY/
         POST로 이동하면 나타난다(studio/preview/preview-navigation.js
         의 updatePreviewBackButtonVisibility()). Undo/browser-back/
         Admin Back(#studioBackButton, Top Dock 안)과 전혀 다른
         컨트롤이다 — 오직 Preview 내부 탐색 기록(previewHistory)을
         한 단계 pop한다. #studioPreviewStage/iframe의 형제로 두어
         Mobile 모드의 --studio-mobile-scale transform(#studioPreview
         FrameWrap에만 걸림) 영향을 받지 않는다 — hit-area가 Desktop/
         Mobile 어느 쪽에서도 항상 동일한 실제 픽셀 크기를 유지한다.
    ====================================================== -->

    <button
      type="button"
      class="studio-preview-back-floating"
      id="studioPreviewBackButton"
      hidden
      aria-label="이전 화면"
      title="이전 화면"
    >←</button>


    <!-- =====================================================
         TOP DOCK — Back / DESKTOP|MOBILE / Save / Code / Settings
         한 줄 통합 (Studio chrome 재정리 라운드, PHASE 1C-H에서
         Preview Back을 위 floating 컨트롤로 옮기며 이 dock에서는
         제거됨).

         hover/focus로는 절대 열리거나 닫히지 않는다 —
         #studioTopDockHandle을 클릭할 때만 studio-preview.js가
         #studioTopDockZone에 is-open 클래스를 토글한다(닫힘 ↔
         펼침). handle은 dock이 열려 있든 닫혀 있든 항상 같은
         자리(zone 최상단)에 남아 있어 클릭 가능해야 한다 — dock이
         열렸을 때도 handle이 dock 바로 위(z-index 상 dock보다
         위)에 그려지므로 다시 눌러 접을 수 있다.

         ★ 기본 상태 = 펼침 (PHASE AI-5A.1 마지막 조정)
         예전에는 접힌 채로 시작했다. AI 진입점이 오른쪽 세로 탭에서
         이 dock 안의 "AI Assistant"로 옮겨 오면서, 접힌 채로
         시작하면 Studio에 들어와 AI를 쓰기까지 handle을 먼저
         찾아 눌러야 했다 — 그래서 초기값만 펼침으로 바꾼다.
         "접으면 Preview가 실제 사이트와 같아진다"는 이 dock의
         존재 이유는 그대로다(사용자가 handle로 접으면 된다).

         상태는 **여기 마크업의 초기값**일 뿐이고 어디에도 저장하지
         않는다 — 사용자가 세션 중 접고 편 결과는 그 문서가 살아
         있는 동안만 유지되며(Studio는 admin iframe 안에서 계속
         살아 있다), 새로 로드하면 다시 이 초기값에서 시작한다.
         AI 패널의 열림 상태와도 무관하다(서로 다른 토글).
    ====================================================== -->

    <div
      class="studio-top-dock-zone is-open"
      id="studioTopDockZone"
    >

      <div
        class="studio-top-dock"
        id="studioTopDock"
      >

        <!-- =================================================
             DOCK LEAD — Back + Select (PHASE AI-6A)

             Select는 "무엇을 만든다"가 아니라 **모드**라, Code/
             Import/Images/Save/Publish가 있는 오른쪽 actions 그룹이
             아니라 dock 왼쪽에 둔다 — 왼쪽은 back 뒤로 300px 넘게
             비어 있다.

             back과 Select를 한 wrapper로 묶어 dock의 자식 그룹을
             셋(lead / groups / actions)으로 유지한다 — 이 셋이
             같은 flex 줄에서 서로를 밀어내는 것이 지금의 반응형
             배치 규칙이다(studio.css "세 그룹의 배치 규칙").

             aria-pressed로 "지금 켜져 있는가"를 나타낸다(여닫는
             패널이 아니라 모드라 aria-expanded가 아니다) —
             studio/inspector/studio-inspector.js가 갱신한다.
        ================================================== -->

        <div class="studio-top-dock-lead">

          <button
            type="button"
            class="studio-top-dock-back"
            id="studioBackButton"
          >
            ← back
          </button>

          <button
            type="button"
            class="studio-corner-button"
            id="studioInspectorButton"
            aria-pressed="false"
            title="Preview에서 요소를 직접 고릅니다"
            disabled
          >
            Select
          </button>

        </div>


        <div class="studio-top-dock-groups">

          <div
            class="studio-viewport-toggle"
            id="studioViewportToggle"
            role="group"
            aria-label="Preview 화면 크기"
          >

            <button
              type="button"
              class="studio-viewport-toggle-option studio-viewport-toggle-option--active"
              data-viewport-mode="desktop"
            >
              Desktop
            </button>

            <span
              class="studio-viewport-toggle-divider"
              aria-hidden="true"
            ></span>

            <button
              type="button"
              class="studio-viewport-toggle-option"
              data-viewport-mode="mobile"
            >
              Mobile
            </button>

          </div>

        </div>


        <!--
             PHASE AI-2.1 — 버튼 순서는 "만들기(Code/Import/Images)"
             다음에 "내보내기(Save/Publish)"다. Settings는 이 toolbar
             에서 뺐다(진입점만 제거, 기능 코드는 건드리지 않는다 —
             이 id를 참조하는 JS는 원래 없다).
        -->

        <div class="studio-top-dock-actions">

          <button
            type="button"
            class="studio-corner-button"
            id="studioCodeButton"
            disabled
          >
            Code
          </button>

          <button
            type="button"
            class="studio-corner-button"
            id="studioImportButton"
            disabled
          >
            Import
          </button>

          <!--
               Skin Studio 파일 UX — 지금 working draft(SkinPackage)를
               다시 Import 가능한 .json 파일로 내려받는다. Import와
               같은 기준(working draft 유무)으로 활성화된다
               (studio-preview.js updateStudioImportButtonState).
          -->
          <button
            type="button"
            class="studio-corner-button"
            id="studioExportButton"
            title="현재 SkinPackage를 .json 파일로 내려받습니다"
            disabled
          >
            Export
          </button>

          <!--
               Skin Image Library v0.1 — 지금 Skin이 선언한
               imageSlots에 내 이미지를 연결/교체/비운다.
               Import 버튼과 같은 기준으로 "working draft가 있는가"
               만 보고 활성화된다(studio-preview.js
               updateStudioImagesButtonState).
          -->
          <button
            type="button"
            class="studio-corner-button"
            id="studioImagesButton"
            disabled
          >
            Images
          </button>

          <button
            type="button"
            class="studio-corner-button"
            id="studioSaveButton"
            disabled
          >
            Save
          </button>

          <button
            type="button"
            class="studio-corner-button"
            id="studioPublishButton"
            disabled
          >
            Publish
          </button>

          <!--
               PHASE AI-5A.1 — AI 패널의 유일한 여는 곳.
               예전에는 화면 오른쪽 가장자리의 세로 탭이었는데,
               "Preview 위에 떠 있는 또 하나의 진입점"이 되어
               제거하고 여기로 합쳤다. 스킨을 직접 만드는 버튼들과는
               1px divider로 한 칸 떼어 둔다.

               aria-expanded는 studio/ai/studio-ai-panel-layout.js가
               패널 헤더의 접기 버튼과 **같은 state 하나**로 동기화한다
               — 어느 쪽으로 닫든 이 값이 즉시 false가 된다.
          -->
          <span
            class="studio-top-dock-divider"
            aria-hidden="true"
          ></span>

          <button
            type="button"
            class="studio-corner-button studio-ai-toggle-button"
            id="studioAiToggleButton"
            aria-expanded="false"
            aria-controls="studioAiDrawer"
          >
            AI Assistant
          </button>

        </div>


        <!--
             DOCK HANDLE — 바에 매달린 탭 (반응형 라운드에서
             zone의 자식 → 바의 자식으로 옮김)

             top:100%(studio.css)로 바 **아래**에 붙는다. 열려
             있을 때 가운데 Desktop/Mobile 토글 위를 덮지 않고,
             닫히면 바가 자기 높이만큼 올라가면서 이 탭이 정확히
             화면 맨 위(y=0)에 남는다 — 예전과 같은 자리다.
        -->

        <button
          type="button"
          class="studio-top-dock-handle"
          id="studioTopDockHandle"
          aria-expanded="true"
          aria-controls="studioTopDock"
          aria-label="Studio 상단 컨트롤"
        ><span id="studioTopDockHandleIcon" aria-hidden="true">▴</span></button>

      </div>

    </div>


    <!-- =====================================================
         AI PANEL — 오른쪽 사이드바 (PHASE AI-5A)

         PHASE 1B~AI-4에서는 화면 아래 가운데에 붙는 drawer였다.
         AI-5A에서 VS Code/Cursor식 우측 패널로 바꿨다 — 요청을
         쓰는 곳과 그 결과(Preview)가 나란히 보이게 하기 위해서다.
         DOM 순서는 [resizer][패널]이고, 여닫기/폭 조절은
         studio/ai/studio-ai-panel-layout.js가, 전송/로딩/되돌리기/
         참고 이미지는 studio/ai/studio-ai-panel.js가 담당한다
         (레이아웃과 기능을 다른 파일로 나눈다).

         PHASE AI-5A.1 — 오른쪽 가장자리의 세로 탭은 제거했고,
         여는 곳은 Top Dock의 #studioAiToggleButton 하나다. Preview를
         클릭해도 패널은 접히지 않는다 — 결과를 눌러 확인하면서
         패널을 열어 두는 흐름이 더 중요하다고 판단했다.

         "어떻게 바꾸고 싶나요?"는 헤더 한 곳에만 둔다 — 예전에는
         label과 textarea placeholder 양쪽에 있어 두 번 보였다.
         textarea는 aria-labelledby로 그 제목을 가리킨다.

         PHASE AI-4의 참고 이미지 UI(thumbnail 줄 / 파일 선택 /
         안내 문구)와 AI-2.1의 로딩 점/경과시간은 여기 마크업으로
         두지 않고 studio-ai-panel.js가 #studioAiPanelBody 안에
         만들어 넣는다 — 이 문서와 studio-lifecycle-scenario.html
         두 곳에 같은 DOM을 중복해 두지 않기 위해서다.
    ====================================================== -->

    <div
      class="studio-ai-dock"
      id="studioAiDock"
    >

      <div
        class="studio-ai-resizer"
        id="studioAiResizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="AI 패널 폭 조절"
      ></div>

      <div
        class="studio-ai-drawer"
        id="studioAiDrawer"
      >

        <div class="studio-ai-panel-header">

          <h2
            class="studio-ai-panel-title"
            id="studioAiPanelTitle"
          >
            어떻게 바꾸고 싶나요?
          </h2>

          <button
            type="button"
            class="studio-ai-panel-collapse"
            id="studioAiPanelCollapse"
            aria-expanded="false"
            aria-controls="studioAiDrawer"
            aria-label="AI 패널 접기"
          >›</button>

        </div>

        <div
          class="studio-ai-panel-body"
          id="studioAiPanelBody"
        >

          <div class="studio-ai-drawer-row">

            <textarea
              id="studioAiDrawerInput"
              class="studio-ai-drawer-input"
              rows="1"
              aria-labelledby="studioAiPanelTitle"
              tabindex="-1"
            ></textarea>

            <button
              type="button"
              class="studio-ai-drawer-send"
              id="studioAiDrawerSend"
              disabled
              aria-label="전송"
            >↑</button>

          </div>

          <p
            class="studio-ai-drawer-status"
            id="studioAiDrawerStatus"
            role="status"
            aria-live="polite"
            hidden
          >

            <span id="studioAiDrawerStatusText"></span>

            <button
              type="button"
              class="studio-ai-drawer-undo"
              id="studioAiDrawerUndo"
              hidden
            >되돌리기</button>

          </p>

        </div>

      </div>

    </div>


    <div
      class="studio-preview-overlay"
      id="studioPreviewOverlay"
      hidden
    >

      <p
        class="studio-preview-overlay-text"
        id="studioPreviewOverlayText"
      ></p>

    </div>


    <!-- =====================================================
         TOAST — Save 성공/실패, sanitize 안내 등 짧은 1회성
         알림(9/13절). Top Dock의 hover/focus 여닫기와 무관하게
         항상 같은 자리에 뜬다(studio-preview.js의
         showStudioToast()).
    ====================================================== -->

    <div
      class="studio-toast"
      id="studioToast"
      role="status"
      aria-live="polite"
      hidden
    ></div>

  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script>

    /*
      아래 skin-initializer.js(모듈)가 정적 import로 끌어오는
      skin-css-validate.js, 그리고 preview 쪽 skin-render.js는
      import 지정자가 문자열 리터럴이라 ?v=가 붙지 않는다.
      import map으로 그 URL만 버전이 붙은 URL로 돌린다
      (core/lib/build-version.js의 writeVersionedImportMap 주석).
      Studio는 /studio/ 아래 문서라 ../skin/... 이 /skin/... 으로
      풀리므로 키는 공개 index.html과 같다.
    */

    writeVersionedImportMap(
      [
        "/skin/skin-render.js",
        "/skin/skin-css-validate.js"
      ]
    );

  </script>


  <script>

    loadVersionedScripts(
      [
        "../core/lib/supabase-client.js"
      ]
    );

  </script>

  <!-- =========================================================
       SKIN INITIALIZER 핸드셰이크 (skin/skin-home.js와 동일 패턴)

       skin/skin-initializer.js는 ES 모듈이라(skin-css-validate.js를
       정적 import) classic script들보다 늦게 실행된다 — 아래
       classic script들(studio-state.js 포함)이 폴링 없이
       안전하게 넘겨받도록, 그 모듈을 로드하기 전에 Promise를
       먼저 선언해 둔다.
  ========================================================== -->

  <script>

    window.skinInitializerReady =
      new Promise(
        (resolve) => {
          window.__resolveSkinInitializerReady = resolve;
        }
      );

  </script>

  <script>

    loadVersionedScripts(
      [
        "../skin/skin-sanitize.js",
        "../skin/skin-package-normalize.js",
        "../skin/skin-generator.js"
      ]
    );

    loadVersionedModules(
      [
        "../skin/skin-initializer.js"
      ]
    );

    loadVersionedScripts(
      [
        "../skin-questionnaire/questionnaire.js"
      ]
    );

  </script>

  <!-- =========================================================
       SKIN CONTEXT / PREVIEW (Slice 3)

       skin-context.js(classic)는 buildSitePath(site-path.js)와
       supabaseClient를 필요로 하므로 그 둘보다 먼저 로드하면 안
       된다 — supabaseClient는 위에서 이미 로드됐고, site-path.js를
       바로 앞에 추가한다. skin-image-slots.js는 skin/skin-home.js
       (공개 HOME)와 studio-preview.js가 공유하는 순수 helper라
       의존이 없다(2/5절).
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "../core/lib/site-path.js",
        "../skin/skin-image-slots.js",
        "../skin/skin-context.js",
        "../skin/skin-template.js"
      ]
    );

  </script>

  <!-- =========================================================
       WHOLE SKINPACKAGE IMPORT (PHASE 1 Final Gap)

       skin-package-import.js는 sanitizeSkinHTML(위에서 이미 로드)과
       htmlHasPostBodyRegion(바로 위 skin-template.js)에 의존한다 —
       그래서 그 둘 다음, studio-preview.js/import-editor.js보다는
       먼저 로드한다.
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "../skin/skin-package-import.js",
        "../skin/skin-package-export.js"
      ]
    );

  </script>

  <!-- =========================================================
       CODE EDITOR / SAVE DRAFT (Slice 4)

       studio-write.js는 save_skin_draft_version() RPC wrapper뿐
       (supabaseClient만 있으면 됨, 이미 위에서 로드됨). editor/
       code-editor.js는 sanitizeSkinHTML(skin-sanitize.js, 이미
       위에서 로드됨)과 window.skinInitializerReady 핸드셰이크를
       쓴다 — 둘 다 studio-preview.js가 호출하는 시점(사용자가
       Code/Save 버튼을 실제로 누르는 시점)보다 먼저 로드되어
       있으면 충분하다. editor/import-editor.js는 skin-package-import.js
       (바로 위)의 validateSkinPackageImport()만 쓴다(PHASE 1 Final
       Gap — Whole SkinPackage Import).
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "./studio-write.js",
        "./editor/code-editor.js",
        "./editor/import-editor.js"
      ]
    );

  </script>

  <!--
       Skin Draft Publish — Publish 클릭 시 뜨는 확인 dialog.
       studio-preview.js가 클릭 핸들러 안에서만
       window.openStudioConfirmDialog를 호출하므로(즉시 실행 아님),
       studio-preview.js보다 먼저 로드되어 있기만 하면 된다.
  -->
  <script>

    loadVersionedScripts(
      [
        "./editor/confirm-dialog.js"
      ]
    );

  </script>

  <!-- =========================================================
       SKIN IMAGE LIBRARY (v0.1)

       skin-image-library.js는 supabaseClient/SUPABASE_URL(위에서
       이미 로드됨)에만 의존하는 데이터 계층이다. images-panel.js는
       그 라이브러리와, studio-preview.js가 노출하는
       getStudioImageSlotState/setStudioImageSlot을 쓴다 — 후자는
       사용자가 Images 버튼을 실제로 누르는 시점에만 있으면 되므로
       studio-preview.js보다 먼저 로드해도 안전하다(import-editor.js
       와 동일한 관계).
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "./images/skin-image-library.js",
        "./images/images-panel.js",
        "./studio-preview.js"
      ]
    );

  </script>

  <!-- =========================================================
       NAVIGABLE PREVIEW (PHASE 1C-G)

       preview-route.js는 site-path.js(SITE_BASE_PATH)에만
       의존하는 순수 route parser다. preview-navigation.js는
       studio-preview.js가 이미 선언해 둔 buildStudioHomePreviewSkin/
       postRenderToFrame/setStudioPreviewOverlay/
       updateStudioCodeButtonState와 skin-context.js/
       skin-template.js를 함께 쓴다 — 그래서 이 셋 다음에 로드한다.
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "./preview/preview-route.js"
      ]
    );

  </script>

  <!-- =========================================================
       STUDIO POST ACTUAL BODY PREVIEW (PHASE 1C-I)

       preview-post-body.js가 재사용하는 공개 POST Viewer 서식
       파이프라인 — 이 넷은 이미 posts/*에서 쓰이는 순수 함수
       모음이라 여기서 새로 만들지 않는다(파일 자체는 수정하지
       않음). posts/style/posts-style-preset.js는 getSafeHighlightColor/
       getPresetHighlightColor만 가져다 쓴다(loadPostStylePreset* 는
       getSiteOwner()/admin swatch UI에 의존해서 재사용하지 않는다,
       preview-post-body.js 파일 상단 주석 참고).
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "../posts/posts-sanitize.js",
        "../posts/style/posts-style-preset.js",
        "../posts/style/posts-style-dialogue.js",
        "../posts/style/posts-style-render.js",
        "./preview/preview-post-body.js",
        "./preview/preview-navigation.js"
      ]
    );

  </script>

  <!-- =========================================================
       AI PANEL (PHASE AI-1 / AI-5A)

       ai/studio-ai-panel.js는 studio-preview.js가 노출하는
       showStudioToast/getStudioAiWorkingState/applyAiSkinPackage와
       skin-package-import.js의 validateSkinPackageImport, 그리고
       supabaseClient(access token 조회)를 쓴다 — 넷 다 위에서 이미
       로드됐다. studio-state.js(실제 mount 시작)보다는 먼저 둔다:
       패널이 평가 시점에 Send 버튼 상태를 한 번 계산하므로, 그때
       DOM과 bridge가 모두 준비돼 있는 편이 단순하다.

       PHASE AI-5A — ai/studio-ai-panel-layout.js(우측 사이드바
       여닫기 / 폭 조절 / Preview 클릭 시 접기)를 그 앞에 둔다.
       studio-ai-panel.js가 평가 시점에 textarea 높이를 한 번
       계산하는데, 그전에 패널의 열림 상태(#studioPreviewShell의
       .has-ai-panel)가 정해져 있는 편이 단순하기 때문이다. 두
       파일은 window 이벤트("studio-ai-panel-toggle") 하나로만
       연결된다 — 서로의 내부 변수를 읽지 않는다.

       PHASE AI-6B — ai/studio-ai-selection.js(선택 요소 chip /
       selectionContext / 요청용 SkinPackage)를 그 사이에 둔다.
       이 파일이 실제로 쓰는 것(Inspector의 selection 조회,
       stampInspectorEditIds)은 전부 **아래에서** 로드되는
       inspector/* 이지만, 호출은 전부 사용자가 무언가를 누른
       뒤에만 일어나므로 평가 순서에 걸리지 않는다. 반대로
       studio-ai-panel.js는 전송 시점에 이 파일의 함수를 부르므로
       읽는 순서를 그쪽 앞으로 맞춰 둔다.
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "./ai/studio-ai-panel-layout.js",
        "./ai/studio-ai-selection.js",
        "./ai/studio-ai-panel.js"
      ]
    );

  </script>

  <!-- =========================================================
       ELEMENT INSPECTOR + DIRECT EDIT (PHASE AI-6A)

       inspector/studio-inspector-model.js는 의존이 전혀 없는 순수
       함수 모음이고(Preview iframe도 같은 파일을 따로 로드한다 —
       studio/preview/preview-frame.html 참고), inspector/
       studio-inspector.js는 studio-preview.js(applyStudioDirectEdit/
       postInspectorModeToFrame/showStudioToast/resolveCodeEditorSource)
       와 preview-navigation.js(renderCurrentPreviewEntry), 그리고
       skin-sanitize.js(sanitizeSkinHTML/isSafeSkinUrl)에 의존한다 —
       셋 다 위에서 이미 로드됐다. AI 패널보다 뒤에 두는 이유는
       "AI 수정" 버튼이 window.setStudioAiPanelOpen을 쓰기
       때문이다(실제 호출은 클릭 시점이라 순서가 필수는 아니지만,
       읽는 순서와 의존 방향을 맞춰 둔다).
  ========================================================== -->

  <script>

    loadVersionedScripts(
      [
        "./inspector/studio-inspector-model.js",
        "./inspector/studio-inspector.js",
        "./studio-state.js"
      ]
    );

  </script>

</body>

</html>
