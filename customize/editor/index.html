<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>커스터마이즈 편집기</title>

  <!--
    PRETENDARD — admin과 동일한 공통 UI 폰트. 이 문서는 admin
    iframe 안에서 독립된 browsing context로 로드되므로 admin의
    <link>를 상속받지 않는다 — 따로 불러와야 함.
  -->

  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <link
    rel="stylesheet"
    href="./editor.css"
  >

</head>


<body>

  <!-- =========================================================
       CUSTOMIZE EDITOR SHELL (1단계)

       왼쪽 editor panel + 오른쪽 실제 renderCustomizeLayout()
       preview. 아직 Supabase 연동/drag/property editor 없음 —
       구조만 잡는 단계.
  ========================================================== -->

  <div class="customize-editor-shell">


    <!-- ===================================================
         LEFT: editor panel
    ==================================================== -->

    <aside class="customize-editor-panel">

      <div class="customize-editor-panel-scroll">

        <!--
             바깥 admin(customizePanel)에 이미 "CUSTOMIZE" 제목이
             있으므로 여기서는 굵은 제목을 반복하지 않는다 — 이
             패널이 무엇인지만 작은 규칙 텍스트로 짚어준다.
        -->

        <div class="customize-editor-panel-header">

          <span class="customize-editor-subtitle">
            홈 화면 편집기
          </span>

        </div>


        <!-- =============================================
             페이지 전환 (커버/프로필 등)

             버튼은 하드코딩하지 않고, editor.js가
             CUSTOMIZE_PAGE_DEFS를 순회하며 이 nav 안에 동적으로
             그려 넣는다(renderCustomizePageTabs 참고) — 페이지가
             늘어나도 이 파일은 그대로 둬도 됨.
        ============================================== -->

        <nav
          class="customize-page-tabs"
          id="customizePageTabs"
          aria-label="편집 대상 페이지"
        ></nav>


        <!-- =============================================
             페이지 설정 / 요소 추가 / 요소 설정 탭

             기본 진입 탭 = 페이지 설정(updateCustomizePanelTabUI
             참고). preview에서 빈 배경을 클릭하면 페이지 설정으로,
             block을 클릭하면 요소 설정으로 자동 전환된다
             (handleCustomizePreviewClick/selectCustomizeBlock).
        ============================================== -->

        <nav
          class="customize-panel-tabs"
          aria-label="편집 패널"
        >

          <button
            class="customize-panel-tab active"
            id="panelTabPageButton"
            type="button"
          >
            페이지 설정
          </button>

          <span class="customize-panel-tab-divider">
            |
          </span>

          <button
            class="customize-panel-tab"
            id="panelTabAddButton"
            type="button"
          >
            요소 추가
          </button>

          <span class="customize-panel-tab-divider">
            |
          </span>

          <button
            class="customize-panel-tab"
            id="panelTabElementButton"
            type="button"
          >
            요소 설정
          </button>

        </nav>


        <!-- =============================================
             페이지 설정 패널 — 배경/Content Area(사이트+페이지
             단위 설정). block 선택 여부와 무관하게 항상 이 내용
             그대로 보인다. QUOTE PRESET 아코디언 패턴을 따른다
             (initCustomizeAccordions 참고).
        ============================================== -->

        <section
          class="customize-panel-section"
          id="pageSettingsPanel"
        >

          <!-- 1. 디자인 -->

          <div class="customize-accordion">

            <button
              type="button"
              class="customize-accordion-toggle"
              aria-expanded="true"
            >
              <span class="customize-accordion-title">
                디자인
              </span>
              <span class="customize-accordion-icon">
                &minus;
              </span>
            </button>

            <div class="customize-accordion-content">

              <div class="customize-trio-grid">

                <div class="customize-compact-field">

                  <label for="fontSelect">
                    글꼴
                  </label>

                  <select
                    class="customize-field-select"
                    id="fontSelect"
                  ></select>

                </div>

                <div class="customize-compact-field">

                  <label for="textColorInput">
                    글자색
                  </label>

                  <div class="customize-color-input-row">

                    <input
                      type="color"
                      id="textColorInput"
                    >

                    <span
                      class="customize-color-value"
                      id="textColorValue"
                    ></span>

                  </div>

                </div>

                <div class="customize-compact-field">

                  <label for="pointColorInput">
                    포인트색
                  </label>

                  <div class="customize-color-input-row">

                    <input
                      type="color"
                      id="pointColorInput"
                    >

                    <span
                      class="customize-color-value"
                      id="pointColorValue"
                    ></span>

                  </div>

                </div>

              </div>

            </div>

          </div>


          <!-- 2. 배경 -->

          <div class="customize-accordion">

            <button
              type="button"
              class="customize-accordion-toggle"
              aria-expanded="true"
            >
              <span class="customize-accordion-title">
                배경
              </span>
              <span class="customize-accordion-icon">
                &minus;
              </span>
            </button>

            <div class="customize-accordion-content">

              <div
                class="customize-toggle-buttons"
                id="backgroundTypeToggle"
              >

                <button
                  type="button"
                  class="customize-toggle-button"
                  id="backgroundTypeSolidButton"
                >
                  단색
                </button>

                <button
                  type="button"
                  class="customize-toggle-button"
                  id="backgroundTypeImageButton"
                >
                  이미지
                </button>

              </div>


              <!-- 단색: 배경색 + 패턴(패턴은 단색에서만 사용) -->

              <div id="backgroundSolidFields">

                <div class="customize-pair-grid">

                  <div class="customize-compact-field">

                    <label for="backgroundColorInput">
                      배경색
                    </label>

                    <div class="customize-color-input-row">

                      <input
                        type="color"
                        id="backgroundColorInput"
                      >

                      <span
                        class="customize-color-value"
                        id="backgroundColorValue"
                      ></span>

                    </div>

                  </div>

                  <div class="customize-compact-field">

                    <label for="backgroundPatternTypeSelect">
                      패턴
                    </label>

                    <select
                      class="customize-field-select"
                      id="backgroundPatternTypeSelect"
                    ></select>

                  </div>

                </div>

                <div
                  class="customize-compact-field"
                  id="backgroundPatternDetailRow"
                >

                  <label for="backgroundPatternColorInput">
                    패턴 색상
                  </label>

                  <div class="customize-color-input-row">

                    <input
                      type="color"
                      id="backgroundPatternColorInput"
                    >

                    <label class="customize-auto-toggle-row">

                      <input
                        type="checkbox"
                        id="backgroundPatternColorInheritCheckbox"
                      >

                      상속

                    </label>

                  </div>

                </div>

                <div class="customize-pair-grid">

                  <div
                    class="customize-compact-field"
                    id="backgroundPatternOpacityRow"
                  >

                    <label for="backgroundPatternOpacityInput">
                      불투명도(%)
                    </label>

                    <input
                      type="number"
                      class="customize-field-input"
                      id="backgroundPatternOpacityInput"
                      min="0"
                      max="100"
                      step="1"
                    >

                  </div>

                  <div
                    class="customize-compact-field"
                    id="backgroundPatternSizeRow"
                  >

                    <label for="backgroundPatternSizeInput">
                      간격(px)
                    </label>

                    <input
                      type="number"
                      class="customize-field-input"
                      id="backgroundPatternSizeInput"
                      min="4"
                      max="120"
                      step="1"
                    >

                  </div>

                </div>

              </div>


              <!-- 이미지: URL + 불투명도 + 맞춤 -->

              <div
                id="backgroundImageFields"
                hidden
              >

                <div class="customize-compact-field">

                  <label for="backgroundImageSrcInput">
                    이미지 URL (https만 허용)
                  </label>

                  <input
                    type="text"
                    class="customize-field-input"
                    id="backgroundImageSrcInput"
                    placeholder="https://..."
                  >

                </div>

                <div class="customize-pair-grid">

                  <div class="customize-compact-field">

                    <label for="backgroundImageOpacityInput">
                      불투명도(%)
                    </label>

                    <input
                      type="number"
                      class="customize-field-input"
                      id="backgroundImageOpacityInput"
                      min="0"
                      max="100"
                      step="1"
                    >

                  </div>

                  <div class="customize-compact-field">

                    <label for="backgroundImageFitSelect">
                      맞춤
                    </label>

                    <select
                      class="customize-field-select"
                      id="backgroundImageFitSelect"
                    ></select>

                  </div>

                </div>

              </div>

            </div>

          </div>


          <!-- 3. 콘텐츠 영역 -->

          <div class="customize-accordion">

            <button
              type="button"
              class="customize-accordion-toggle"
              aria-expanded="true"
            >
              <span class="customize-accordion-title">
                콘텐츠 영역
              </span>
              <span class="customize-accordion-icon">
                &minus;
              </span>
            </button>

            <div class="customize-accordion-content">

              <div class="customize-compact-field">

                <label for="contentAreaMaxWidthInput">
                  최대 너비(px)
                </label>

                <div class="customize-input-with-toggle">

                  <input
                    type="number"
                    class="customize-field-input"
                    id="contentAreaMaxWidthInput"
                    min="280"
                    max="1200"
                    step="10"
                  >

                  <label class="customize-auto-toggle-row">

                    <input
                      type="checkbox"
                      id="contentAreaMaxWidthUnlimitedCheckbox"
                    >

                    제한 없음

                  </label>

                </div>

              </div>

              <div class="customize-pair-grid">

                <div class="customize-compact-field">

                  <label for="contentAreaPaddingXInput">
                    좌우 여백(px)
                  </label>

                  <input
                    type="number"
                    class="customize-field-input"
                    id="contentAreaPaddingXInput"
                    min="0"
                    max="120"
                    step="1"
                  >

                </div>

                <div class="customize-compact-field">

                  <label for="contentAreaPaddingYInput">
                    위아래 여백(px)
                  </label>

                  <input
                    type="number"
                    class="customize-field-input"
                    id="contentAreaPaddingYInput"
                    min="0"
                    max="120"
                    step="1"
                  >

                </div>

              </div>

              <div class="customize-pair-grid">

                <div class="customize-compact-field">

                  <label for="contentAreaAlignSelect">
                    좌우 정렬
                  </label>

                  <select
                    class="customize-field-select"
                    id="contentAreaAlignSelect"
                  ></select>

                </div>

                <div class="customize-compact-field">

                  <label for="contentAreaVerticalAlignSelect">
                    수직 정렬
                  </label>

                  <select
                    class="customize-field-select"
                    id="contentAreaVerticalAlignSelect"
                  ></select>

                </div>

              </div>

            </div>

          </div>

        </section>


        <!-- =============================================
             요소 추가 패널 — text/image/container 등 새 block을
             현재 선택 위치 뒤에 추가하는 버튼만 모아둔다(구조
             둘러보기/속성 편집은 "요소 설정" 탭 담당).
        ============================================== -->

        <section
          class="customize-panel-section"
          id="addElementPanel"
          hidden
        >

          <p class="customize-panel-hint">
            추가된 요소는 바로 선택되어 "요소 설정" 탭에 나타납니다.
          </p>

          <div
            class="customize-add-element-row"
            id="addElementRow"
          ></div>

        </section>


        <!-- =============================================
             요소 설정 패널 — 요소 목록(직접 선택용) + 선택된
             요소의 props 편집. preview에서 block을 클릭해도 이
             탭으로 자동 전환된다(selectCustomizeBlock 참고).
        ============================================== -->

        <section
          class="customize-panel-section"
          id="elementSettingsPanel"
          hidden
        >

          <ul
            class="customize-elements-list"
            id="elementsList"
          ></ul>

          <p
            class="customize-panel-hint"
            id="elementSettingsEmptyHint"
          >
            왼쪽 미리보기 또는 위 목록에서 요소를 선택하면 여기에
            설정이 나타납니다.
          </p>

          <div
            id="blockSettingsSection"
            hidden
          >

            <div class="customize-block-settings-header">

              <span
                class="customize-block-settings-type"
                id="blockSettingsTypeLabel"
              ></span>

              <div class="customize-block-settings-actions">

                <button
                  type="button"
                  class="customize-icon-button"
                  id="duplicateBlockButton"
                  title="이 요소 복제"
                >
                  복제
                </button>

                <button
                  type="button"
                  class="customize-icon-button customize-icon-button-danger"
                  id="deleteBlockButton"
                  title="이 요소 삭제"
                >
                  삭제
                </button>

              </div>

            </div>

            <div id="blockPropsFields"></div>

          </div>

        </section>

      </div>


      <!-- =============================================
           SAVE (1단계에서는 동작 없음)
      ============================================== -->

      <div class="customize-editor-panel-footer">

        <button
          class="customize-save-button"
          id="customizeSaveButton"
          type="button"
          disabled
          title="저장은 다음 단계에서 구현됩니다"
        >
          save
        </button>

      </div>

    </aside>



    <!-- ===================================================
         RIGHT: device preview

         renderCustomizeLayout()는 이 안의 iframe(preview-frame.html)
         문서 안에서 호출된다 — iframe은 그 자체로 독립된 browsing
         context라 iframe.style.width를 실제 device 폭으로 지정하면
         내부 문서가 진짜 그 폭의 화면인 것처럼 렌더된다(부모 문서
         폭을 CSS로 줄이는 것과는 다름 — 이게 media query 등 실제
         반응형 동작이 그대로 걸리는 이유).
    ==================================================== -->

    <main class="customize-editor-preview">

      <div
        class="customize-device-toolbar"
        id="deviceToolbar"
        role="tablist"
        aria-label="미리보기 디바이스"
      ></div>

      <div
        class="customize-device-stage"
        id="deviceStage"
      >

        <div
          class="customize-device-scale-box"
          id="deviceScaleBox"
        >

          <div
            class="customize-device-frame-wrapper"
            id="deviceFrameWrapper"
          >

            <iframe
              class="customize-device-frame"
              id="customizePreviewFrame"
              src="./preview-frame.html"
              title="홈 미리보기"
            ></iframe>

          </div>

        </div>

      </div>

    </main>


  </div>


  <!-- =========================================================
       renderer 스크립트 로드 순서 중요
       (customize/renderer/renderer-test.html과 동일 순서)
  ========================================================== -->

  <script src="../renderer/block-defaults.js"></script>
  <script src="../renderer/theme-tokens.js"></script>
  <script src="../renderer/validate-layout.js"></script>
  <script src="../renderer/render-layout.js"></script>
  <script src="../renderer/default-layout.js"></script>

  <script src="./editor.js"></script>

</body>

</html>
