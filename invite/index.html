<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>imory 초대</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <!-- =========================================================
       배포 버전 원천 — 이 파일만 ?t= 로 받는다

       자기가 정의하는 값으로 자기 URL을 만들 수 없어서(닭과 달걀),
       고정 URL로 두면 CDN이 붙이는 4시간 캐시 때문에 최대 4시간
       동안 옛 버전 값을 읽는다 — 그러면 그 뒤의 ?v=가 전부 옛
       값이 되어 새 배포가 통째로 무시된다. 이 문서(HTML)는
       _headers의 no-cache가 실제로 먹히므로 항상 최신이고, 그
       문서가 매번 새 ?t= URL을 만들어 주므로 평범한 새로고침
       한 번으로 새 버전 값이 들어온다.
       배경: core/lib/build-version.js 상단 주석.
  ========================================================== -->

  <script>

    document.write(
      '<script src="../core/lib/build-version.js?t=' +
      Date.now() +
      '"><' + '/script>'
    );

  </script>


  <script>

    loadVersionedStyles(
      [
        "../core/design-tokens.css"
      ]
    );

  </script>

  <!--
    새 CSS를 만들지 않고 admin/admin-shell.css의 .login-box /
    .google-login-button / .login-desc-link 등을 그대로 재사용한다
    (auth/index.html과 같은 패턴) — admin의 로그인 화면과 시각적으로
    통일된 "빈 화면 + Google 버튼" 레이아웃이면 충분하기 때문.
  -->

  <script>

    loadVersionedStyles(
      [
        "../admin/admin-shell.css"
      ]
    );

  </script>

</head>


<body>

  <main class="admin-page">

    <section
      class="login-box"
      id="inviteBox"
    >

      <h1>
        imory
      </h1>

      <p
        class="login-desc"
        id="inviteMessage"
      >
        초대 링크를 확인하고 있어요...
      </p>

      <button
        class="google-login-button"
        id="googleLoginButton"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        <span>
          Sign in with Google
        </span>

      </button>

      <a
        class="login-desc-link"
        id="inviteHomeLink"
        href="../"
        hidden
      >
        홈으로 가기
      </a>

      <p
        class="login-message"
        id="inviteStatusMessage"
      ></p>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script>

    loadVersionedScripts(
      [
        "../core/lib/supabase-client.js",
        "../core/lib/auth-shared.js",
        "../core/lib/invite-token.js"
      ]
    );

  </script>

  <script>

    loadVersionedScripts(
      [
        "./invite.js"
      ]
    );

  </script>

</body>

</html>
