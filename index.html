  <!--
    ★ iOS Safari는 상단 상태바/하단 툴바 영역을 이 메타의 색으로
    칠한다(없으면 페이지 배경색을 추정해서 쓰는데, 추정이 항상
    맞지는 않고 토글처럼 새로고침 없이 테마가 바뀌는 경우 갱신이
    안 될 수 있다) — 그래서 색 자체는 항상 아래 두 스크립트
    (initSystemTheme, core/theme-toggle.js)가 <html data-theme>와
    함께 직접 갱신한다. 여기 적힌 값은 라이트 모드 기본값(초기
    렌더링 시 스크립트 실행 전 아주 짧은 순간의 폴백)일 뿐이다.
    content는 반드시 core/design-tokens.css의 --system-bg
    라이트/다크 실값(#ffffff / #222222, --imory-white /
    --imory-gray-900)과 같은 값을 리터럴로 유지해야 한다 — meta
    theme-color는 CSS 변수를 참조할 수 없어서 값이 바뀌면 두
    스크립트도 함께 고쳐야 한다(Design.md 4-7 참고).
  -->

  <meta
    name="theme-color"
    content="#ffffff"
    id="systemThemeColorMeta"
  >


  <!--
    SYSTEM THEME INIT — light/dark 깜빡임(FOUC) 방지용. CSS
    로드/본문 렌더링보다 먼저 실행되어야 하므로 head 맨 앞,
    다른 어떤 스타일시트/스크립트 로드보다도 앞에 둔다. localStorage 저장값
    → 없으면 OS prefers-color-scheme 순으로 판정해 <html>에
    data-theme를 붙이기만 한다. 위 #systemThemeColorMeta도 같은
    판정 결과로 함께 맞춰서, 스크립트 로드 시점에 Safari 상단/하단
    바 색이 처음부터 맞게 나오도록 한다(이후 토글 클릭은
    core/theme-toggle.js가 처리).
  -->

  <script>

    (function initSystemTheme() {

      try {

        var stored =
          localStorage.getItem(
            "imory_system_theme"
          );

        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
              );

        document.documentElement.setAttribute(
          "data-theme",
          theme
        );

        var themeColorMeta =
          document.getElementById(
            "systemThemeColorMeta"
          );

        if (themeColorMeta) {

          themeColorMeta.setAttribute(
            "content",
            theme === "dark" ? "#222222" : "#ffffff"
          );

        }

      } catch (e) {}

    })();

  </script>

  <!-- =========================================================
       LEGACY ?u=slug → /:slug REDIRECT

       예전 ?u=slug 링크로 들어오면 첫 path segment가 slug인
       최종 주소로 옮겨준다(새 링크 생성에는 더 이상 ?u= 안 씀
       — home/site-owner.js, posts/editor/posts-refs.js 참고).
       core/lib/site-path.js가 이 스크립트보다 먼저 로드돼야 함.
  ========================================================== -->

  <script>

    (function redirectLegacyOwnerQuery() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const legacySlug =
        params.get(
          "u"
        );


      if (!legacySlug) {
        return;
      }


      params.delete(
        "u"
      );

      const remainingSearch =
        params.toString();

      const newPath =
        buildSitePath(
          legacySlug,
          getSitePath()
        ) +
        (
          remainingSearch
            ? `?${remainingSearch}`
            : ""
        ) +
        window.location.hash;


      window.location.replace(
        newPath
      );

    })();

  </script>

  <!-- =========================================================
       AI SKIN (PHASE 1A, Slice 4)

       published Skin이 있는 사용자만 이 경로로 렌더된다(아래
       initHomeRenderer 참고). skin-sanitize.js/skin-context.js는
       classic script라 다른 코드처럼 그냥 전역 함수를 노출한다.
       skin-render.js는 이 모듈(skin-home.js)이 정적 import하므로
       여기서 별도로 로드하지 않는다.

       skin-home.js는 type="module"이라 classic script와 로드
       타이밍이 다르다(문서 파싱이 끝난 뒤 실행) — initHomeRenderer가
       "전역이 생기길 기다리며 폴링"하지 않도록, 이 모듈이 로드를
       마치는 순간 resolve되는 Promise를 미리 선언해 둔다.

       롤백: 이 블록 전체 + 아래 initHomeRenderer의
       tryRenderPublishedSkinHome 분기만 제거하면 완전히 가역이다
       — 기존 legacy_sua/customize/notice 로직은 한 줄도 안 바뀜.
  ========================================================== -->

  <script>

    window.skinHomeReady =
      new Promise(
        (resolve) => {
          window.__resolveSkinHomeReady = resolve;
        }
      );

    /*
      CATEGORY(Slice 1C-C, skin/skin-category.js)도 HOME과 동일한
      핸드셰이크 패턴을 쓴다 — posts-view-list.js(classic script)가
      openCategoryPage()에서 폴링 없이 이 모듈을 넘겨받는다.
    */

    window.skinCategoryReady =
      new Promise(
        (resolve) => {
          window.__resolveSkinCategoryReady = resolve;
        }
      );

    loadVersionedScripts(
      [
        "./skin/skin-sanitize.js",
        "./skin/skin-image-slots.js",
        "./skin/skin-context.js",
        "./skin/skin-template.js"
      ]
    );

    document.write(
      `<script type="module" src="./skin/skin-home.js?v=${APP_BUILD_VERSION}"><\/script>`
    );

    document.write(
      `<script type="module" src="./skin/skin-category.js?v=${APP_BUILD_VERSION}"><\/script>`
    );

  </script>

  <!-- =========================================================
       LANDING (공개 시작 페이지 — /:slug 없이 루트("/")로
       접속했을 때만)
  ========================================================== -->

  <style>

    .landing-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: var(--system-bg);

      /*
        body는 home-base.css에서 height:100%; overflow:hidden이라
        자체 스크롤이 안 된다 — .start-hero-block이 최소 100dvh라
        about 섹션은 항상 스크롤해야 보인다. 이 화면 자체를 스크롤
        컨테이너로 두고, "about imory" 클릭 시 자연스럽게 아래로
        이동하도록 smooth 처리(reduced-motion에서는 즉시 이동).
      */
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {

      .landing-screen {
        scroll-behavior: auto;
      }

    }

    /*
      [hidden]과 위 .landing-screen{display:flex}는 명시도가
      같아서 소스 순서상 이 규칙이 없으면 hidden 속성이 무시되고
      계속 보인다 — JS가 hidden을 켜도 화면이 안 사라지는 버그였음.
    */

    .landing-screen[hidden] {
      display: none;
    }

    /*
      .viewer-area(home-base.css)/.menu-button(menu.css)도 자체
      display:flex를 갖고 있어 같은 문제가 있다. id 선택자는
      클래스 선택자보다 항상 명시도가 높아서, 소스 순서와
      무관하게 hidden일 때 확실히 숨겨진다.
    */

    #viewerArea[hidden],
    #menuButton[hidden] {
      display: none;
    }

    /*
      공개 시작 페이지 헤더 — 좌측 로고 + 우측
      .start-header-actions(테마 토글 + SIGN IN)를 한 줄에 둔다.
    */

    .start-header {
      padding-top: max(16px, env(safe-area-inset-top));
      padding-right: max(24px, env(safe-area-inset-right));
      padding-bottom: 16px;
      padding-left: max(24px, env(safe-area-inset-left));

      border-bottom: 1px solid var(--system-border);
    }

    /*
      ★ 로고/액션 자체는 예전엔 폭 제한 없이 .start-header
      바로 아래 flex 자식이라, 넓은 데스크톱 화면에서 뷰포트
      양 끝에 그대로 붙어(끝과 끝) 보였다 — naru.pub 참고
      이미지처럼 좌우 여백이 있는 좁은 헤더로 보이도록 이
      안쪽 래퍼에만 max-width + auto margin을 줘서 가운데
      정렬한다. border-bottom은 .start-header에 그대로 둬서
      구분선 자체는 전체 폭을 유지한다(콘텐츠만 좁아짐).
      화면이 900px보다 좁으면 max-width가 자연히 무시되고
      기존 padding만 남는다.
    */

    .start-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;

      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /*
      로고 폰트는 --theme-font-family-serif와 같은 Nanum Myeongjo를
      직접 지정한다(새 폰트 로드 없음, 이미 <head>에서 로드된
      Google Fonts 링크 재사용) — 이 화면은 --theme-*가 아니라
      --system-* 영역이라 토큰 자체는 재사용하지 않는다.
    */

    .start-logo {
      display: inline-flex;
      align-items: center;

      font-family: "Nanum Myeongjo", serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--system-text);

      text-decoration: none;
    }

    /*
      naru.pub 스타일 요청 반영 — 세로선을 로고 옆 장식용
      구분선이 아니라 "imory" 마지막 y에 바짝 붙은 텍스트 입력
      커서처럼 보이게 한다. margin-left 없이 2px 고정 간격만
      두고, 높이도 글자 전체(1.05em)가 아니라 살짝 짧게(0.92em)
      줄여 커서 느낌을 낸다.
    */

    .start-logo::after {
      content: "";
      display: inline-block;

      width: 1px;
      height: 0.92em;
      margin-left: 2px;

      background: var(--imory-pink-system);
    }


    /*
      우측 액션 영역 — 테마 토글 + SIGN IN. naru.pub 상단바처럼
      가벼운 navigation action으로, 큰 CTA 버튼 형태를 피한다.
      기본은 조용한 gray, hover/focus에서만 pink accent.
    */

    .start-header-actions {
      display: flex;
      align-items: center;
      gap: var(--imory-space-400);
      flex-shrink: 0;
    }

    .start-theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 28px;
      height: 28px;
      padding: 0;

      background: none;
      border: none;
      border-radius: var(--imory-radius-100);

      color: var(--system-text-muted);

      cursor: pointer;
    }

    .start-theme-toggle:hover,
    .start-theme-toggle:focus-visible {
      color: var(--system-accent);
    }

    .start-theme-toggle:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }

    .start-theme-icon {
      width: 15px;
      height: 15px;
    }

    .start-theme-icon--moon {
      display: none;
    }

    :root[data-theme="dark"] .start-theme-icon--sun {
      display: none;
    }

    :root[data-theme="dark"] .start-theme-icon--moon {
      display: inline-flex;
    }

    .start-sign-in {
      display: inline-flex;
      align-items: center;

      padding: 6px 2px;

      background: none;
      border: none;

      font-family: var(--system-font-family);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      color: var(--system-text-muted);

      white-space: nowrap;

      cursor: pointer;
    }

    .start-sign-in:hover,
    .start-sign-in:focus-visible {
      color: var(--system-accent);
    }

    .start-sign-in:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }

    .start-sign-in:disabled {
      color: var(--system-text-disabled);
      cursor: default;
    }

    @media (max-width: 600px) {

      .start-header {
        padding-top: max(12px, env(safe-area-inset-top));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: 12px;
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .start-logo {
        font-size: 26px;
      }

      .start-header-actions {
        gap: var(--imory-space-300);
      }

    }


    /*
      SIGN IN DIALOG — naru.pub 톤을 그대로 이어받는 작은 각진
      패널. 둥근 앱 스타일 카드나 큰 OAuth 카드를 피하고 제목/안내
      문구/Google 버튼만 담는다. 네이티브 <dialog>가 top-layer
      렌더링·Escape 닫기·포커스 이동을 기본 제공하므로(showModal()),
      바깥 클릭 닫기만 아래 script에서 최소한으로 보탠다. 배경
      dim은 ::backdrop에서 옅은 값(0.25)만 준다.
    */

    .start-signin-dialog {
      position: relative;

      width: min(320px, calc(100vw - 48px));

      margin: auto;
      padding:
        var(--imory-space-600)
        var(--imory-space-500)
        var(--imory-space-500);

      background: var(--system-bg);
      border: 1px solid var(--system-border-strong);
      border-radius: var(--imory-radius-200);

      color: var(--system-text);
    }

    .start-signin-dialog::backdrop {
      background: rgba(0, 0, 0, 0.25);
    }

    .start-signin-dialog-close {
      position: absolute;
      top: var(--imory-space-300);
      right: var(--imory-space-300);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 24px;
      height: 24px;
      padding: 0;

      background: none;
      border: none;

      font-size: 18px;
      line-height: 1;
      color: var(--system-text-muted);

      cursor: pointer;
    }

    .start-signin-dialog-close:hover,
    .start-signin-dialog-close:focus-visible {
      color: var(--system-accent);
    }

    .start-signin-dialog-close:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }

    .start-signin-dialog-title {
      margin: 0 0 var(--imory-space-300);

      font-size: var(--imory-font-size-700);
      font-weight: 500;
      color: var(--system-text-strong);
    }

    .start-signin-dialog-notice {
      margin: 0 0 var(--imory-space-500);
    }

    .start-signin-dialog-notice p {
      margin: 0 0 var(--imory-space-100);

      font-size: var(--imory-font-size-400);
      line-height: var(--imory-line-height-snug);
      color: var(--system-text-muted);
    }

    .start-signin-dialog-notice p:last-child {
      margin-bottom: 0;
    }

    .start-signin-dialog-google {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 44px;
      padding: 0 var(--imory-space-400);

      background: var(--system-bg);
      border: 1px solid var(--system-border-strong);
      border-radius: var(--imory-radius-200);

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-500);
      font-weight: 500;
      color: var(--system-text);

      cursor: pointer;
    }

    .start-signin-dialog-google:hover,
    .start-signin-dialog-google:focus-visible {
      background: var(--system-accent-soft);
      border-color: var(--system-accent-border);
      color: var(--system-accent);
    }

    .start-signin-dialog-google:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }

    .start-signin-dialog-google:disabled {
      color: var(--system-text-disabled);
      cursor: default;
    }


    /*
      HERO BLOCK — 메인 3줄(i + memory = ♡ / 헤드라인 / 설명) +
      운영 안내 + about 진입점. 첫 화면을 채우도록 min-height를
      최소 100dvh로 둬서(헤더 높이만큼 다음 화면으로 자연히
      넘어감) about 섹션은 스크롤해야만 보인다. 화면 정중앙보다
      살짝 위쪽에 놓이도록 padding-bottom을 padding-top보다 크게
      줘서 중앙 정렬 박스 자체를 위로 밀었다("육안상 중앙이 아닌
      느낌" 피드백 반영). 전부 .landing-screen 안에서만 존재해서
      gateHomeByOwner()의 기존 hidden 전환을 그대로 따른다 —
      별도 표시/숨김 로직 없음. --theme-*(사용자 홈페이지 스킨)는
      쓰지 않고 --system-*만 사용해 현재 light/dark 토글에
      자동으로 대응한다.
    */

    .start-hero-block {
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding-top: max(16px, env(safe-area-inset-top));
      padding-right: max(24px, env(safe-area-inset-right));
      padding-bottom: max(180px, env(safe-area-inset-bottom));
      padding-left: max(24px, env(safe-area-inset-left));

      text-align: center;
    }

    /*
      메인 3줄(i + memory = ♡ / 헤드라인 / 설명) + 운영 안내를
      "텍스트 뭉치" 하나로 묶는 래퍼 — 핑크 GLOW(아래 ::before)를
      이 둘을 합친 실제 텍스트 범위 정중앙에 맞추기 위해서다.
      .start-main만 기준으로 뒀을 때는 그 아래 .start-notice까지
      포함한 전체 텍스트 덩어리 중심과 어긋나 보였다 — 이 래퍼가
      둘의 공통 부모가 되어야 position:absolute 중앙 정렬이 실제
      텍스트 뭉치 전체 기준으로 계산된다.
    */

    .start-hero-text {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .start-main {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /*
      텍스트 뭉치(.start-hero-text) 뒤에 까는 핑크 GLOW —
      .home-notice--not-found::before와 완전히 동일한 그라데이션
      (sua 테마 하트 뒤 GLOW를 그대로 재사용한 값, 색상 단계·
      alpha·블러·크기 전부 같음)을 이 블록 뒤에도 재사용한다.
      다만 저기는 뷰포트 중앙에 항상 고정돼야 해서 position:fixed였고,
      여기는 스크롤하면 hero 블록과 함께 자연스럽게 같이 지나가야
      하므로 position:absolute + .start-hero-text(position:relative)
      기준으로 중앙에 둔다.
    */

    .start-hero-text::before {
      content: "";

      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: min(54vw, 370px);
      height: min(54vw, 370px);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 155, 197, 0.35) 0%,
          rgba(255, 180, 211, 0.23) 30%,
          rgba(255, 206, 226, 0.12) 54%,
          rgba(255, 228, 239, 0.05) 70%,
          rgba(255, 244, 249, 0.015) 82%,
          rgba(255, 255, 255, 0) 100%
        );

      filter: blur(20px);

      pointer-events: none;

      z-index: -1;
    }

    .start-main-mark {
      margin: 0;

      font-family: var(--system-font-family);
      font-size: 20px;
      font-weight: 400;
      color: var(--system-accent);
    }

    .start-main-title {
      margin: var(--imory-space-300) 0 0;

      font-family: var(--system-font-family);
      font-size: 24px;
      font-weight: 400;
      line-height: var(--imory-line-height-snug);

      /*
        ★ 예전엔 --system-text-muted(옅은 회색)라 로고("imory",
        --system-text)보다 훨씬 흐려 보였다 — 로고와 같은 톤으로
        올려서 헤드라인/설명이 더 또렷하게 보이도록 함.
      */
      color: var(--system-text);
    }

    .start-main-desc {
      margin: var(--imory-space-300) 0 0;

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-600);
      font-weight: 400;
      line-height: var(--imory-line-height-relaxed);
      color: var(--system-text);
    }

    /*
      메인 3줄과는 확실히 분리되도록 큰 margin-top으로 간격을 둔다.
    */

    .start-notice {
      margin-top: 64px;

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-400);
      font-weight: 400;
      line-height: var(--imory-line-height-relaxed);
      color: var(--system-text-faint);
    }

    .start-notice p {
      margin: 0;
    }

    .start-notice-contact {
      margin-top: var(--imory-space-200);
    }

    .start-notice-link {
      color: var(--system-text-faint);
      text-decoration: none;
    }

    .start-notice-link:hover,
    .start-notice-link:focus-visible {
      color: var(--system-accent);
    }

    .start-notice-link:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }

    /*
      심플 하트 구분선 — 장식은 최소한으로, 얇은 선 2개 사이에
      브랜드 하트(로고 라인의 ♡ 재사용) 하나만 둔다.
    */

    .start-about-divider {
      display: flex;
      align-items: center;
      gap: var(--imory-space-200);

      width: 100%;
      max-width: 120px;
      margin-top: 40px;
    }

    .start-about-divider-line {
      flex: 1;
      height: 1px;
      background: var(--system-border);
    }

    .start-about-divider-heart {
      font-size: 11px;
      line-height: 1;
      color: var(--system-accent);
    }

    .start-about-link {
      display: inline-flex;
      align-items: center;
      gap: var(--imory-space-100);

      margin-top: var(--imory-space-400);
      padding: 6px 2px;

      background: none;
      border: none;

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-400);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--system-text-muted);
      text-decoration: none;

      cursor: pointer;
    }

    .start-about-link:hover,
    .start-about-link:focus-visible {
      color: var(--system-accent);
    }

    .start-about-link:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }

    .start-about-link-arrow {
      font-size: 11px;
    }

    /*
      ABOUT 섹션 — 실제 기능 소개가 들어갈 자리. 지금은 임시
      문구가 담긴 직사각형 컨테이너 3개만 배치한다(내용은 후속
      작업에서 채움). IntersectionObserver(아래 스크립트)가 이
      영역이 뷰포트에 들어올 때 .is-visible을 붙여 순차적으로
      나타나게 한다.

      min-height를 hero block과 똑같이 최소 100dvh로 둔다 — 이
      섹션 자체 콘텐츠(제목+박스 3개)는 이보다 훨씬 짧아서, 이
      값이 없으면 스크롤 가능한 전체 길이가 부족해 "about imory"
      클릭 시 이 섹션의 top을 화면 상단에 맞춰 스크롤하는 게
      물리적으로 불가능했다(맨 아래까지 스크롤해도 섹션의 짧은
      높이 때문에 화면 중간에 걸친 채로 멈춤). 최소 한 화면
      높이를 확보해 "다음 화면"처럼 자연스럽게 전환되게 한다.
    */

    .start-about-section {
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 64px max(24px, env(safe-area-inset-right)) 64px
        max(24px, env(safe-area-inset-left));

      text-align: center;
    }

    .start-about-title {
      margin: 0;

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-700);
      font-weight: 500;
      color: var(--system-text-strong);
    }

    .start-about-boxes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--imory-space-400);

      /*
        .start-about-section이 flex-direction:column이라 이 요소는
        cross-axis(가로) 기준 flex item이다 — margin-left/right:auto로
        가운데 정렬하려면 width를 명시해야 한다(안 그러면 auto
        margin이 stretch를 무시하고 콘텐츠 크기로 줄어들어, 카드
        3개가 한 줄에 안 들어가고 세로로 쌓이는 문제가 있었음).
      */
      width: 100%;
      max-width: 800px;
      margin: var(--imory-space-600) auto 0;
    }

    .start-about-box {
      flex: 1 1 200px;
      max-width: 240px;

      padding: 32px 20px;

      background: var(--system-surface);
      border: 1px solid var(--system-border);
      border-radius: var(--imory-radius-200);

      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .start-about-boxes.is-visible .start-about-box:nth-child(1) {
      transition-delay: 0s;
    }

    .start-about-boxes.is-visible .start-about-box:nth-child(2) {
      transition-delay: 0.1s;
    }

    .start-about-boxes.is-visible .start-about-box:nth-child(3) {
      transition-delay: 0.2s;
    }

    .start-about-boxes.is-visible .start-about-box {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {

      .start-about-box {
        transition: none;
        opacity: 1;
        transform: none;
      }

    }

    .start-about-box-label {
      margin: 0;

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-600);
      font-weight: 500;
      color: var(--system-text-strong);
    }

    .start-about-box-placeholder {
      margin: var(--imory-space-200) 0 0;

      font-family: var(--system-font-family);
      font-size: var(--imory-font-size-400);
      font-weight: 400;
      color: var(--system-text-muted);
    }

    @media (max-width: 600px) {

      .start-hero-block {
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: max(110px, env(safe-area-inset-bottom));
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .start-main-mark {
        font-size: 17px;
      }

      .start-main-title {
        margin-top: var(--imory-space-200);
        font-size: 19px;
      }

      .start-main-desc {
        margin-top: var(--imory-space-200);
        font-size: var(--imory-font-size-500);
      }

      .start-notice {
        margin-top: 40px;
        font-size: var(--imory-font-size-300);
      }

      .start-about-divider {
        margin-top: 28px;
      }

      .start-about-section {
        padding-top: 48px;
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: 48px;
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .start-about-boxes {
        flex-direction: column;
        align-items: center;
      }

      .start-about-box {
        /*
          flex:1 1 200px(기본 규칙)는 가로 배치를 가정한
          flex-basis라, 세로 배치(flex-direction:column)에서는
          같은 200px가 "높이" 기준이 되어 박스가 불필요하게 커진다
          — 세로 배치에서는 콘텐츠 높이에 맞게 flex-basis를 없앤다.
        */
        flex: 0 0 auto;
        width: 100%;
        max-width: 320px;
      }

    }


    /*
      HOME_MODE 렌더러 분기(gateHomeByOwner 아래 스크립트)가
      loadSuaTheme() 대신 그리는 안내 화면 3종(준비 중/존재하지
      않음/조회 실패) 공통 레이아웃. 색상 토큰은 아래
      .home-notice-title/-subtitle/-link 참고 — 특정 사용자의
      커스터마이징 홈이 아니라 Imory 공용 시스템 안내라
      --theme-*가 아닌 --system-*을 쓴다.
    */

    .home-notice {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--imory-space-200);
      padding: var(--imory-space-600);
      text-align: center;
    }

    /*
      home-notice*는 세 안내 상태(customize-empty/not-found/
      load-error) 공용이며 전부 특정 사용자의 커스터마이징 홈이
      아니라 Imory 공용 시스템 안내 화면이다 — 그래서
      --theme-*(사용자 홈페이지 영역용)가 아니라 design-tokens.css에
      정의된 --system-* semantic 토큰을 쓴다.
    */

    .home-notice-title {
      font-size: var(--imory-font-size-700);
      color: var(--system-text);
    }

    .home-notice-subtitle {
      font-size: var(--imory-font-size-600);
      color: var(--system-text-muted);
    }

    /*
      각진 버튼 박스 대신 조용한 텍스트 링크 — 기본 상태는
      배경/테두리/밑줄 없이 muted gray, hover/focus에서만
      --system-accent로 신호하고 밑줄이 붙는다. focus-visible에서
      outline을 직접 그려 키보드 포커스가 항상 보이게 한다
      (core/patterns/tabs.css의 .imory-tab--text 텍스트형
      인터랙션 규칙과 같은 패턴). padding(10px/14px)은 시각적
      크기를 그대로 두면서(배경/테두리 없음) 모바일 탭 영역만
      키우는 투명 여백이라, 그만큼 margin-top을 줄여 subtitle과의
      실제 보이는 간격은 이전과 동일하게 유지한다.
    */

    .home-notice-link {
      display: inline-block;
      margin-top: calc(var(--imory-space-400) - 10px);
      padding: 10px 14px;

      background: none;
      border: none;

      font-size: var(--imory-font-size-200);
      color: var(--system-text-muted);

      text-decoration: none;
    }

    .home-notice-link:hover,
    .home-notice-link:focus-visible {
      color: var(--system-accent);
      text-decoration: underline;
    }

    .home-notice-link:focus-visible {
      outline: 1px solid var(--system-accent);
      outline-offset: 2px;
    }


    /*
      "존재하지 않는 홈이에요" 안내 전용 배경 원형 — sua 테마의
      하트 뒤 핑크 GLOW(themes/sua/heart-interaction.css의
      .heart-stage::before, radial-gradient 색상 단계 그대로)를
      재사용하되, 문구를 압도하지 않도록 이 화면 전용으로 더
      작고 흐리고 옅게 조정했다(alpha를 원본의 약 60%로 낮춤,
      blur 14px→20px, 크기 71vw/496px→54vw/370px). sua DOM/
      스크립트는 전혀 로드하지 않고, 이 화면에서만 순수 CSS로
      시각적 느낌만 재현한다. position:fixed로 뷰포트 정중앙에
      고정해 데스크톱/모바일 어디서든 화면 중앙을 유지하고,
      문서 스크롤 영역에는 영향을 주지 않는다(뷰포트 기준
      위치라 overflow 유발 없음). z-index:-1은 .home-notice의
      일반 흐름 자식(문구/링크, z-index:auto)보다 항상 아래에
      그려진다 — 이 화면엔 겹칠 만한 다른 fixed 요소(footer/메뉴
      등)가 전부 숨겨져 있어 안전하다.
    */

    .home-notice--not-found::before {
      content: "";

      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: min(54vw, 370px);
      height: min(54vw, 370px);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 155, 197, 0.35) 0%,
          rgba(255, 180, 211, 0.23) 30%,
          rgba(255, 206, 226, 0.12) 54%,
          rgba(255, 228, 239, 0.05) 70%,
          rgba(255, 244, 249, 0.015) 82%,
          rgba(255, 255, 255, 0) 100%
        );

      filter: blur(20px);

      pointer-events: none;

      z-index: -1;
    }

  </style>

</head>


<body>



  <!-- =========================================================
       LANDING (공개 시작 페이지)

       /:slug 없이 루트로 접속했을 때만 보이는 화면. 아래 MAIN
       JS의 gateHomeByOwner()가 첫 path segment(slug) 존재
       여부에 따라 이 화면과 실제 홈 UI(메뉴/뷰어/푸터/BGM 등)
       중 하나만 보이게 전환한다 — 이 블록 내부는 그 전환 로직과
       무관하게 헤더/메인 3줄/운영 안내/about 진입점 마크업만
       담당한다.
  ========================================================== -->

  <div
    class="landing-screen"
    id="landingScreen"
  >

    <header class="start-header">

      <div class="start-header-inner">

        <a
          class="start-logo"
          href="/"
        >imory</a>


        <div class="start-header-actions">

          <button
            type="button"
            class="start-theme-toggle"
            id="startThemeToggle"
            aria-label="다크 모드로 전환"
          >

            <svg
              class="start-theme-icon start-theme-icon--sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <line x1="12" y1="2" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>

            <svg
              class="start-theme-icon start-theme-icon--moon"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 1 0 20.354 15.354Z"></path>
            </svg>

          </button>


          <button
            type="button"
            class="start-sign-in"
            id="startSignIn"
          >SIGN IN</button>

        </div>

    #startSignInDialog(네이티브 <dialog>)를 먼저 연다. 실제
    authSignInWithGoogle() 호출은 그 안의 "Google로 계속하기"
    버튼(#startSignInGoogleButton)으로 미뤄진다 — core/lib/
    auth-shared.js의 authSignInWithGoogle()를 admin-session.js와
    동일한 redirectTo(`${origin}/auth/`)로 그대로 호출하며, callback
    분기/onboarding·admin 이동 로직은 auth/auth-callback.js가 그대로
    처리한다(변경 없음).

    signup_opens_at/signup_closes_at 같은 원문 컬럼은 이 dialog에서
    전혀 읽지 않는다(브라우저 시각 비교 금지) — auth-callback.js와
    동일하게 public.get_signup_availability() RPC(boolean만 반환,
    fail-closed)만 사용해 안내 문구(#startSignInDialogNotice)를
    채운다. 가입이 닫혀 있거나 RPC 자체가 실패해도 기존 회원 로그인은
    항상 가능해야 하므로 Google 버튼(#startSignInGoogleButton)은
    이 판정과 무관하게 절대 비활성화/숨김하지 않는다(요구사항).

    RPC는 dialog를 처음 열 때 한 번만 호출하고 결과를 페이지 세션
    동안 메모리에 캐시한다(재방문마다 다시 열어도 재호출 안 함) —
    다만 오류 결과는 캐시하지 않고 다음에 다시 열 때 재시도한다
    (일시적 네트워크 오류가 계속 오류 문구로 굳어지지 않도록).
  -->

  <script src="./core/theme-toggle.js"></script>

  <script>

    (function initStartSignIn() {

      const signInButton =
        document.getElementById(
          "startSignIn"
        );

      const signInDialog =
        document.getElementById(
          "startSignInDialog"
        );

      const signInDialogClose =
        document.getElementById(
          "startSignInDialogClose"
        );

      const signInDialogNotice =
        document.getElementById(
          "startSignInDialogNotice"
        );

      const googleButton =
        document.getElementById(
          "startSignInGoogleButton"
        );


      if (
        !signInButton ||
        !signInDialog ||
        !signInDialogClose ||
        !signInDialogNotice ||
        !googleButton
      ) {
        return;
      }


      /*
        가입 가능 여부 안내 문구 — public.get_signup_availability()
        RPC(boolean만 반환) 결과를 #startSignInDialogNotice에 반영한다.
        signupAvailabilityCache는 페이지 세션 동안의 짧은 캐시로,
        dialog를 다시 열 때마다 RPC를 재호출하지 않기 위함이다.
        오류(status === "error")는 캐시하지 않아 다음에 열 때 재시도한다.
        signupAvailabilityPromise는 진행 중인 호출이 있을 때 중복
        요청을 막기 위한 dedupe용.
      */

      const SIGNIN_NOTICE_MESSAGES = {
        loading: [
          "회원가입 가능 여부를 확인하고 있어요..."
        ],
        available: [
          "현재 신규 회원가입이 가능합니다."
        ],
        closed: [
          "현재는 신규 회원가입 기간이 아닙니다.",
          "기존 회원은 계속 로그인할 수 있어요."
        ],
        error: [
          "회원가입 상태를 확인하지 못했습니다.",
          "기존 회원은 계속 로그인할 수 있어요."
        ]
      };

      let signupAvailabilityCache =
        null;

      let signupAvailabilityPromise =
        null;


      function renderSignInDialogNotice(
        status
      ) {

        signInDialogNotice.innerHTML =
          SIGNIN_NOTICE_MESSAGES[status]
            .map(
              (line) =>
                `<p>${line}</p>`
            )
            .join("");

      }


      function loadSignupAvailability() {

        if (signupAvailabilityCache) {

          renderSignInDialogNotice(
            signupAvailabilityCache
          );

          return;

        }


        renderSignInDialogNotice(
          "loading"
        );


        if (!signupAvailabilityPromise) {

          signupAvailabilityPromise =
            supabaseClient
              .rpc(
                "get_signup_availability"
              )
              .then(
                ({
                  data,
                  error
                }) => {

                  if (error) {

                    console.error(
                      "signup availability check error:",
                      error
                    );

                    return "error";

                  }

                  return data
                    ? "available"
                    : "closed";

                }
              )
              .finally(
                () => {

                  signupAvailabilityPromise =
                    null;

                }
              );

        }


        signupAvailabilityPromise.then(
          (status) => {

            if (status !== "error") {

              signupAvailabilityCache =
                status;

            }

            renderSignInDialogNotice(
              status
            );

          }
        );

      }


      signInButton.addEventListener(
        "click",
        () => {

          signInDialog.showModal();

          loadSignupAvailability();

        }
      );


      signInDialogClose.addEventListener(
        "click",
        () => {

          signInDialog.close();

        }
      );


      /*
        바깥(backdrop) 클릭 닫기 — showModal() 상태의 <dialog>는
        패딩 박스 바깥(backdrop 영역)을 클릭해도 click 이벤트 자체는
        dialog 요소에서 발생하고 event.target이 dialog 자신이 된다.
        안쪽 콘텐츠(제목/버튼 등)를 클릭하면 target이 항상 그
        자식이므로 이 조건에 걸리지 않는다. Escape 닫기는 네이티브
        <dialog> 기본 동작이라 별도 처리 불필요.
      */

      signInDialog.addEventListener(
        "click",
        (event) => {

          if (
            event.target ===
              signInDialog
          ) {

            signInDialog.close();

          }

        }
      );


      googleButton.addEventListener(
        "click",
        async () => {

          googleButton.disabled =
            true;


          const redirectUrl =
            `${window.location.origin}/auth/`;


          const {
            error
          } =
            await authSignInWithGoogle(
              redirectUrl
            );


          if (error) {

            console.error(
              "Google login error:",
              error
            );

            googleButton.disabled =
              false;

          }

        }
      );

    })();

  </script>


  <!--
    ABOUT REVEAL

    1. "about imory" 클릭 시 #start-about를 컨테이너(.landing-screen)
       기준 상단에 맞춰 스크롤한다. 네이티브 해시 이동(href만)에
       맡기면 대상이 폴드 바로 아래(첫 화면 min-height:100dvh
       + padding-bottom 만큼만 벗어남)라 브라우저가 최소 이동만
       하고 멈춰 섹션이 애매하게 걸치는 문제가 있어, scrollIntoView
       (block:"start")로 명시한다 — JS 비활성 환경 대비 href는
       유지(최소한 근처로는 이동).
    2. 그 섹션이 실제로 화면에 들어올 때 3개 박스에 .is-visible만
       붙여 순차 등장(transition-delay는 CSS)시킨다 —
       IntersectionObserver 1회성 관찰이라 scroll 이벤트 폴링이
       아니다.
  -->

  <script>

    (function initAboutScroll() {

      const aboutLink =
        document.querySelector(
          ".start-about-link"
        );

      const aboutSection =
        document.getElementById(
          "start-about"
        );

      if (
        !aboutLink ||
        !aboutSection
      ) {
        return;
      }


      const prefersReducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;


      aboutLink.addEventListener(
        "click",
        event => {

          event.preventDefault();

          aboutSection.scrollIntoView(
            {
              behavior:
                prefersReducedMotion
                  ? "auto"
                  : "smooth",
              block: "start"
            }
          );

        }
      );

    })();


    (function initAboutReveal() {

      const boxes =
        document.querySelector(
          ".start-about-boxes"
        );

      if (!boxes) {
        return;
      }


      if (!("IntersectionObserver" in window)) {

        boxes.classList.add(
          "is-visible"
        );

        return;

      }


      const observer =
        new IntersectionObserver(
          entries => {

            entries.forEach(
              entry => {

                if (entry.isIntersecting) {

                  boxes.classList.add(
                    "is-visible"
                  );

                  observer.disconnect();

                }

              }
            );

          },
          {
            threshold: 0.2
          }
        );


      observer.observe(
        boxes
      );

    })();

  </script>

  <!-- =========================================================
       HOME 게이팅

       루트(/)는 slug 없이 들어오면 위 LANDING 화면만 보여주고
       sua 테마/카테고리/BGM/메뉴는 아예 불러오지 않는다. 첫 path
       segment가 slug면(유효 여부는 각 스크립트 내부의 owner
       resolver가 판단) 기존 공개 홈 구조를 그대로 불러온다.
       posts 모듈은 이 게이팅과 무관하게 기존대로 그대로 로드한다
       (건드리지 않음) — 랜딩 화면에서는 어차피 위에서 hidden
       처리되어 있어 화면에 보이지 않는다.

       site-footer.js(today/total 방문자 + copyright, sua 전용
       footer)는 더 이상 여기서 무조건 로드하지 않는다 — HOME
       MODE 렌더러 분기(아래 SUA THEME LOADER 스크립트의
       initHomeRenderer)가 owner.status==='found' &&
       owner.homeMode==='legacy_sua'로 확인된 사이트에서만 동적으로
       로드한다(글/카테고리 등 그 사이트의 모든 화면 포함, 존재하지
       않는 slug/조회 실패/customize/예상 밖 home_mode에서는 로드
       안 함). 방문자 카운터 RPC가 site-footer.js 로드 즉시
       실행되므로, "로드 자체를 안 한다"가 그런 화면에서 카운터가
       도는 것을 막는다.
  ========================================================== -->

  <script>

    (function gateHomeByOwner() {

      const hasOwner =
        Boolean(
          getSiteOwnerSlugFromPath()
        );


      const landingScreen =
        document.getElementById(
          "landingScreen"
        );


      if (!hasOwner) {

        if (landingScreen) {

          landingScreen.hidden =
            false;

        }

        return;

      }


      if (landingScreen) {

        landingScreen.hidden =
          true;

      }


      [
        "viewerArea",
        "postsMount"
      ].forEach(
        id => {

          const el =
            document.getElementById(
              id
            );


          if (el) {

            el.hidden =
              false;

          }

        }
      );


      /*
        .site-footer(today/total 방문자 + copyright), menuButton/
        menuPanel(카테고리 메뉴 토글), musicButton/youtubePlayerShell
        (BGM)은 전부 여기서 무조건 unhide하지 않는다 — 셋 다
        owner.status==='found' && owner.homeMode==='legacy_sua'
        확인된 뒤에만 initHomeRenderer()의 legacy_sua 분기
        (showLegacySuaChrome)가 unhide한다. hasOwner(slug 존재
        여부)만으로는 존재하지 않는 slug/customize에서도 이 UI들이
        보이던 문제가 있었다(musicButton/youtubePlayerShell은
        기존에 바로 이 자리에서 무조건 unhide되고 있었음 — 다중
        사용자 전환 과정에서 footer/menu만 legacy 전용으로
        옮겨지고 이 둘은 누락됐던 것으로 보임. 이번에 함께
        정리). viewerArea/postsMount는 renderHomeNotice()의 안내
        화면과 customize 렌더 결과도 그 안에 그려야 하므로 계속
        무조건 unhide한다(그대로 유지).
      */


      window.homeOwnerModeActive =
        true;


      /*
        home/site-meta.js(blog_title/favicon/cursor)만 여기서
        무조건 로드한다 — sua/customize 어느 쪽 마크업에도 기대지
        않는 순수 site_settings 조회 + <title>/<link>/<style>
        갱신이라 home_mode와 무관하게 항상 필요하다(site-meta.js
        헤더 주석 참고: owner slug 조회 실패 시 스스로 아무 것도
        안 하고 정적 기본값을 유지하므로 not_found/error에서도
        안전).

        home/categories.js(카테고리 메뉴 목록 조회) / home/bgm.js
        (BGM 버튼 + site_settings 조회) / home/menu.js(메뉴 토글 +
        스크롤 숨김) / core/view-controller.js(cover↔profile 상태,
        sua의 heart-interaction.js/cover-profile.js만 구독)는 전부
        legacy_sua 전용 UI(menuPanel/musicButton/heart 등)에만
        연결되어 있어 initHomeRenderer()의 legacy_sua 분기
        (loadLegacySuaCommonScripts, 아래)로 옮겼다 — customize/
        not_found/error에서 categories.js가 (보이지도 않는)
        menuPanel을 채우려고 불필요한 DB 조회를 실행하거나,
        bgm.js가 musicButton을 노출시키며 site_settings를 조회하는
        낭비를 막기 위함(둘 다 side effect 없는 순수 DOM 스크립트가
        아니라 로드 즉시 쿼리를 실행함 — home/bgm.js 파일 하단의
        loadBgmSetting() 즉시 호출, home/categories.js의
        loadCategories() 호출부 참고). 나중에 customize 홈에도
        카테고리/글 목록 진입 UI가 생기면, 그 시점에
        home/categories.js를 customize 분기에도 별도로 로드하면
        된다(순수 함수라 두 분기에서 각자 로드해도 문제 없음).
      */

      const script =
        document.createElement(
          "script"
        );


      script.src =
        "./home/site-meta.js";


      script.async =
        false;


      document.body.appendChild(
        script
      );

    })();

  </script>

  <script>

    async function loadSuaTheme() {

        document.getElementById(
          "themeMount"
        );

      const themeLoveMount =
        document.getElementById(
          "themeLoveMount"
        );


      if (
        !themeMount ||
        !themeLoveMount
      ) {
        return;
      }


      try {

        const response =
          await fetch(
            `./themes/sua/sua-home.html?v=${cacheBuster}`
          );


        if (!response.ok) {

          throw new Error(
            `sua-home.html load failed: ${response.status}`
          );

        }


        const suaHTML =
          await response.text();


        const template =
          document.createElement(
            "template"
          );

        template.innerHTML =
          suaHTML;


        const heartGroup =
          template.content.getElementById(
            "heartGroup"
          );

        const loveEvent =
          template.content.getElementById(
            "loveEvent"
          );


        /*
          sua-home.html 조각이 손상됐거나(예: 서버 설정에 따라
          다른 페이지가 대신 반환되는 경우) 예상한 두 필수 요소가
          없으면, 그 상태로 heart-interaction.js/cover-profile.js를
          로드하지 않는다 — 두 스크립트 모두 로드 즉시
          getElementById로 이 요소들의 자손을 찾아
          addEventListener하므로, 없는 채로 실행하면 null 참조
          오류가 연쇄로 발생한다. 원본 HTML이나 예외 내용은 화면에
          내지 않고, 이미 있는 안내 화면(HOME_NOTICE_TEXT의
          "load-error")으로 안전하게 떨어진다.
        */

        if (
          !heartGroup ||
          !loveEvent
        ) {

          console.error(
            "sua theme load failed: sua-home.html에 필수 요소(heartGroup/loveEvent)가 없습니다"
          );

          renderHomeNotice(
            "load-error"
          );

          return;

        }


        themeMount.replaceWith(
          heartGroup
        );

        themeLoveMount.replaceWith(
          loveEvent
        );


        /*
          sua DOM 주입이 끝난 뒤에만 실행돼야 함 —
          heart-interaction.js와 cover-profile.js는 둘 다
          모듈이 아니라 로드 즉시 getElementById/
          addEventListener를 호출하는 스크립트라, DOM보다
          먼저/늦게 실행되면 회귀가 생긴다.
        */

        const suaScripts =
          [
            "./themes/sua/heart-interaction.js",
            "./themes/sua/cover-profile.js"
          ];


        for (
          const src of suaScripts
        ) {

          const suaScript =
            document.createElement(
              "script"
            );


          suaScript.src =
            `${src}?v=${cacheBuster}`;


          await new Promise(
            (resolve, reject) => {

              suaScript.onload =
                resolve;


              suaScript.onerror =
                reject;


              document.body.appendChild(
                suaScript
              );

            }
          );

        }


        console.log(
          "sua theme loaded"
        );

      }


      catch (error) {

        console.error(
          "sua theme load failed:",
          error
        );

      }

    }

    /*
      legacy_sua 전용 공통 스크립트(categories/bgm/menu/
      view-controller) — 위 gateHomeByOwner 주석에서 옮긴 이유를
      설명함. bgm.js가 선언하는 musicButton 전역을 menu.js가
      참조하므로(menu.js 파일 헤더 주석) 이 순서(categories → bgm →
      menu → view-controller)를 그대로 유지해야 한다. sua theme
      스크립트(heart-interaction.js/cover-profile.js)처럼 순차
      로드가 필요해 Promise 체인으로 하나씩 로드한다.

      동일 페이지에서 initHomeRenderer()가 중복 호출되는 경우에
      대비해 Promise를 캐싱한다 — 두 번째 호출은 스크립트를 다시
      추가하지 않고 첫 호출의 완료를 그대로 기다린다.
    */

    let legacySuaCommonScriptsPromise =
      null;

    function loadLegacySuaCommonScripts() {

      if (legacySuaCommonScriptsPromise) {

        return legacySuaCommonScriptsPromise;

      }

      const srcs =
        [
          "./home/categories.js",
          "./home/bgm.js",
          "./home/menu.js",
          "./core/view-controller.js"
        ];

      legacySuaCommonScriptsPromise =
        (async () => {

          for (const src of srcs) {

            await new Promise(
              (resolve, reject) => {

                const script =
                  document.createElement(
                    "script"
                  );

                script.src =
                  src;

                script.onload =
                  resolve;

                script.onerror =
                  reject;

                document.body.appendChild(
                  script
                );

              }
            );

          }

        })();

      return legacySuaCommonScriptsPromise;

    }


    /* =========================================================
       CUSTOMIZE HOME RENDERER

       owner.homeMode === "customize"인 사이트의 공개 홈을
       home_customize.layout_json으로부터 렌더한다.

       ★ 핵심 원칙: editor preview(customize/editor/editor.js →
       preview-frame.html)와 완전히 동일한 공용 renderer
       (customize/renderer/render-layout.js의 renderCustomizeLayout)를
       그대로 재사용한다 — public home 전용 renderer를 새로 만들지
       않는다. mode만 "view"로 다르게 넘긴다(editor는 "edit").

       customize/editor/editor.js, editor.css, preview-frame.html은
       여기서 절대 로드하지 않는다 — 드래그/선택/저장 등 편집
       전용 로직과 CSS이며 public 방문자에게 필요 없다.
    ========================================================== */

    const CUSTOMIZE_RENDERER_SCRIPT_SRCS =
      [
        "./customize/renderer/block-defaults.js",
        "./customize/renderer/theme-tokens.js",
        "./customize/renderer/validate-layout.js",
        "./customize/renderer/render-layout.js"
      ];

    /*
      renderer 스크립트 로드도 Promise 캐싱 — initHomeRenderer()가
      한 페이지에서 중복 호출되더라도 script 태그를 두 번 추가하지
      않는다(legacySuaCommonScriptsPromise와 동일한 패턴).
    */

    let customizeRendererScriptsPromise =
      null;

    function loadCustomizeRendererScripts() {

      if (customizeRendererScriptsPromise) {

        return customizeRendererScriptsPromise;

      }

      customizeRendererScriptsPromise =
        (async () => {

          for (const src of CUSTOMIZE_RENDERER_SCRIPT_SRCS) {

            await new Promise(
              (resolve, reject) => {

                const script =
                  document.createElement(
                    "script"
                  );

                script.src =
                  src;

                script.onload =
                  resolve;

                script.onerror =
                  reject;

                document.body.appendChild(
                  script
                );

              }
            );

          }

        })();

      return customizeRendererScriptsPromise;

    }


    /*
      validateCustomizeLayout()의 errors는 두 종류를 함께 담는다
      (customize/renderer/validate-layout.js 참고):

      1) block/필드 단위 안전한 대체 — 알 수 없는 block type 제거,
         범위 밖 숫자 clamp, 잘못된 enum/색상/URL을 기본값으로
         대체 등. 이 경우 layout 전체는 여전히 정상적으로 그릴 수
         있는 결과다(editor도 이 결과를 그대로 렌더함 — valid와
         무관하게 항상 layout을 사용).

      2) top-level(문서 전체) 단위 치명적 실패 — 아래 세 code만
         해당:
           - "invalid-root": rawLayout 자체가 객체가 아님
           - "unsupported-version": layout_json.version이 현재
             CUSTOMIZE_LAYOUT_VERSION과 다름(마이그레이션 로직
             없음)
           - "invalid-blocks": blocks가 배열이 아니어서 통째로
             빈 배열로 대체됨
         이 세 code는 "이 문서가 근본적으로 해석 불가능하다"는
         뜻이라, validator가 안전하게 만들어준 빈 layout을 그대로
         렌더하면 "저장된 내용이 있는데 빈 홈처럼 보임"이 된다 —
         customize-empty(정상적으로 아직 안 채운 상태)와 구분해야
         하므로 이 경우는 load-error로 처리한다.

      단순히 validation.valid(errors.length===0)만 보면 안 되는
      이유: 정상적으로 렌더 가능한 대부분의 "필드 하나 잘못됨"
      케이스도 valid는 false가 되므로(editor는 이 경우도 그냥
      렌더함), valid만으로는 위 두 경우를 구분할 수 없다.
    */

    const CUSTOMIZE_PUBLIC_HOME_FATAL_ERROR_CODES =
      [
        "invalid-root",
        "unsupported-version",
        "invalid-blocks"
      ];

    function isCustomizeLayoutFatallyInvalid(
      validation
    ) {

      return validation.errors.some(
        error =>
          CUSTOMIZE_PUBLIC_HOME_FATAL_ERROR_CODES.includes(
            error.code
          )
      );

    }


    async function renderCustomizeHome(
      ownerId
    ) {

      try {

        await loadCustomizeRendererScripts();

      } catch (error) {

        console.error(
          "customize renderer script load failed:",
          error
        );

        renderHomeNotice(
          "load-error"
        );

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("home_customize")
          .select("layout_json")
          .eq("user_id", ownerId)
          .maybeSingle();


      if (error) {

        console.error(
          "customize home load error:",
          error
        );

        renderHomeNotice(
          "load-error"
        );

        return;

      }


      if (!data) {

        /*
          home_customize는 onboarding(complete_onboarding RPC)이
          항상 만들어 두므로, row 자체가 없는 건 "아직 커스터마이즈
          안 함"(정상 empty)이 아니라 데이터 이상 상태다 —
          customize-empty가 아니라 load-error로 취급한다(customize/
          editor/editor.js의 CUSTOMIZE_LOAD_STATUS.ROW_MISSING과
          동일한 판단 기준).
        */

        console.error(
          "customize home: home_customize row missing for user",
          ownerId
        );

        renderHomeNotice(
          "load-error"
        );

        return;

      }


      const rawLayoutJson =
        data.layout_json;

      const hasUsableLayoutJson =
        rawLayoutJson !== null &&
        typeof rawLayoutJson === "object" &&
        !Array.isArray(rawLayoutJson);

      if (!hasUsableLayoutJson) {

        renderHomeNotice(
          "customize-empty"
        );

        return;

      }


      const validation =
        validateCustomizeLayout(
          rawLayoutJson
        );

      if (
        isCustomizeLayoutFatallyInvalid(
          validation
        )
      ) {

        console.error(
          "customize home: layout_json fatally invalid:",
          validation.errors
        );

        renderHomeNotice(
          "load-error"
        );

        return;

      }


      const themeMount =
        document.getElementById(
          "themeMount"
        );

      if (!themeMount) {
        return;
      }


      renderCustomizeLayout(
        {
          container: themeMount,
          blocks: validation.layout.blocks,
          theme: validation.layout.theme,
          contentArea: validation.layout.contentArea,
          mode: "view",
          actions: {}
        }
      );

    }


    /* =========================================================
       HOME MODE 렌더러 분기 (3-way)
    ========================================================== */

    /*
      published Skin(Slice 4) 우선 시도 — profiles.home_mode에
      새 enum을 추가하지 않고, "이 사용자에게 새 skins published
      row가 있는가"만으로 우선순위를 가른다
      (AI_SKIN_PHASE1A_DESIGN.md 9-1절). 실패하면(published 없음/
      RPC 에러/렌더 실패 전부 포함) 반드시 false를 반환하도록
      skin-home.js가 보장하므로, 여기서는 그 결과만 보고 기존
      legacy 분기로 자연스럽게 흘러가게 둔다 — 새 Skin 시스템
      장애가 기존 사용자의 HOME까지 깨뜨리지 않는다.
    */

    async function tryRenderPublishedSkinHome(ownerId) {

      const themeMount =
        document.getElementById(
          "themeMount"
        );

      if (!themeMount) {
        return false;
      }

      let renderPublishedSkinHome;

      try {

        renderPublishedSkinHome =
          await window.skinHomeReady;

      } catch (err) {

        console.error(
          "[index] skin-home module failed to load",
          err
        );

        return false;

      }

      try {

        return await renderPublishedSkinHome({
          ownerId,
          container: themeMount
        });

      } catch (err) {

        console.error(
          "[index] renderPublishedSkinHome threw unexpectedly",
          err
        );

        return false;

      }

    }


    async function initHomeRenderer() {

      const owner =
        await getSiteOwner();


      /*
        본인 HOME + active Skin 없음일 때만 뜨는 꾸미기 유도
        popup(AI_SKIN_PHASE1B_DESIGN.md 4절) — 아래 HOME 렌더
        분기(published Skin/legacy_sua/customize/notice) 전부와
        무관하게 항상 시도한다. fire-and-forget: 이 popup의
        성공/실패가 HOME 렌더링 자체를 막아서는 안 된다.
      */

      if (
        owner.status === "found" &&
        owner.ownerId &&
        typeof initHomeSkinPrompt === "function"
      ) {

        initHomeSkinPrompt(
          owner.ownerId
        )
          .catch(
            (err) => {

              console.error(
                "[index] initHomeSkinPrompt failed",
                err
              );

            }
          );

      }


      if (
        owner.status === "found" &&
        owner.ownerId
      ) {

        const renderedPublishedSkin =
          await tryRenderPublishedSkinHome(
            owner.ownerId
          );

        if (renderedPublishedSkin) {
          return;
        }

      }


      if (
        owner.status === "found" &&
        owner.homeMode === "legacy_sua"
      ) {

        loadLegacySuaCommonScripts();

        loadSuaTheme();

        showLegacySuaChrome();

        return;

      }


      if (
        owner.status === "found" &&
        owner.homeMode === "customize"
      ) {

        await renderCustomizeHome(
          owner.ownerId
        );

        return;

      }


      /*
        여기 도달하는 경우: not_found / error / (found인데 homeMode가
        legacy_sua도 customize도 아닌 예상 밖 값 — DB 체크 제약상
        사실상 불가능하지만 방어적으로 load-error 취급, 기존 동작과
        동일).
      */

      renderHomeNotice(
        owner.status === "not_found"
          ? "not-found"
          : "load-error"
      );

    }


    if (
      window.homeOwnerModeActive
    ) {

      initHomeRenderer();

    }

  </script>



  <!-- =========================================================
       POSTS LOADER

       1. posts.html 불러오기
       2. #postsMount 안에 삽입
       3. 그 다음 posts.js 실행

       순서 중요!
  ========================================================== -->

  <script>

    /*
      loadPostsModule()을 두 곳(idle prewarm, 혹시 모를 재호출)
      에서 불러도 posts.html/스크립트를 두 번 fetch하지 않도록
      Promise를 캐싱한다 — 이미 호출됐으면(성공/실패 무관, 진행
      중이든 끝났든) 그 Promise를 그대로 돌려준다.
    */

    let postsModulePromise =
      null;


    function loadPostsModule() {

      if (postsModulePromise) {

        return postsModulePromise;

      }


      postsModulePromise =
        runLoadPostsModule();


      return postsModulePromise;

    }


    async function runLoadPostsModule() {

      const loadStartedAt =
        performance.now();


      /*
        ★ 모바일 브라우저(특히 인앱 웹뷰)가 posts.html/*.js를
        너무 적극적으로 캐싱해서, 새로 배포해도 예전 코드가
        계속 실행되는 문제가 있었다. 매 로드마다 값이 바뀌는
        쿼리스트링을 붙여서 항상 최신 파일을 받아오게 한다.
      */

      const cacheBuster =
        Date.now();


      const postsMount =
        document.getElementById(
          "postsMount"
        );


      if (!postsMount) {
        return;
      }


      try {

        /* ---------------------------------------------
           POSTS HTML 불러오기
        ---------------------------------------------- */

        const response =
          await fetch(
            `./posts/posts.html?v=${cacheBuster}`
          );


        if (!response.ok) {

          throw new Error(
            `posts.html load failed: ${response.status}`
          );

        }


        const postsHTML =
          await response.text();


        /* ---------------------------------------------
           POSTS HTML 삽입
        ---------------------------------------------- */

        postsMount.innerHTML =
          postsHTML;


        /*
          posts.html 안의 footer(오늘 방문자/copyright)도
          site-footer.js가 이미 알고 있는 값으로 채움.
        */

        if (
          typeof refreshSiteFooterMarkers ===
          "function"
        ) {

          refreshSiteFooterMarkers();

        }


        /* ---------------------------------------------
           POSTS JS 실행

           HTML이 전부 들어온 다음에만 실행한다.

           posts-sanitize.js는 posts.js가 쓰는
           HTML 정화 함수들이 들어있어서
           posts.js보다 먼저 로드되어야 한다.
        ---------------------------------------------- */

        const postsDependencyScripts =
          [
            "./posts/posts-sanitize.js",
            "./posts/posts-format.js",
            "./posts/posts-reader-scale.js",
            "./posts/style/posts-style-preset.js",
            "./posts/style/posts-style-dialogue.js",
            "./posts/style/posts-style-render.js",
            "./posts/editor/format/posts-editor.js",
            "./posts/editor/format/posts-editor-highlight.js",
            "./posts/editor/format/posts-editor-mode.js",
            "./posts/preview/posts-preview-settings.js",
            "./posts/preview/posts-preview-css-vars.js",
            "./posts/preview/posts-preview.js",
            "./posts/preview/posts-preview-paginate.js",
            "./posts/export/posts-preview-export-capture.js",
            "./posts/export/posts-preview-export-section.js",
            "./posts/export/posts-preview-export.js",
            "./posts/preview/posts-preview-mobile.js",
            "./posts/posts-view-html-fit.js",

            /*
              옛 posts-view.js(2200줄+)를 기능별로 쪼갠 파일들.
              전부 함수 정의뿐이고 즉시 실행되는 코드가 없어서
              posts/editor/posts-refs.js보다 먼저 로드돼도 상관없음
              (실제 호출은 다 나중에, 모든 스크립트가 로드된 뒤
              posts-router-init.js가 실행될 때 일어남).
            */

            "./posts/view/posts-view-transition.js",
            "./posts/view/posts-view-list.js",
            "./posts/view/posts-view-list-select.js",
            "./posts/view/posts-view-banner.js",
            "./posts/view/posts-view-banner-form.js",
            "./posts/view/posts-view-detail.js",
            "./posts/view/posts-view-secret-gate.js",
            "./posts/view/posts-view-editor-load.js",

            /*
              옛 posts.js(3200줄+)를 기능별로 쪼갠 파일들.
              posts-refs.js가 DOM 참조/상태를 담고 있어서
              반드시 이 그룹의 맨 처음, posts-router-init.js가
              startPostRouter() 등 실제 실행부라 반드시
              맨 마지막이어야 함.
            */

            "./posts/editor/posts-refs.js",
            "./posts/editor/posts-state.js",
            "./posts/editor/posts-list-detail-nav.js",
            "./posts/editor/posts-richtext-events.js",
            "./posts/editor/posts-editor-undo.js",
            "./posts/editor/posts-highlight-toolbar.js",
            "./posts/editor/posts-toolbar-toggles.js",
            "./posts/editor/posts-save.js",
            "./posts/editor/posts-router-init.js"
          ];


        const dependencyLoads =
          postsDependencyScripts.map(
            src =>
              new Promise(
                (resolve, reject) => {

                  const dependencyScript =
                    document.createElement(
                      "script"
                    );


                  /*
                    동적 script는 기본적으로 async라 실행 순서가
                    뒤섞일 수 있다. async=false면 목록 순서대로
                    실행하면서도 파일 다운로드 자체는 동시에
                    시작되어, 30여 번의 네트워크 왕복을 차례로
                    기다리던 지연만 없앨 수 있다.
                  */

                  dependencyScript.async =
                    false;


                  dependencyScript.src =
                    `${src}?v=${cacheBuster}`;


                  dependencyScript.onload =
                    resolve;


                  dependencyScript.onerror =
                    reject;


                  document.body.appendChild(
                    dependencyScript
                  );

                }
              )
          );


        await Promise.all(
          dependencyLoads
        );


        console.log(
          `posts module loaded (${Math.round(performance.now() - loadStartedAt)}ms)`
        );

      }


      catch (error) {

        console.error(
          "posts module load failed:",
          error
        );

      }

    }


    /*
      posts 모듈이 아직 준비되지 않은 첫 클릭도 브라우저의
      기본 링크 이동(전체 새로고침)으로 보내지 않는다. 모듈
      로딩이 끝나는 즉시 같은 카테고리를 SPA 화면으로 연다.
      모듈 준비 후에는 posts-list-detail-nav.js의 정식 핸들러가
      담당하므로 여기서는 아무것도 하지 않는다.
    */

    document
      .getElementById(
        "categoryMenuLinks"
      )
      ?.addEventListener(
        "click",
        async event => {

          const link =
            event.target.closest(
              "a[data-category-id]"
            );


          if (
            !link ||
            typeof openCategoryPage ===
              "function"
          ) {
            return;
          }


          event.preventDefault();


          const categoryId =
            link.dataset.categoryId;


          await loadPostsModule();


          if (
            typeof openCategoryPage ===
              "function"
          ) {

            await openCategoryPage(
              categoryId
            );

          }

        }
      );


    /* =========================================================
       POSTS 모듈 IDLE PREWARM

       예전엔 loadPostsModule()을 여기서 바로(동기적으로) 호출해서
       홈 렌더용 리소스(폰트/3D 모델/sua 테마/Supabase 조회 등)와
       네트워크를 두고 경쟁했다 — 카테고리를 처음 클릭했을 때만
       느린 것도 이 경쟁 때문에 posts.html + 30여 개 스크립트의
       순차 로딩이 밀려서였다. 홈이 그릴 걸 다 그리고 브라우저가
       한가해지는 시점(requestIdleCallback)까지 미뤄서 먼저 홈을
       그리게 하고, 그 직후 미리 posts 모듈을 받아둔다. 실제로
       카테고리/글을 클릭할 때는 이 프리워밍이 이미 끝났거나
       진행 중이라 loadPostsModule()의 Promise 캐시를 그대로
       재사용할 뿐 다시 fetch하지 않는다.

       requestIdleCallback 미지원 브라우저(Safari 등)는 짧은
       setTimeout으로 대체.
    ========================================================== */

    if (
      typeof requestIdleCallback ===
      "function"
    ) {

      requestIdleCallback(
        loadPostsModule,
        {
          timeout: 2000
        }
      );

    }


    else {

      setTimeout(
        loadPostsModule,
        200
      );

    }

  </script>
