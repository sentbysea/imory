<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IMORY EDITORIAL — 렌더 하네스</title>

  <!--
    =========================================================
    EDITORIAL-DEFAULT-SKIN-2 렌더 하네스
    기준 문서: IMORY_EDITORIAL_DEFAULT_SKIN_DESIGN.md

    아이모리 기본 스킨(skin/skin-default-editorial.js)을 **실제
    renderSkin()** 으로 그린다. 판정은 재는 쪽
    (skin/skin-editorial-default-e2e-test.mjs)이 한다.

    공개 HOME 과 같이 문서가 아니라 #mount 가 스크롤한다
    (#themeMount.theme-mount--skin 과 같은 모양 — home-base.css).

    사진은 테스트 서버가 그 자리에서 만드는 색 SVG
    (/__test-photo/<n>.svg) — 사용자 원화를 쓰지 않는다. 손으로 볼 때
    그 경로가 없으면 사진 자리는 빈 틀로 남는다.

    쿼리(손으로 볼 때)
      columns=1|2|3   photos=0..4   pair=1   data=full|empty|many|long
      palette=light|dark   owner=1   layout=auto|empty|hero|pair|triptych
      dday=YYYY-MM-DD   mobile=0
    =========================================================
  -->

  <style>
    html, body { margin: 0; }
    body { font: 13px system-ui, sans-serif; background: #eee; }
    #mount {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  <div id="mount"></div>

  <script src="../core/lib/build-version.js"></script>
  <script src="./skin-layout.js"></script>
  <script src="./skin-transition.js"></script>
  <script src="./skin-sides.js"></script>
  <script src="./skin-settings.js"></script>
  <script src="./skin-sanitize.js"></script>
  <script src="./skin-template.js"></script>
  <script src="./skin-default-editorial.js"></script>

  <script type="module">

    import { renderSkin } from "./skin-render.js";

    const params = new URLSearchParams(location.search);

    const LONG_TITLE =
      "아주 긴 블로그 제목이 여러 줄로 넘어가도 표지가 무너지지 않는지 보는 제목 — The Quiet Afternoon Chronicle";

    const CATEGORY_SETS = {
      full: [["TXT", "post"], ["IMG", "gallery"], ["HIGHLIGHT", "highlight"]],
      many: [
        ["TXT", "post"], ["IMG", "gallery"], ["HIGHLIGHT", "highlight"], ["Letters", "post"],
        ["Reading Notes", "post"], ["여행의 조각들", "post"], ["Archive 2019–2026", "post"],
        ["부엌", "post"], ["음악", "post"], ["메모", "post"], ["사진첩", "gallery"], ["Drafts", "post"]
      ],
      long: [
        ["TXT", "post"], ["IMG", "gallery"],
        ["오래 걸려서 쓴 아주 긴 카테고리 이름이 잘리지 않는지 보는 칸", "post"],
        ["Supercalifragilisticexpialidocious-Chronicles", "post"], ["HIGHLIGHT", "highlight"]
      ],
      empty: []
    };

    function makeContext(o) {

      const kind = o.data || "full";

      const categories = CATEGORY_SETS[kind] || CATEGORY_SETS.full;

      const postCount = kind === "empty" ? 0 : kind === "many" || kind === "long" ? 10 : 4;

      const posts = Array.from({ length: postCount }, (_, i) => ({
        id: String(i + 1),
        title:
          i === 1 && kind === "long"
            ? "제목이 아주 길어서 좁은 오른쪽 영역에서 여러 줄로 감기는 글 — 잘리거나 겹치지 않아야 한다"
            : ["첫 장면", "창가에서 읽은 것", "An Ordinary Tuesday", "편지 쓰는 법", "여름 끝의 사진", "기차에서", "Notes on Light", "부엌의 시간", "오래된 노트", "밤산책"][i],
        href: `/test1/post/${i + 1}`,
        publishedAtLabel: `2026.09.${String(19 - i).padStart(2, "0")}`,
        isSecret: false
      }));

      const card = kind === "empty" ? null : {
        excerpt: "마음에 남은 문장은\n다시 읽을 때마다 조금씩 다른 얼굴을 한다.",
        sourcePathLabel: "TXT > 창가에서 읽은 것",
        color: "#6f86b8",
        hasNote: false,
        postHref: "/test1/post/2"
      };

      const images = {};

      const photos = Math.max(0, Math.min(4, Number(o.photos || 0)));

      for (let n = 1; n <= 4; n += 1) {
        images[`photo_${n}`] = n <= photos ? `/__test-photo/${n}.svg` : null;
      }

      images.pair_photo = o.pair ? "/__test-photo/pair.svg" : null;

      /* EDITORIAL-CUSTOMIZATION-1 — HOME 제목 로고 슬롯 */
      images.title_logo = o.logo ? "/__test-photo/logo.svg" : null;

      const title = kind === "long" ? LONG_TITLE : (o.title || "Forever, My Foe");

      const owner = o.owner === true;

      return {
        site: { title, slug: "test1", description: null, language: "ko" },
        profile: {
          nickname: kind === "empty" ? "" : "sentbysea",
          bio: kind === "empty" ? null : (o.bio || "Hong Jiwon × Moon Suyoung"),
          avatarUrl: null
        },
        navigation: {
          home: { name: title, href: "/test1", enabled: true, type: "home", iconKind: "home" },
          categories: categories.map(([name, type], i) => ({
            id: String(i + 1),
            name,
            type,
            iconKind: type === "gallery" ? "image" : type === "highlight" ? "quote" : "document",
            href: type === "highlight" ? "/test1/highlights" : `/test1/category/${i + 1}`,
            itemCount: null
          })),
          postCategories: [],
          galleryCategories: [],
          bannerCategories: [],
          highlights: {
            name: "HIGHLIGHT",
            href: "/test1/highlights",
            showStandaloneLink: false,
            iconKind: "quote"
          }
        },
        home: {
          recentPosts: posts,
          highlights: {
            cards: card ? [card] : [],
            featured: card ? [card] : [],
            card,
            hasCard: !!card,
            count: card ? 1 : 0,
            isEmpty: !card,
            hasError: false
          }
        },
        images,
        viewer: {
          isOwner: owner,
          writeHref: owner ? "/test1?write=1" : null,
          adminHref: owner ? "/test1/admin" : null,
          manageHref: null
        },
        page: { type: "home", isHome: true }
      };

    }

    let instance = null;

    function buildRegions(o) {

      /* EDITORIAL-CUSTOMIZATION-1 — Studio 에서 고치고 저장/공개한
         SkinPackage 를 그대로 그려 볼 수 있다(공개 화면이 Studio 와
         같은 결과인지 재는 쪽이 쓴다). 주면 생성기를 부르지 않는다. */
      const pkg =
        o.package || window.createImoryEditorialDefaultSkin({ columns: o.columns || 1 });

      let regions = pkg.regions;

      if (o.palette === "dark") {
        regions = window.writeSkinThemeColors(regions, window.IMORY_EDITORIAL_PALETTES.dark);
      } else if (o.palette && typeof o.palette === "object") {
        regions = window.writeSkinThemeColors(regions, o.palette);
      }

      if (o.layout) {
        regions = window.writeSkinHomePhotosLayout(regions, o.layout);
      }

      if (o.dday) {
        regions = window.writeSkinDday(regions, { enabled: true, date: o.dday.date, label: o.dday.label });
      }

      if (o.mobile === false) {
        regions = window.writeSkinSidesMobileSetting(regions, false);
      }

      return { pkg: { ...pkg, regions }, regions };

    }

    /* e2e 와 손으로 보는 사람이 같은 창구를 쓴다 */
    window.renderDefault = function (options) {

      const o = options || {};

      const { pkg } = buildRegions(o);

      const template = window.resolveSkinTemplate(pkg, o.page || "home");

      const context = makeContext(o);

      const mount = document.getElementById("mount");

      if (instance && o.fresh !== true) {
        instance.update(template, context);
      } else {
        if (instance) instance.destroy();
        instance = renderSkin({ container: mount, skin: template, context, mode: "view" });
      }

      return { template, regions: pkg.regions };

    };

    /* 공개 화면의 SPA 라우터 흉내 — 링크는 이 문서를 떠나지 않고 기록만 남는다 */
    window.harnessNavigations = [];

    document.addEventListener("click", (event) => {
      const link = event.target.closest && event.target.closest("a[href]");
      if (link) {
        event.preventDefault();
        window.harnessNavigations.push(link.getAttribute("href"));
      }
    });

    /* 스킨 CSS 가 저장 판정에서 선언을 하나라도 잃는가(csstree 는 CDN) */
    window.analyzeDefaultSkinCss = async function () {
      const mod = await import("./skin-css-validate.js");
      const pkg = window.createImoryEditorialDefaultSkin({ columns: 3 });
      const report = mod.analyzeSkinCss(pkg.css);
      const scoped = mod.validateAndScopeSkinCss(pkg.css, { namespace: "t" });
      return {
        ok: report.ok,
        changed: report.changed,
        issues: report.issues.map((i) => `${i.severity} ${i.line}:${i.column} ${i.message} — ${i.snippet}`),
        scopedOk: scoped.ok,
        scopedWarnings: (scoped.warnings || []).map(String),
        scopedCss: scoped.css || ""
      };
    };

    window.harnessReady =
      Promise.resolve(window.renderDefault({
        columns: Number(params.get("columns") || 1),
        photos: Number(params.get("photos") || 0),
        pair: params.get("pair") === "1",
        data: params.get("data") || "full",
        palette: params.get("palette") || "light",
        owner: params.get("owner") === "1",
        layout: params.get("layout") || undefined,
        dday: params.get("dday") ? { date: params.get("dday"), label: "since we met" } : undefined,
        mobile: params.get("mobile") === "0" ? false : undefined
      }));

  </script>

</body>
</html>
