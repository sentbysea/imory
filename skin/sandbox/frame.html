<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Imory Skin Sandbox Frame</title>

  <!--
    =========================================================
    IMORY SKIN SANDBOX — FRAME 문서 (SANDBOX-1)

    기준 문서: IMORY_SANDBOX_SKIN_DESIGN.md §E SANDBOX-1

    ★ 이 문서는 **별도 origin에서만** 서빙된다.
      functions/_middleware.js가
        - sandbox host: /skin/sandbox/ 아래 허용 목록만 200,
          나머지(앱 전체 포함)는 404
        - 메인 origin(imory.me): 이 경로를 404
      로 갈라 준다. 그 분기는 정리정돈이 아니라 **보안 장치**다 —
      allow-scripts + allow-same-origin의 안전성이 전적으로
      "origin이 실제로 다르다"에 달려 있기 때문이다(설계 문서 §D-4).

    ★ 이 문서에 없는 것 (의도적)
      supabase client · 인증 · 관리자 코드 · skin-context builder.
      여기는 렌더러 자리이지 데이터 클라이언트가 아니다. 조회와
      Context 조립은 전부 부모가 오늘처럼 한다(CLAUDE.md §2).
      CSP의 connect-src 'none'이 그 원칙을 헤더로도 못박는다.

    ★ SANDBOX-1에서 더해진 것
      skin/skin-render.js(ES 모듈)와 그것이 정적 import하는
      skin-css-validate.js / core/content-width.js. 공개 화면과
      **같은 렌더러**를 쓰기 위해서다 — 새 렌더러를 만들지 않는다.
      정적 import에는 ?v=가 붙지 않으므로 이 문서도 자기 몫의
      import map을 스스로 선언한다(iframe은 부모의 import map도
      캐시 상태도 물려받지 않는다 — studio/preview/preview-frame.html이
      이미 겪은 함정).

    ★ 인라인 script · style 블록과 nonce
      아래 인라인 블록들은 **속성 없이**, 여는 태그가 이름 하나로
      끝나는 형태로 적어야 한다. functions/_middleware.js가 응답을
      내보낼 때 그 형태를 찾아 nonce를 끼우고, 같은 nonce를 CSP
      헤더에 넣는다. 속성을 붙이면 nonce가 안 들어가고 CSP가 그
      블록을 막아 프레임이 아예 뜨지 않는다.

      import map은 document.write로 만들어지므로 **parser-inserted
      인라인 script**다 — CSP 검사를 그대로 받는다. 그래서 아래
      블록이 자기 nonce(document.currentScript.nonce)를 읽어
      writeVersionedImportMap()에 넘긴다. renderSkin()이 만드는
      동적 style 요소도 같은 값을 받는다(window.__imorySandboxNonce).

      이 주석 안에서 그 여는 태그를 글자 그대로 쓰지 않는 이유:
      주입기는 문자열을 그대로 찾는 단순한 함수라, 주석에 적힌
      글자에도 nonce를 끼워 넣는다(배포 실측). 동작에는 지장이
      없지만 서빙되는 문서에 쓸데없는 값이 남는다.
    =========================================================
  -->

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      /*
        이중 스크롤 금지(CLAUDE.md §2). 부모 iframe은
        scrolling="no"이고, 높이는 IMORY_HEIGHT가 맞춘다 —
        프레임 안에 스크롤 막대가 생기면 안 된다.
      */
      overflow: hidden;

      /*
        프레임 자신은 배경을 칠하지 않는다. html/body가 둘 다
        투명하면 iframe 자체가 투명해져서 **부모 페이지의 배경이
        그대로 비친다** — 그래야 sandbox HOME이 native HOME과
        같은 바탕 위에 놓인다. 스킨이 자기 배경을 칠하면 그것이
        그대로 보인다.
      */
      background: transparent;
    }

    #sandboxFrameRoot {
      /* 모바일 390px에서도 가로로 넘치지 않게 */
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    /*
      오류 화면 — 짧은 고정 문구 하나뿐이다. 민감한 원문도 stack도
      절대 여기 쓰지 않는다(설계 문서 §8 / 지시문 8절). 평소에는
      hidden이고, 부모는 이 화면을 보기 전에 보통 native로 폴백한다.
    */
    #sandboxFrameNotice {
      display: none;

      padding: 16px;
      text-align: center;

      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;

      font-size: 13px;
      letter-spacing: 0.06em;
      color: #888888;
    }

    #sandboxFrameNotice[data-visible="1"] {
      display: block;
    }

  </style>

  <!-- =========================================================
       배포 버전 원천 — 이 파일만 ?t= 로 받는다

       iframe은 독립된 browsing context라 부모의 import map도
       캐시 상태도 물려받지 않는다. 그래서 이 문서가 자기 몫의
       ?t= -> ?v= 사슬을 **스스로** 선언한다.
       배경: core/lib/build-version.js 상단 주석.
  ========================================================== -->

  <script>

    document.write(
      '<script src="/core/lib/build-version.js?t=' +
      Date.now() +
      '"><' + '/script>'
    );

  </script>


  <script>

    /*
      이 블록의 nonce를 한 번 읽어 둔다. 쓰이는 곳은 둘이다:
        1) import map (아래 writeVersionedImportMap)
        2) renderSkin()이 만드는 동적 style 요소
           (skin/sandbox/skin-sandbox-frame.js -> skin/skin-render.js)

      ★ SANDBOX-5A — 이제 저자 JS 가 이 문서에서 실행된다.
      그래서 bridge 가 시작하자마자 이 값을 자기 안으로 옮겨 담고
      window 에서 지운다(skin/sandbox/skin-sandbox-frame.js start()).

      ★ 그것은 **정리이지 은닉이 아니다.**

      nonce 는 "이 script 를 실행해도 된다"는 **허가 표식**이지,
      임의 JS 가 돈 뒤까지 지켜지는 비밀이 아니다. 이미 실행 중인
      저자 코드는 자기 script 요소의 document.currentScript.nonce 나
      이 realm 의 다른 요소가 가진 nonce 프로퍼티로 그 값을 **읽을
      수 있다**(브라우저는 getAttribute("nonce") 만 가리고 IDL
      프로퍼티는 same-origin 에 그대로 준다).

      그래도 지우는 이유는 노출 면을 줄이는 것 하나다 — 우리가
      계약으로 약속한 적 없는 전역 이름을 남겨 두지 않는다. 이
      값을 읽어 저자가 script 를 하나 더 붙여도 얻는 것은 없다:
      그는 이미 이 realm 에서 임의 코드를 돌리고 있다.

      실제 경계는 nonce 가 아니라 **별도 origin · CSP
      (connect-src 'none' 등) · iframe sandbox 속성 · 부모가 쥔
      이동 표**다. 그 넷 중 어느 것도 nonce 가 비밀이라는 가정에
      기대지 않는다.

      계약으로 지키는 것: nonce 는 SkinPackage 에도 부모 메시지
      payload 에도 **실리지 않는다**(프레임 밖으로 나가지 않는다).
    */

    window.__imorySandboxNonce =
      document.currentScript ? document.currentScript.nonce : "";


    /* =====================================================
       본문(POST region)이 기대는 class 규칙 — SANDBOX-3.2

       IMORY_POST_BODY 로 오는 본문은 **인라인 선언**만 가지고
       온다(부모가 프리셋 값을 검증해 nonce 가 붙은 style 요소로
       옮긴다 — posts/style/posts-body-style-extract.js). 그런데
       본문에는 프리셋과 무관한 고정 규칙도 필요하다:
       형광펜의 좌우 여백과 줄바꿈 처리, 강조선 **마커**를
       숨기는 것, 복사 상자·메모·구분선의 모양.

       그 규칙들은 스타일시트에만 있고, 이 문서는 그것을 읽지
       않았다 — 2026-09-15 실측: 프레임의 형광펜은 좌우 여백이
       0이고 줄이 바뀌면 띠가 잘렸으며,
       <span class="post-para-rule"> 마커가 display:none 이
       아니라 인라인 상자로 남았다.

       공개 화면과 **같은 파일**을 읽는다. CSP style-src 'self' 가
       허용하며, 두 경로는 core/lib/skin-sandbox-server.js 의
       SANDBOX_ALLOWED_PATHS 에 적혀 있어야 나온다.

       ★ 스킨 CSS 보다 **먼저** 붙어야 한다. renderSkin() 이
         만드는 style 요소는 렌더 시점에 append 되므로 항상 뒤다 —
         같은 특정도면 스킨이 이긴다(native 와 같은 관계).
    ====================================================== */

    loadVersionedStyles(
      [
        "/posts/posts-body-shared.css",
        "/posts/posts-body-blocks.css",

        /* 배치 primitive(IMORY_LAYOUT_PRIMITIVE_DESIGN.md).
           renderSkin() 도 없으면 스스로 걸지만, 여기서 미리
           걸어야 첫 페인트부터 배치가 맞는다. */
        "/skin/skin-layout.css",

        /* 전환 primitive — 공개 화면과 같은 파일
           (IMORY_TRANSITION_PRIMITIVE_DESIGN.md) */
        "/skin/skin-transition.css"
      ]
    );


    /*
      ★ import map은 이 문서의 첫 module script보다 **먼저**
      삽입되어야 한다. 순서를 바꾸면 브라우저가 표를 통째로
      무시하고("An import map is added after module script load
      was triggered") 정적 import가 ?v= 없이 나간다.
    */

    writeVersionedImportMap(
      [
        "/skin/skin-render.js",
        "/skin/skin-css-validate.js",
        "/core/content-width.js"
      ],
      window.__imorySandboxNonce
    );


    /*
      순수 classic script 다섯. skin-sanitize.js는 skin-render.js가
      전역 sanitizeSkinHTML()/isSafeSkinUrl()로 의존한다 —
      classic script는 module보다 먼저 실행되므로 순서가 보장된다.

      ★ SANDBOX-5A — skin-sandbox-author-js.js 가 다섯째다.
      저자 JS 를 실제로 실행하는 유일한 파일이고, **이 문서에만**
      로드된다(부모·Studio 문서에는 없다). 실행 판정과 API 계약은
      그 파일 상단 주석에 있다.
    */

    loadVersionedScripts(
      [
        /* 배치 primitive — sanitize 보다 먼저
           (IMORY_LAYOUT_PRIMITIVE_DESIGN.md) */
        "/skin/skin-layout.js",
        "/skin/skin-transition.js",
        "/skin/skin-sanitize.js",
        "/skin/sandbox/skin-sandbox-config.js",
        "/skin/sandbox/skin-sandbox-protocol.js",
        "/skin/sandbox/skin-sandbox-context.js",
        "/skin/sandbox/skin-sandbox-author-js.js",

        /*
          ★ SANDBOX-6A — Element Inspector(Select).

          skin-inspect-target.js 가 **먼저**다: "이 요소를 고를 수
          있는가"의 규칙 하나를 Studio 문서 · native Preview 문서 ·
          이 문서 셋이 같은 파일로 읽는다(복붙하면 느슨한 쪽이
          생긴다). 관리 화면 쪽 경로는 이 origin 에서 여전히 404
          이므로 그 규칙만 skin/ 으로 옮긴 것이다 —
          skin/skin-inspect-target.js 머리말 참고.

          Inspect 가 꺼져 있는 동안 이 둘은 화면에 아무 영향도 주지
          않는다(리스너는 전부 첫 줄에서 빠져나간다).
        */

        "/skin/skin-inspect-target.js",

        /* SANDBOX-SELECT-PARITY-1 — 선택 우선순위 · 겹친 후보 ·
           더블클릭 글자 편집 · 본체 끌기. Inspector 보다 먼저다
           (Inspector 가 만들어질 때 이 함수를 찾는다). */
        "/skin/sandbox/skin-sandbox-inspect-direct.js",
        "/skin/sandbox/skin-sandbox-inspect.js"
      ]
    );


    /*
      bridge는 ES 모듈이다 — renderSkin()을 정적 import한다.
      (SANDBOX-0에서는 classic이었다. 렌더러가 들어오면서
       모듈이 됐고, 그래서 위 import map이 필요해졌다.)
    */

    loadVersionedModules(
      [
        "/skin/sandbox/skin-sandbox-frame.js"
      ]
    );

  </script>

</head>


<body>

  <div id="sandboxFrameRoot"></div>

  <div id="sandboxFrameNotice">화면을 불러오지 못했습니다.</div>

</body>

</html>
