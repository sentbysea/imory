  <title>SKIN SANDBOX — 부모 쪽 하네스 (SANDBOX-1)</title>

  <!--
    =========================================================
    기준 문서: IMORY_SANDBOX_SKIN_DESIGN.md §E SANDBOX-1

    이 문서는 **부모 쪽**이다. 실제 공개 경로(index.html ->
    skin/skin-home.js)가 하는 일 중 **조회를 뺀 전부**를 그대로
    한다:

      resolveSkinRenderMode(pkg)          <- 진짜 함수
      resolveSkinTemplate(pkg, "home")    <- 진짜 함수
      projectSkinContextForSandbox(...)   <- 진짜 함수
      mountSandboxSkin(...)               <- 진짜 함수

    Context만 supabase 없이 손으로 만든 고정값이다(아래
    buildFixtureHomeContext) — 그래야 native 렌더와 sandbox 렌더가
    **같은 재료**를 받는지 글자 단위로 비교할 수 있다.

    ★ 켜는 법 (로컬 개발에서만)
      1. 저장소 루트에서 정적 서버 둘을 띄운다. 포트가 다르면
         origin이 갈린다(같은 localhost라도).
      2. 부모:  http://localhost:8957/skin/skin-sandbox-test.html
                  ?sandboxSkin=1
                  &sandboxSkinOrigin=http://localhost:8958
      3. frame: http://localhost:8958/skin/sandbox/frame

      배포된 imory.me에서 같은 주소를 열면 플래그가 **꺼진 채**
      뜬다 — isSandboxSkinEnabled()가 hostname부터 본다
      (skin/sandbox/skin-sandbox-config.js).

    ★ 쿼리
      ?sandboxSkin=1          기능 플래그 opt-in
      ?sandboxSkinOrigin=...  frame origin (dev 전용)
      ?native=1               native 렌더도 함께 그린다(비교용)
      ?renderMode=native      fixture의 renderMode를 바꿔서 본다
      ?authorJs=1             저자 JS 가 든 fixture 를 쓴다(SANDBOX-5A).
                              실행되려면 ?sandboxSkinJs=1 도 함께 줘야
                              한다 — 저자 JS 는 sandbox 플래그와 **별도**
                              opt-in 이다(skin/sandbox/skin-sandbox-config.js)
      ?tall=1                 긴 콘텐츠(높이 반영 확인)

      자동 판정은 skin/sandbox/skin-sandbox-e2e-test.mjs가 한다.
    =========================================================
  -->

    */

<body>

  <script>

         그것들을 떨어뜨리는지 e2e가 직접 본다.
    ========================================================== */

      const card =
        {

      return {

        },

        },

        navigation: {

          home: {
            id: null,
            name: "SANDBOX DEMO",
            href: "/demo/",
            enabled: true,
            type: "home",
            iconKind: "home"
          },

          categories: [
            { id: "1", name: "TXT", type: "post", iconKind: "post", href: "/demo/category/1", itemCount: null },
            { id: "2", name: "PIC", type: "gallery", iconKind: "gallery", href: "/demo/category/2", itemCount: null },
            { id: "3", name: "HIGHLIGHTS", type: "highlight", iconKind: "highlight", href: "/demo/highlights", itemCount: null }
          ],

          ],

          galleryCategories: [
            { id: "2", name: "PIC", type: "gallery", iconKind: "gallery", href: "/demo/category/2", itemCount: null }
          ],

          textPostCategories: [
            { id: "1", name: "TXT", type: "post", iconKind: "post", href: "/demo/category/1", itemCount: null }
          ],

        },

        },

          },

          recentPosts

        },


        /* =====================================================
           ★ 여기부터는 **절대 프레임에 가면 안 되는 것**이다.
             투영 함수(skin/sandbox/skin-sandbox-context.js)가
             알려진 키만 옮기므로 구조적으로 걸러진다. e2e의
             [payload] 절이 실제 postMessage를 가로채 확인한다.
        ====================================================== */

        __ownerId: "11111111-2222-3333-4444-555555555555",
        __accessToken: "eyJhbGciOi.FAKE.TOKEN",
        __refreshToken: "FAKE-REFRESH",
        __email: "owner@example.com",
        __secretBody: "비밀글 본문 원문",
        __skinId: "skin-row-id",
        __versionId: "version-row-id",

    window.buildFixtureHomeContext =

  <script>

    window.addEventListener(
      "load",
      async function () {

        const params =
          new URLSearchParams(window.location.search);


        const flagOn =
          isSandboxSkinEnabled(window);

        const frameOrigin =
          resolveSandboxSkinFrameOrigin(window);


        const flagEl =
          document.getElementById("outFlag");

        flagEl.textContent =
          flagOn ? "ON" : "OFF (기본값)";

        flagEl.className =
          flagOn ? "state-on" : "state-off";

        document.getElementById("outParentOrigin").textContent =
          window.location.origin;

        document.getElementById("outFrameOrigin").textContent =
          frameOrigin || "(없음 — sandbox 경로를 쓰지 않는다)";


        /* --- fixture SkinPackage 가져오기 --------------- */

        let skinPackage;

        /*
          ★ SANDBOX-5A — ?authorJs=1 이면 **다른 fixture** 를 읽는다.

          기존 fixture(imory-sandbox-home-v1.json)에 js 를 더하지
          않은 이유: 그 파일은 "native 렌더와 outerHTML 이 글자
          단위로 같다"를 재는 데 쓰이는데, 저자 JS 는 바로 그 DOM 을
          바꾼다. 두 성질을 한 파일에 담으면 둘 다 흐려진다.
        */

        const fixtureName =
          params.get("authorJs") === "1"
            ? "imory-sandbox-authorjs-v1.json"
            : "imory-sandbox-home-v1.json";

        try {

          const response =
            await fetch(
              "/skin/test-skins/" + fixtureName + "?v=" +
              encodeURIComponent(APP_BUILD_VERSION)
            );

          skinPackage =
            await response.json();

        }

        catch (err) {

          document.getElementById("outMount").textContent =
            "fixture 스킨을 못 읽었다";

          window.__sandboxHarnessResult =
            { ok: false, reason: "no-fixture" };

          return;

        }


        if (params.get("renderMode") === "native") {
          delete skinPackage.renderMode;
        }


        /* =====================================================
           ★ SANDBOX-5A — e2e 가 자기 코드를 끼워 넣는 자리

           보안 검증(부모 DOM · 부모 localStorage · top.location ·
           window.open · form 제출 · fetch/XHR/WebSocket/
           EventSource/sendBeacon · 외부 script/module · 알 수 없는
           postMessage · 관리자 URL 이동)은 **탈출을 시도하는 코드**
           를 실제로 돌려 봐야 판정할 수 있다.

           그 코드를 저장소의 fixture 에 넣지 않는다 — fixture 는
           "정상적으로 쓰는 JS"의 본보기여야 하고, 공격 코드는
           그것을 기대하는 테스트 파일 옆에 있는 편이 읽기 쉽다.
           그래서 하네스는 값이 있으면 그대로 js 로 쓴다.

           이 창구는 **테스트 하네스에만** 있다. 공개 경로(index.html)
           에도, Studio 에도 없다.
        ====================================================== */

        if (typeof window.__sandboxHarnessAuthorJsOverride === "string") {
          skinPackage.js = window.__sandboxHarnessAuthorJsOverride;
        }


        const renderMode =
          resolveSkinRenderMode(skinPackage);

        document.getElementById("outRenderMode").textContent =
          renderMode;


        const template =
          resolveSkinTemplate(skinPackage, "home");


        const context =
          buildFixtureHomeContext({
            tall: params.get("tall") === "1"
          });


        window.__sandboxHarnessContext =
          context;

        window.__sandboxHarnessTemplate =
          template;


        /* --- native 비교 렌더 ---------------------------- */

        if (params.get("native") === "1") {

          /*
            ★ native 쪽에도 **투영된 Context**를 준다. 두 화면의
            차이가 "어디에 그렸는가" 하나로 좁혀져야 innerHTML
            비교가 의미를 갖는다(viewer 같은 값이 다르면 당연히
            다르게 그려진다 — 그건 투영 함수의 결정이지 렌더러
            차이가 아니다).
          */

          const projected =
            projectSkinContextForSandbox(context, "home");

          window.renderSkin({
            container: document.getElementById("nativeMount"),
            skin: template,
            context: projected,
            mode: "view"
          });

        }


        /* --- sandbox 렌더 -------------------------------- */

        window.__sandboxHarnessErrors = [];

        /*
          ★ 실제로 프레임에 건너가는 값. mountSandboxSkin()이 같은
          입력으로 **같은 함수**를 부르므로, 이것이 곧 wire 위의
          data다. e2e의 [payload] 절이 여기서 금지 필드가 하나도
          없다는 것을 확인하고, 프레임 쪽에서 실제로 도착한 값도
          따로 확인한다(window.__imorySandboxLastReceived).
        */

        window.__sandboxProjected =
          projectSkinContextForSandbox(context, "home");


        if (renderMode !== "sandbox") {

          document.getElementById("outMount").textContent =
            "native (sandbox 경로를 타지 않는다)";

          window.__sandboxHarnessResult =
            { ok: false, reason: "not-sandbox" };

          return;

        }


        const host =
          await window.skinSandboxHostReady;

        const result =
          await host.mountSandboxSkin({
            container: document.getElementById("sandboxMount"),
            pageType: "home",
            template,
            context,
            onError: (reason) => {
              window.__sandboxHarnessErrors.push(reason);
            }
          });

        document.getElementById("outMount").textContent =
          result.ok ? "ok" : ("폴백 — reason: " + result.reason);


        const iframe =
          document.querySelector("iframe.imory-skin-sandbox-frame");

        document.getElementById("outHeight").textContent =
          iframe ? iframe.style.height : "-";


        window.__sandboxHarnessHandle =
          result.ok ? result.handle : null;

        window.__sandboxHarnessResult =
          result.ok ? { ok: true } : { ok: false, reason: result.reason };

      }
    );

  </script>

</body>
